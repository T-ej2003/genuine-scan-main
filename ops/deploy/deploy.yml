---
- name: Deploy MSCQR active and standby instances
  hosts: mscqr_servers
  become: yes
  serial: 1

  vars:
    app_dir: /home/ubuntu/genuine-scan-main
    branch: main
    deploy_ref: "origin/{{ branch }}"
    qr_sign_provider: "{{ lookup('env', 'QR_SIGN_PROVIDER') | default('env', true) }}"
    qr_sign_private_key: "{{ lookup('env', 'QR_SIGN_PRIVATE_KEY') }}"
    qr_sign_public_key: "{{ lookup('env', 'QR_SIGN_PUBLIC_KEY') }}"
    qr_sign_active_key_version: "{{ lookup('env', 'QR_SIGN_ACTIVE_KEY_VERSION') }}"
    qr_sign_enforce_ed25519: "{{ lookup('env', 'QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION') | default('true', true) }}"
    qr_sign_private_key_format: >-
      {%- set v = qr_sign_private_key | trim -%}
      {%- if not v -%}missing
      {%- elif '\\n' in v or '\\r\\n' in v -%}escaped_newline_pem
      {%- elif '-----BEGIN ' in v and '\n' in v -%}multiline_pem
      {%- elif v.startswith('-----BEGIN ') and ' -----END ' in v -%}single_line_pem
      {%- elif '-----BEGIN ' not in v and (v | length) >= 32 -%}base64_wrapped_pem_or_invalid
      {%- else -%}invalid
      {%- endif -%}
    qr_sign_public_key_format: >-
      {%- set v = qr_sign_public_key | trim -%}
      {%- if not v -%}missing
      {%- elif '\\n' in v or '\\r\\n' in v -%}escaped_newline_pem
      {%- elif '-----BEGIN ' in v and '\n' in v -%}multiline_pem
      {%- elif v.startswith('-----BEGIN ') and ' -----END ' in v -%}single_line_pem
      {%- elif '-----BEGIN ' not in v and (v | length) >= 32 -%}base64_wrapped_pem_or_invalid
      {%- else -%}invalid
      {%- endif -%}
    qr_sign_compose_environment:
      QR_SIGN_PROVIDER: "{{ qr_sign_provider }}"
      QR_SIGN_PRIVATE_KEY: "{{ qr_sign_private_key }}"
      QR_SIGN_PUBLIC_KEY: "{{ qr_sign_public_key }}"
      QR_SIGN_ACTIVE_KEY_VERSION: "{{ qr_sign_active_key_version }}"
      QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION: "{{ qr_sign_enforce_ed25519 }}"

  tasks:
    - name: Validate deploy ref
      assert:
        that:
          - deploy_ref is match('^[A-Za-z0-9._/+-]+$')
        fail_msg: "deploy_ref contains unsupported characters."

    - name: Confirm app directory exists
      stat:
        path: "{{ app_dir }}"
      register: app_dir_stat

    - name: Stop if app directory is missing
      fail:
        msg: "App directory {{ app_dir }} does not exist on {{ inventory_hostname }}."
      when: not app_dir_stat.stat.exists

    - name: Show target instance
      debug:
        msg: "Deploying {{ inventory_hostname }} from {{ deploy_ref }}"

    - name: Check git working tree before deploy
      command: git status --short
      args:
        chdir: "{{ app_dir }}"
      register: git_status
      changed_when: false

    - name: Stop if server has uncommitted local changes
      fail:
        msg: "Server {{ inventory_hostname }} has uncommitted changes. Refusing to overwrite: {{ git_status.stdout }}"
      when: git_status.stdout | length > 0

    - name: Fetch latest code
      command: git fetch --prune origin {{ branch }}
      args:
        chdir: "{{ app_dir }}"

    - name: Reset to requested deploy ref
      command: git reset --hard {{ deploy_ref }}
      args:
        chdir: "{{ app_dir }}"

    - name: Capture deployed commit
      command: git rev-parse HEAD
      args:
        chdir: "{{ app_dir }}"
      register: deployed_commit
      changed_when: false

    - name: Build Docker Compose release environment
      set_fact:
        release_compose_environment: "{{ qr_sign_compose_environment | combine({'RELEASE_GIT_SHA': deployed_commit.stdout, 'GIT_SHA': deployed_commit.stdout}) }}"

    - name: Install dependencies
      command: npm ci
      args:
        chdir: "{{ app_dir }}"

    - name: Run SEO guardrail
      command: npm run verify:seo
      args:
        chdir: "{{ app_dir }}"

    - name: Run typecheck
      command: npm run typecheck
      args:
        chdir: "{{ app_dir }}"

    - name: Build app
      command: npm run build
      args:
        chdir: "{{ app_dir }}"

    - name: Run production guardrails
      command: npm run verify:guardrails
      args:
        chdir: "{{ app_dir }}"

    - name: Validate QR signing deploy secrets are present
      assert:
        that:
          - qr_sign_provider | length > 0
          - qr_sign_private_key | length > 0
          - qr_sign_public_key | length > 0
          - qr_sign_active_key_version | length > 0
          - qr_sign_enforce_ed25519 | length > 0
        fail_msg: "QR signing deploy secrets are missing from the Ansible controller environment."

    - name: Show safe QR signing deploy preflight
      debug:
        msg:
          - "QR_SIGN_PROVIDER={{ qr_sign_provider }}"
          - "QR_SIGN_PRIVATE_KEY_PRESENT={{ (qr_sign_private_key | length > 0) | ternary('true', 'false') }}"
          - "QR_SIGN_PUBLIC_KEY_PRESENT={{ (qr_sign_public_key | length > 0) | ternary('true', 'false') }}"
          - "QR_SIGN_ACTIVE_KEY_VERSION_PRESENT={{ (qr_sign_active_key_version | length > 0) | ternary('true', 'false') }}"
          - "QR_SIGN_PRIVATE_KEY_FORMAT={{ qr_sign_private_key_format }}"
          - "QR_SIGN_PUBLIC_KEY_FORMAT={{ qr_sign_public_key_format }}"

    - name: Build production Docker Compose services
      command: docker compose --profile worker build backend worker frontend
      args:
        chdir: "{{ app_dir }}"
      environment: "{{ release_compose_environment }}"
      no_log: true

    - name: Preflight QR signing runtime configuration
      command: docker compose run --rm --no-deps backend node dist/scripts/qrSigningPreflight.js
      args:
        chdir: "{{ app_dir }}"
      environment: "{{ release_compose_environment }}"
      no_log: true

    - name: Restart production Docker Compose services
      command: docker compose --profile worker up -d --no-build redis backend worker frontend
      args:
        chdir: "{{ app_dir }}"
      environment: "{{ release_compose_environment }}"
      no_log: true

    - name: Assert MinIO containers are not running in production
      shell: >
        docker ps --format '{{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Image{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}'
        | awk 'BEGIN{IGNORECASE=1} $1 ~ /(^|[-_])minio([-_]|$)/ || $2 ~ /^minio\/(minio|mc)(:|$)/ {print}'
      register: production_minio_runtime
      changed_when: false
      failed_when: production_minio_runtime.stdout | length > 0

    - name: Show Docker Compose status
      command: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false
      environment: "{{ release_compose_environment }}"
      no_log: true

    - name: Print deployed commit and Docker Compose status
      debug:
        msg:
          - "Commit: {{ deployed_commit.stdout }}"
          - "Docker Compose status check completed; output suppressed because the compose environment carries QR signing secrets."

- name: Verify public active production URL
  hosts: active
  gather_facts: false
  tasks:
    - name: Check public healthz
      uri:
        url: https://www.mscqr.com/healthz
        method: GET
        status_code: 200
        follow_redirects: none
      register: public_healthz_check
      retries: 5
      delay: 5
      until: public_healthz_check.status == 200

    - name: Probe homepage without following redirects
      uri:
        url: https://www.mscqr.com/
        method: GET
        status_code:
          - 200
          - 301
          - 302
          - 303
          - 307
          - 308
        follow_redirects: none
      register: homepage_check
      retries: 5
      delay: 5
      until: homepage_check.status == 200
      failed_when: false

    - name: Capture homepage redirect-chain evidence
      command: >
        curl -sS -I -L --max-redirs 8
        -w '\nfinal_url=%{url_effective}\nhttp_status=%{http_code}\nredirects=%{num_redirects}\n'
        https://www.mscqr.com/
      register: homepage_redirect_chain
      changed_when: false
      failed_when: false
      when: homepage_check.status | default(0) != 200

    - name: Fail when homepage is not HTTP 200
      fail:
        msg:
          - "Expected https://www.mscqr.com/ to return HTTP 200 without redirects."
          - "Observed status={{ homepage_check.status | default('unknown') }} location={{ homepage_check.location | default('none') }}"
          - "Redirect-chain stdout={{ homepage_redirect_chain.stdout_lines | default([]) }}"
          - "Redirect-chain stderr={{ homepage_redirect_chain.stderr_lines | default([]) }}"
      when: homepage_check.status | default(0) != 200

    - name: Check robots.txt
      uri:
        url: https://www.mscqr.com/robots.txt
        method: GET
        status_code: 200
      register: robots_check
      retries: 5
      delay: 5
      until: robots_check.status == 200

    - name: Check sitemap.xml
      uri:
        url: https://www.mscqr.com/sitemap.xml
        method: GET
        status_code: 200
      register: sitemap_check
      retries: 5
      delay: 5
      until: sitemap_check.status == 200
