# Local Compose overrides are intentionally local-only. Production deploys use
# docker-compose.yml by itself, where MinIO is absent from the service graph.
# Define MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, OBJECT_STORAGE_ACCESS_KEY, and
# OBJECT_STORAGE_SECRET_KEY in the project-root .env or shell environment before
# enabling the local-minio profile.
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: genuine-scan-minio
    profiles:
      - local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in environment or .env for local MinIO}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in environment or .env for local MinIO}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: genuine-scan-minio-init
    profiles:
      - local-minio
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in environment or .env for local MinIO} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in environment or .env for local MinIO} &&
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-mscqr-artifacts}"
    networks:
      - app

volumes:
  minio_data:
