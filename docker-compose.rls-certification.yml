name: mscqr-full-rls-certification

services:
  rls-cert-postgres:
    image: public.ecr.aws/docker/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: mscqr-full-rls-certification-postgres
    restart: "no"
    # The disposable clean-room harness requires every green-database session
    # to be owned by the certification process. PostgreSQL autovacuum would
    # otherwise enter short-lived candidates independently and correctly trip
    # the fail-closed pg_stat_activity gate.
    command: ["postgres", "-c", "autovacuum=off"]
    environment:
      POSTGRES_DB: mscqr_full_rls_admin
      POSTGRES_USER: mscqr_rls_cert_admin
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mscqr_rls_cert_admin -d mscqr_full_rls_admin"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql
