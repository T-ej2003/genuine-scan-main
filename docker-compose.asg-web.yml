services:
  backend:
    image: genuine-scan-backend:${GIT_SHA:-unknown}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-unknown}
        RUN_VERIFY: ${DOCKER_BUILD_VERIFY:-false}
    container_name: genuine-scan-backend
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-4000}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-unknown}
      RUN_DB_MIGRATIONS_ON_START: ${RUN_DB_MIGRATIONS_ON_START:-false}
      RUN_BACKGROUND_WORKERS: "false"
      REDIS_URL: ${REDIS_URL:?Set shared regional REDIS_URL for ASG web nodes}
      REDIS_TLS: ${REDIS_TLS:-true}
      AWS_REGION: ${AWS_REGION:-${OBJECT_STORAGE_REGION:?Set OBJECT_STORAGE_REGION or AWS_REGION for ASG web nodes}}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-${AWS_REGION:?Set AWS_REGION or OBJECT_STORAGE_REGION for ASG web nodes}}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set shared regional OBJECT_STORAGE_BUCKET for ASG web nodes}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      QR_SIGN_PROVIDER: ${QR_SIGN_PROVIDER:-env}
      QR_SIGN_ACTIVE_KEY_VERSION: ${QR_SIGN_ACTIVE_KEY_VERSION:?Set QR_SIGN_ACTIVE_KEY_VERSION in the deployment environment}
      QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION: ${QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION:-true}
      QR_SIGN_PRIVATE_KEY: ${QR_SIGN_PRIVATE_KEY:?Set QR_SIGN_PRIVATE_KEY as base64-wrapped PEM or escaped-newline PEM}
      QR_SIGN_PUBLIC_KEY: ${QR_SIGN_PUBLIC_KEY:?Set QR_SIGN_PUBLIC_KEY as base64-wrapped PEM or escaped-newline PEM}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        GIT_SHA: ${GIT_SHA:-unknown}
        RELEASE_GIT_SHA: ${RELEASE_GIT_SHA:-unknown}
        RUN_VERIFY: ${DOCKER_BUILD_VERIFY:-false}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: genuine-scan-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SSL_ENABLED: ${SSL_ENABLED:-auto}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:4000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app

networks:
  app:
    driver: bridge
