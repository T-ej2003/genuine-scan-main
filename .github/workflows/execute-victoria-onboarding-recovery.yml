name: Execute fixed Victoria onboarding recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: victoria-failed-onboarding-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-victoria-recovery
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify exact protected-main source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Capture authenticated protected-environment approval
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          directory="$RUNNER_TEMP/victoria-recovery-approval"
          mkdir -m 700 "$directory"
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$directory/approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production-victoria-recovery \
            --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" \
            --require-actual-approval
          echo "VICTORIA_RECOVERY_APPROVAL_FILE=$directory/approval.json" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-victoria-recovery-operator
          aws-region: eu-west-2
          allowed-account-ids: '368992683803'
          role-session-name: victoria-recovery-${{ github.run_id }}
          unset-current-credentials: true
      - name: Build and publish the fixed executor image
        id: image
        env:
          SOURCE_SHA: ${{ github.sha }}
          ECR_REPOSITORY_URL: ${{ vars.VICTORIA_RECOVERY_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          [[ "$ECR_REPOSITORY_URL" =~ ^368992683803\.dkr\.ecr\.eu-west-2\.amazonaws\.com/mscqr-victoria-recovery$ ]]
          aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
          tag="recovery-${SOURCE_SHA}-${GITHUB_RUN_ID}"
          docker buildx build --platform linux/amd64 --push \
            --file infra/aws/terraform/production-victoria-recovery/Dockerfile \
            --build-arg "GIT_SHA=$SOURCE_SHA" --tag "$ECR_REPOSITORY_URL:$tag" .
          digest="$(aws ecr describe-images --region eu-west-2 --repository-name mscqr-victoria-recovery --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "uri=$ECR_REPOSITORY_URL@$digest" >> "$GITHUB_OUTPUT"
      - name: Register fixed immutable task definition
        id: task
        env:
          VICTORIA_RECOVERY_IMAGE: ${{ steps.image.outputs.uri }}
          VICTORIA_RDS_HOST: ${{ vars.VICTORIA_RECOVERY_RDS_HOST }}
          VICTORIA_RECOVERY_EVIDENCE_BUCKET: ${{ vars.VICTORIA_RECOVERY_EVIDENCE_BUCKET }}
          VICTORIA_RECOVERY_SIGNING_KEY_ARN: ${{ vars.VICTORIA_RECOVERY_SIGNING_KEY_ARN }}
          VICTORIA_RECOVERY_TASK_ROLE_ARN: ${{ vars.VICTORIA_RECOVERY_TASK_ROLE_ARN }}
          VICTORIA_RECOVERY_EXECUTION_ROLE_ARN: ${{ vars.VICTORIA_RECOVERY_EXECUTION_ROLE_ARN }}
          VICTORIA_RECOVERY_LOG_GROUP: /ecs/mscqr-production/victoria-recovery
        run: |
          set -euo pipefail
          value="$(node scripts/aws/register-victoria-recovery-task-definition.mjs)"
          arn="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.taskDefinitionArn)' "$value")"
          [[ "$arn" =~ ^arn:aws:ecs:eu-west-2:368992683803:task-definition/mscqr-production-victoria-recovery:[1-9][0-9]*$ ]]
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
      - name: Create source, approval, image, and task-bound authorization
        id: authorize
        env:
          SOURCE_SHA: ${{ github.sha }}
          VICTORIA_RECOVERY_IMAGE: ${{ steps.image.outputs.uri }}
          VICTORIA_RECOVERY_TASK_DEFINITION: ${{ steps.task.outputs.arn }}
          VICTORIA_RECOVERY_SIGNING_KEY_ARN: ${{ vars.VICTORIA_RECOVERY_SIGNING_KEY_ARN }}
          VICTORIA_RECOVERY_EVIDENCE_BUCKET: ${{ vars.VICTORIA_RECOVERY_EVIDENCE_BUCKET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          value="$(node scripts/aws/publish-victoria-recovery-authorization.mjs)"
          nonce="$(node -e 'const v=JSON.parse(process.argv[1]);process.stdout.write(v.nonce)' "$value")"
          [[ "$nonce" =~ ^[0-9a-f-]{36}$ ]]
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"
      - name: Invoke the fixed production broker
        id: execute
        env:
          SOURCE_SHA: ${{ github.sha }}
          BROKER_ARN: ${{ vars.VICTORIA_RECOVERY_BROKER_ARN }}
          EVIDENCE_BUCKET: ${{ vars.VICTORIA_RECOVERY_EVIDENCE_BUCKET }}
          NONCE: ${{ steps.authorize.outputs.nonce }}
        run: |
          set -euo pipefail
          [[ "$BROKER_ARN" =~ ^arn:aws:lambda:eu-west-2:368992683803:function:mscqr-production-victoria-recovery-broker:production$ ]]
          [[ "$NONCE" =~ ^[0-9a-f-]{36}$ ]]
          request="$RUNNER_TEMP/victoria-recovery-request.json"
          response="$RUNNER_TEMP/victoria-recovery-response.json"
          result="$RUNNER_TEMP/victoria-recovery-result.json"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          printf '{"operation":"VICTORIA_FAILED_ONBOARDING_RECOVERY_V1","sourceSha":"%s","nonce":"%s"}' "$SOURCE_SHA" "$NONCE" > "$request"
          aws lambda invoke --region eu-west-2 --function-name "$BROKER_ARN" --cli-binary-format raw-in-base64-out --payload "fileb://$request" "$response" > /dev/null
          task_arn="$(node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(v.FunctionError||v.operation!=="VICTORIA_FAILED_ONBOARDING_RECOVERY_V1")process.exit(1);process.stdout.write(v.taskArn)' "$response")"
          echo "task_arn=$task_arn" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 120); do
            if aws s3api get-object --region eu-west-2 --bucket "$EVIDENCE_BUCKET" --key "results/$NONCE.json" "$result" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          test -s "$result"
          node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(JSON.stringify({operation:v.operation,targetEmail:v.targetEmail,targetDatabase:v.targetDatabase,status:v.status,pruneComplete:v.pruneComplete,temporaryAuthorityCleanup:v.temporaryAuthorityCleanup,reason:v.reason}))' "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(v.operation!=="VICTORIA_FAILED_ONBOARDING_RECOVERY_V1"||v.targetEmail!=="victoria@mscqr.com"||v.targetDatabase!=="mscqr_production"||v.temporaryAuthorityCleanup!==true||v.pruneComplete!==true)process.exit(1)' "$result"
      - name: Revoke temporary database network authority
        id: cleanup
        if: always() && steps.authorize.outputs.nonce != ''
        env:
          SOURCE_SHA: ${{ github.sha }}
          BROKER_ARN: ${{ vars.VICTORIA_RECOVERY_BROKER_ARN }}
          NONCE: ${{ steps.authorize.outputs.nonce }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/victoria-recovery-cleanup-request.json"
          response="$RUNNER_TEMP/victoria-recovery-cleanup-response.json"
          printf '{"operation":"VICTORIA_FAILED_ONBOARDING_RECOVERY_V1","phase":"cleanup","sourceSha":"%s","nonce":"%s"}' "$SOURCE_SHA" "$NONCE" > "$request"
          aws lambda invoke --region eu-west-2 --function-name "$BROKER_ARN" --cli-binary-format raw-in-base64-out --payload "fileb://$request" "$response" > /dev/null
          node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(v.FunctionError||v.operation!=="VICTORIA_FAILED_ONBOARDING_RECOVERY_V1"||v.nonce!==process.env.NONCE||v.networkAuthorityRevoked!==true)process.exit(1)' "$response"
          echo "network_authority_revoked=true" >> "$GITHUB_OUTPUT"
      - name: Preserve operation result evidence
        if: always() && steps.authorize.outputs.nonce != ''
        uses: actions/upload-artifact@v7
        with:
          name: victoria-onboarding-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/victoria-recovery-result.json
          if-no-files-found: warn
          retention-days: 90
