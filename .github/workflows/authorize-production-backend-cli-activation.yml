name: Authorize production backend CLI activation
on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Protected main tooling SHA, required: true, type: string }
      candidate_source_sha: { description: Published backend source SHA, required: true, type: string }
      candidate_digest: { description: Immutable backend image digest, required: true, type: string }
      predecessor_task_definition_arn: { description: Current backend task definition ARN, required: true, type: string }
      requirements_sha256: { description: Current-source database requirements hash, required: true, type: string }
      publication_reference: { description: Authenticated four-image publication reference JSON, required: true, type: string }
      image_authorization_reference: { description: Signed image authorization reference JSON, required: true, type: string }
      requirements_reference: { description: Current-source database requirements reference JSON, required: true, type: string }
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked evidence dependencies
        run: npm ci
      - name: Authenticate protected source and actual reviewer
        id: approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          test -z "$(git status --porcelain --untracked-files=no)"
          install -d -m 700 "$RUNNER_TEMP/backend-cli-authorization"
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$RUNNER_TEMP/backend-cli-authorization/approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-actor "$GITHUB_ACTOR" --require-actual-approval
          echo "sha256=$(sha256sum "$RUNNER_TEMP/backend-cli-authorization/approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Publish approval package only
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          PREDECESSOR_TASK_DEFINITION_ARN: ${{ inputs.predecessor_task_definition_arn }}
          REQUIREMENTS_SHA256: ${{ inputs.requirements_sha256 }}
          PUBLICATION_REFERENCE: ${{ inputs.publication_reference }}
          IMAGE_AUTHORIZATION_REFERENCE: ${{ inputs.image_authorization_reference }}
          REQUIREMENTS_REFERENCE: ${{ inputs.requirements_reference }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          node scripts/aws/production-backend-cli-authorization.mjs \
            --source-sha "$SOURCE_SHA" --candidate-source-sha "$CANDIDATE_SOURCE_SHA" \
            --candidate-digest "$CANDIDATE_DIGEST" --predecessor-task-definition-arn "$PREDECESSOR_TASK_DEFINITION_ARN" \
            --requirements-sha256 "$REQUIREMENTS_SHA256" --publication-reference "$PUBLICATION_REFERENCE" \
            --image-authorization-reference "$IMAGE_AUTHORIZATION_REFERENCE" --requirements-reference "$REQUIREMENTS_REFERENCE" \
            --approval "$RUNNER_TEMP/backend-cli-authorization/approval.json" --approval-sha256 "${{ steps.approval.outputs.sha256 }}" \
            --output "$RUNNER_TEMP/backend-cli-authorization/authorization.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-backend-cli-activation-authorization
          path: ${{ runner.temp }}/backend-cli-authorization/authorization.json
          if-no-files-found: error
          retention-days: 1
