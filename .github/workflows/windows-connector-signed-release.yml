name: Windows Connector Signed Release

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "Build a candidate, or certify and stage the pinned signed candidate for fresh installation."
        type: choice
        required: true
        default: build_verify_only
        options:
          - build_verify_only
          - publish
          - certify_fresh_install
          - diagnose_fresh_install
          - publish_fresh_install
      connector_release_version:
        description: "Optional connector version. Defaults to backend/src/local-print-agent/version.ts and must match that source buildVersion."
        required: false
        type: string
      maintenance_api_origin:
        description: "Approved HTTPS backend origin embedded in the signed maintenance client (no path)."
        required: true
        type: string
      web_app_base_url:
        description: "Public MSCQR web app URL embedded into the connector installer."
        required: true
        default: "https://mscqr.com"
        type: string
      signed_candidate_run_id:
        description: "Successful signed-candidate run on this exact protected-main commit (certification modes only)."
        required: false
        type: string
      signed_installer_sha256:
        description: "SHA-256 of that run's signed Windows installer (certification modes only)."
        required: false
        type: string
  push:
    tags:
      - "connector-v*"
      - "windows-connector-v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: windows-connector-signed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_ARTIFACT_SIGNING_ENDPOINT: https://weu.codesigning.azure.net/
  AZURE_ARTIFACT_SIGNING_ACCOUNT: mscqrsigning
  AZURE_ARTIFACT_SIGNING_PROFILE: mscqr-certification

jobs:
  build-sign-windows:
    name: Build and sign Windows connector
    if: github.event_name != 'workflow_dispatch' || inputs.execution_mode == 'build_verify_only' || inputs.execution_mode == 'publish'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: windows-2022
    # Configure this GitHub Environment with required reviewers before production use.
    # The job will pause here before Azure OIDC login and signing can access the certificate profile.
    environment: production-signing
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Remove only after the maintenance fence, transactional installer and
      # signed-artifact Windows certification have been reviewed and passed.
      - name: Block release while upgrade safety is incomplete
        if: github.event_name != 'workflow_dispatch' || inputs.execution_mode != 'build_verify_only'
        shell: pwsh
        run: |
          throw "Windows connector release is blocked: upgrade safety and embedded-signature certification are incomplete."

      - name: Validate Azure signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $missing = @()
          foreach ($name in @("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID")) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              continue
            }
            $missing += $name
          }

          if ($missing.Count -gt 0) {
            throw "Missing required GitHub signing secret(s): $($missing -join ', '). Add them under repository or production-signing environment secrets."
          }

          Write-Host "Azure signing configuration is present. Secret values were not printed."

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Resolve connector release settings
        id: release_settings
        shell: pwsh
        env:
          INPUT_CONNECTOR_RELEASE_VERSION: ${{ inputs.connector_release_version }}
          INPUT_WEB_APP_BASE_URL: ${{ inputs.web_app_base_url }}
          VAR_WEB_APP_BASE_URL: ${{ vars.WEB_APP_BASE_URL }}
          INPUT_MAINTENANCE_API_ORIGIN: ${{ inputs.maintenance_api_origin }}
        run: |
          $version = "$env:INPUT_CONNECTOR_RELEASE_VERSION".Trim()
          $versionSourcePath = Join-Path $env:GITHUB_WORKSPACE "backend\src\local-print-agent\version.ts"
          $versionSource = Get-Content -Path $versionSourcePath -Raw
          if ($versionSource -notmatch 'LOCAL_PRINT_AGENT_SOURCE_VERSION\s*=\s*"([^"]+)"') {
            throw "Could not read LOCAL_PRINT_AGENT_SOURCE_VERSION from $versionSourcePath"
          }
          $sourceVersion = $Matches[1]
          if (-not $version) {
            $version = $sourceVersion
          }
          if ($version -ne $sourceVersion) {
            throw "Refusing to build connector version $version because source buildVersion is $sourceVersion. Update backend/src/local-print-agent/version.ts or use the matching version."
          }

          $webAppBaseUrl = "$env:INPUT_WEB_APP_BASE_URL".Trim()
          if (-not $webAppBaseUrl) {
            $webAppBaseUrl = "$env:VAR_WEB_APP_BASE_URL".Trim()
          }
          if (-not $webAppBaseUrl) {
            throw "WEB_APP_BASE_URL is required. Provide workflow input web_app_base_url or repository variable WEB_APP_BASE_URL."
          }

          $stageDir = "$env:GITHUB_WORKSPACE\backend\.connector-build\windows-installer\staging"
          $installerProject = "$env:GITHUB_WORKSPACE\backend\.connector-build\windows-installer\MSCQR-Connector-$version.iss"
          $releaseOutputDir = "$env:GITHUB_WORKSPACE\backend\local-print-agent\releases\$version\windows"

          # Adjust these paths if the Windows packaging script starts writing artifacts somewhere else.
          "CONNECTOR_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_APP_BASE_URL=$webAppBaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $maintenanceOrigin = [Uri]$env:INPUT_MAINTENANCE_API_ORIGIN
          if ($maintenanceOrigin.Scheme -ne 'https' -or $maintenanceOrigin.UserInfo -or $maintenanceOrigin.Query -or $maintenanceOrigin.Fragment -or $maintenanceOrigin.AbsolutePath -ne '/') {
            throw 'Approved HTTPS maintenance origin is required, without a path.'
          }
          if ($env:INPUT_MAINTENANCE_API_ORIGIN -cnotin @($maintenanceOrigin.GetLeftPart([UriPartial]::Authority), ($maintenanceOrigin.GetLeftPart([UriPartial]::Authority)+'/'))) {
            throw 'Maintenance origin must be canonical; normalized paths or host substitutions are forbidden.'
          }
          "MSCQR_MAINTENANCE_API_ORIGIN=$($maintenanceOrigin.GetLeftPart([UriPartial]::Authority))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_INSTALLER_STAGE_DIR=$stageDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_INSTALLER_PROJECT=$installerProject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_RELEASE_OUTPUT_DIR=$releaseOutputDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "connector_release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_connector_version=$sourceVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "web_app_base_url=$webAppBaseUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "windows_installer_stage_dir=$stageDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "windows_installer_project=$installerProject" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "windows_release_output_dir=$releaseOutputDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare unsigned Windows installer scaffold
        shell: pwsh
        env:
          CONNECTOR_RELEASE_VERSION: ${{ steps.release_settings.outputs.connector_release_version }}
          WEB_APP_BASE_URL: ${{ steps.release_settings.outputs.web_app_base_url }}
          INNO_SETUP_COMPILER_PATH: C:\__compile_after_payload_signing__\ISCC.exe
          WINDOWS_CONNECTOR_PKG_TARGET: node24-win-x64
          MSCQR_APPROVED_MAINTENANCE_API_ORIGIN: ${{ vars.MSCQR_APPROVED_MAINTENANCE_API_ORIGIN }}
        run: npm --prefix backend run connector:windows:prepare-signed-candidate

      - name: Verify staged Windows connector runtime
        shell: pwsh
        run: |
          $requiredFiles = @(
            "Install Connector.cmd",
            "Uninstall Connector.cmd",
            "README.txt",
            "install-startup-task.ps1",
            "uninstall-startup-task.ps1",
            "connector-upgrade-state.ps1",
            "connector-upgrade-transaction.ps1",
            "connector-upgrade-backup.ps1",
            "connector-upgrade-staging.ps1",
            "installer-build.json",
            "bin\mscqr-local-print-agent.exe"
          )
          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $env:WINDOWS_INSTALLER_STAGE_DIR $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Windows connector staging is missing required file: $relativePath"
            }
          }

          $runtime = Join-Path $env:WINDOWS_INSTALLER_STAGE_DIR "bin\mscqr-local-print-agent.exe"
          $runtimeBytes = (Get-Item $runtime).Length
          if ($runtimeBytes -lt 1000000) {
            throw "Windows connector staged runtime is too small: $runtimeBytes bytes"
          }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign staged Windows payload files
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_PROFILE }}
          # This is where build-windows-installer.mjs stages files before Inno Setup packages them.
          # If the app's output directory changes, adjust WINDOWS_INSTALLER_STAGE_DIR above.
          files-folder: ${{ steps.release_settings.outputs.windows_installer_stage_dir }}
          files-folder-filter: exe,dll,msi,sys,ps1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed staged executables
        shell: pwsh
        env:
          WINDOWS_CONNECTOR_PUBLISHER_NAME: ${{ vars.WINDOWS_CONNECTOR_PUBLISHER_NAME }}
        run: |
          $publisher = $env:WINDOWS_CONNECTOR_PUBLISHER_NAME
          if (-not $publisher) { $publisher = 'L&D Health Ltd' }
          $entries = @(Get-ChildItem -LiteralPath $env:WINDOWS_INSTALLER_STAGE_DIR -Force -Recurse)
          if (@($entries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) { throw 'Staged payload contains a reparse point.' }
          $files = @(foreach ($entry in $entries | Where-Object { -not $_.PSIsContainer }) {
            $stream = [IO.File]::Open($entry.FullName, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
            try { $first = $stream.ReadByte(); $second = $stream.ReadByte() } finally { $stream.Dispose() }
            if (($first -eq 0x4d -and $second -eq 0x5a) -or $entry.Extension -in '.exe', '.dll', '.sys', '.msi', '.ps1') { $entry }
          })
          if ($files.Count -eq 0) { throw 'No staged executable payloads found.' }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate -or
                $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne $publisher) {
              throw "Invalid or untimestamped staged payload: $($file.FullName)"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        env:
          WINDOWS_CONNECTOR_PUBLISHER_NAME: ${{ vars.WINDOWS_CONNECTOR_PUBLISHER_NAME }}
        run: |
          if (-not (Test-Path $env:WINDOWS_INSTALLER_PROJECT)) {
            throw "Inno Setup project was not generated: $env:WINDOWS_INSTALLER_PROJECT"
          }

          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          $signScript = Join-Path $env:GITHUB_WORKSPACE 'backend\local-print-agent\packaging\sign-inno-file.ps1'
          if (-not (Test-Path -LiteralPath $signScript -PathType Leaf)) {
            throw "Inno signing hook not found: $signScript"
          }
          $signTool = 'mscqr=pwsh.exe -NoProfile -NonInteractive -File $q' + $signScript + '$q $f'
          & $iscc '/DMSCQR_SIGNED_RELEASE' "/S$signTool" $env:WINDOWS_INSTALLER_PROJECT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path $env:WINDOWS_RELEASE_OUTPUT_DIR)) {
            throw "Windows release output folder was not created: $env:WINDOWS_RELEASE_OUTPUT_DIR"
          }

          $artifacts = Get-ChildItem -Path $env:WINDOWS_RELEASE_OUTPUT_DIR -File -Recurse -Include *.exe,*.dll,*.msi
          if (-not $artifacts) {
            throw "No Windows .exe, .dll, or .msi artifacts were created in $env:WINDOWS_RELEASE_OUTPUT_DIR"
          }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -lt 1000000) {
              throw "Windows release artifact is too small: $($artifact.FullName) $($artifact.Length) bytes"
            }
          }

      - name: Normalize signed installer name and verify signatures
        shell: pwsh
        env:
          WINDOWS_CONNECTOR_PUBLISHER_NAME: ${{ vars.WINDOWS_CONNECTOR_PUBLISHER_NAME }}
        run: |
          if (-not "$env:WINDOWS_CONNECTOR_PUBLISHER_NAME".Trim()) {
            $env:WINDOWS_CONNECTOR_PUBLISHER_NAME = "L&D Health Ltd"
          }
          $unsignedInstaller = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "MSCQR-Connector-Windows-${env:CONNECTOR_RELEASE_VERSION}-unsigned.exe"
          $signedInstaller = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "MSCQR-Connector-Windows-${env:CONNECTOR_RELEASE_VERSION}.exe"
          if (Test-Path $unsignedInstaller) {
            Move-Item -Path $unsignedInstaller -Destination $signedInstaller -Force
          }

          $signedArtifacts = Get-ChildItem -Path $env:WINDOWS_RELEASE_OUTPUT_DIR -File -Recurse -Include *.exe,*.dll,*.msi
          if (-not $signedArtifacts) {
            throw "No signed Windows artifacts found in $env:WINDOWS_RELEASE_OUTPUT_DIR"
          }

          foreach ($artifact in $signedArtifacts) {
            if ($artifact.Length -lt 1000000) {
              throw "Signed Windows artifact is too small: $($artifact.FullName) $($artifact.Length) bytes"
            }
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature for $($artifact.FullName): $($signature.Status) $($signature.StatusMessage)"
            }
          }

          $mainInstaller = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "MSCQR-Connector-Windows-${env:CONNECTOR_RELEASE_VERSION}.exe"
          if (-not (Test-Path $mainInstaller)) {
            throw "Normalized signed Windows installer was not found: $mainInstaller"
          }
          $mainSignature = Get-AuthenticodeSignature -FilePath $mainInstaller
          if ($mainSignature.Status -ne "Valid" -or -not $mainSignature.SignerCertificate -or -not $mainSignature.TimeStamperCertificate) {
            throw "Signed Windows installer does not have a valid signer and timestamp certificate."
          }
          $reportPath = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "signature-report.json"
          [ordered]@{
            artifactFilename = Split-Path -Leaf $mainInstaller
            status = [string]$mainSignature.Status
            statusMessage = [string]$mainSignature.StatusMessage
            signerSubject = [string]$mainSignature.SignerCertificate.Subject
            issuer = [string]$mainSignature.SignerCertificate.Issuer
            thumbprint = [string]$mainSignature.SignerCertificate.Thumbprint
            notBefore = $mainSignature.SignerCertificate.NotBefore.ToUniversalTime().ToString("o")
            notAfter = $mainSignature.SignerCertificate.NotAfter.ToUniversalTime().ToString("o")
            timestamped = $true
            timestampAuthority = "http://timestamp.acs.microsoft.com"
            signedAt = (Get-Date).ToUniversalTime().ToString("o")
            publisherName = "$env:WINDOWS_CONNECTOR_PUBLISHER_NAME"
            azureSigningEndpoint = "$env:AZURE_ARTIFACT_SIGNING_ENDPOINT"
            azureSigningAccount = "$env:AZURE_ARTIFACT_SIGNING_ACCOUNT"
            azureSigningProfile = "$env:AZURE_ARTIFACT_SIGNING_PROFILE"
            verificationSummary = "Get-AuthenticodeSignature returned Valid for the normalized Windows connector installer."
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $reportPath -Encoding utf8
          "WINDOWS_CONNECTOR_SIGNATURE_REPORT_PATH=$reportPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish signed Windows connector manifest
        if: inputs.execution_mode == 'publish'
        shell: pwsh
        env:
          WINDOWS_CONNECTOR_PUBLISHER_NAME: ${{ vars.WINDOWS_CONNECTOR_PUBLISHER_NAME }}
        run: |
          $signedInstaller = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "MSCQR-Connector-Windows-${env:CONNECTOR_RELEASE_VERSION}.exe"
          if (-not (Test-Path $signedInstaller)) {
            throw "Signed Windows installer was not found: $signedInstaller"
          }

          $publisherName = "$env:WINDOWS_CONNECTOR_PUBLISHER_NAME".Trim()
          if (-not $publisherName) {
            $publisherName = "L&D Health Ltd"
          }

          $env:WINDOWS_CONNECTOR_SIGNED_INSTALLER_PATH = $signedInstaller
          $env:WINDOWS_CONNECTOR_PUBLISHER_NAME = $publisherName
          $env:WINDOWS_CONNECTOR_SIGNED_AT = (Get-Date).ToUniversalTime().ToString("o")
          $env:WINDOWS_CONNECTOR_SIGNATURE_REPORT_PATH = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "signature-report.json"
          npm --prefix backend run connector:windows:publish-signed

      - name: Smoke-check published connector metadata
        if: inputs.execution_mode == 'publish'
        shell: pwsh
        run: npm --prefix backend run connector:smoke

      - name: Commit signed connector release files
        if: inputs.execution_mode == 'publish' && github.ref_type == 'branch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "backend/local-print-agent/releases/manifest.json" "backend/local-print-agent/releases/${env:CONNECTOR_RELEASE_VERSION}/windows"
          $changes = git diff --cached --name-only
          if (-not $changes) {
            Write-Host "No signed connector release file changes to commit."
            exit 0
          }

          git commit -m "Publish Windows connector ${env:CONNECTOR_RELEASE_VERSION}"
          git push origin "HEAD:${env:GITHUB_REF_NAME}"

      - name: Generate backend dependency SBOM
        id: sbom
        shell: pwsh
        run: |
          $sbomPath = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "MSCQR-Connector-Windows-${env:CONNECTOR_RELEASE_VERSION}.spdx.json"
          npm --prefix backend sbom --sbom-format spdx --sbom-type application | Set-Content -Path $sbomPath -Encoding utf8

          $sbom = Get-Content -Path $sbomPath -Raw | ConvertFrom-Json
          if ($sbom.spdxVersion -ne "SPDX-2.3") {
            throw "Expected SPDX-2.3 SBOM, got $($sbom.spdxVersion)"
          }

          "WINDOWS_SBOM_PATH=$sbomPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "windows_sbom_path=$sbomPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release checksums
        id: checksums
        shell: pwsh
        run: |
          $signedArtifacts = Get-ChildItem -Path $env:WINDOWS_RELEASE_OUTPUT_DIR -File -Recurse -Include *.exe,*.dll,*.msi
          if (-not $signedArtifacts) {
            throw "No signed Windows artifacts found in $env:WINDOWS_RELEASE_OUTPUT_DIR"
          }

          $signedChecksumsPath = Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "SIGNED_ARTIFACTS_SHA256SUMS.txt"
          Get-FileHash -Algorithm SHA256 -Path $signedArtifacts.FullName |
            Sort-Object Path |
            ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($env:WINDOWS_RELEASE_OUTPUT_DIR, $_.Path).Replace("\", "/")
              "$($_.Hash.ToLowerInvariant())  $relativePath"
            } |
            Set-Content -Path $signedChecksumsPath -Encoding ascii

          $releaseFiles = Get-ChildItem -Path $env:WINDOWS_RELEASE_OUTPUT_DIR -File -Recurse
          Get-FileHash -Algorithm SHA256 -Path $releaseFiles.FullName |
            Sort-Object Path |
            ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($env:WINDOWS_RELEASE_OUTPUT_DIR, $_.Path).Replace("\", "/")
              "$($_.Hash.ToLowerInvariant())  $relativePath"
            } |
            Set-Content -Path (Join-Path $env:WINDOWS_RELEASE_OUTPUT_DIR "SHA256SUMS.txt") -Encoding ascii

          "SIGNED_ARTIFACT_CHECKSUMS_PATH=$signedChecksumsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "signed_artifact_checksums_path=$signedChecksumsPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest signed Windows artifact provenance
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.checksums.outputs.signed_artifact_checksums_path }}

      - name: Attest signed Windows artifact SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.checksums.outputs.signed_artifact_checksums_path }}
          sbom-path: ${{ steps.sbom.outputs.windows_sbom_path }}

      - name: Upload signed Windows connector artifact
        uses: actions/upload-artifact@v7
        with:
          name: mscqr-windows-candidate-${{ steps.release_settings.outputs.connector_release_version }}-${{ github.sha }}
          path: |
            ${{ steps.release_settings.outputs.windows_release_output_dir }}
          if-no-files-found: error

  fresh-install:
    name: Certify pinned signed installer for fresh installation
    if: github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'certify_fresh_install' || inputs.execution_mode == 'diagnose_fresh_install' || inputs.execution_mode == 'publish_fresh_install')
    runs-on: windows-2022
    environment: production-signing
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Authenticate and download the existing signed candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SIGNED_CANDIDATE_RUN_ID: ${{ inputs.signed_candidate_run_id }}
          INPUT_SIGNED_INSTALLER_SHA256: ${{ inputs.signed_installer_sha256 }}
          INPUT_EXECUTION_MODE: ${{ inputs.execution_mode }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main' -and
              ($env:INPUT_EXECUTION_MODE -cne 'diagnose_fresh_install' -or
               $env:GITHUB_REF -cne 'refs/heads/fix/windows-fresh-install-receipt')) {
            throw 'Fresh-install certification requires protected main.'
          }
          $source = 'e3b2686cab560a613aedae7e99422e22a27cb646'
          $expected = "$env:INPUT_SIGNED_INSTALLER_SHA256".Trim().ToLowerInvariant()
          if ($env:INPUT_SIGNED_CANDIDATE_RUN_ID -cnotmatch '^[1-9][0-9]{0,17}$' -or
              $expected -cnotmatch '^[0-9a-f]{64}$') { throw 'Exact signed run ID and installer SHA-256 are required.' }
          $runId = [long]$env:INPUT_SIGNED_CANDIDATE_RUN_ID
          if ($runId -ne 42199211978 -or $expected -cne '91b3f52eafd625243880f160fc639916f8de9df17261bcdcccb69018ea71faa9') {
            throw 'This certification is bound to the verified signed candidate.'
          }
          $name = "mscqr-windows-candidate-2026.11.6.2-$source"
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Signed candidate run lookup failed.' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Signed candidate artifact lookup failed.' }
          $matching = @($artifacts.artifacts | Where-Object {
            $_.name -ceq $name -and $_.workflow_run.id -eq $runId -and -not $_.expired
          })
          if ($run.repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.workflow_id -ne 273963817 -or
              $run.path -cne '.github/workflows/windows-connector-signed-release.yml' -or
              $run.event -cne 'workflow_dispatch' -or $run.conclusion -cne 'success' -or
              $run.head_branch -cne 'main' -or $run.head_sha -cne $source -or
              $matching.Count -ne 1) { throw 'Signed candidate provenance mismatch.' }
          git merge-base --is-ancestor $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Signed source is not an ancestor of certification tooling.' }
          git diff --exit-code $source HEAD -- backend/src/local-print-agent backend/local-print-agent/install/windows backend/local-print-agent/packaging/build-windows-installer.mjs backend/local-print-agent/packaging/sign-inno-file.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer source changed after attestation.' }
          $version = Get-Content backend/src/local-print-agent/version.ts -Raw
          if ($version -notmatch 'LOCAL_PRINT_AGENT_SOURCE_VERSION\s*=\s*"2026[.]11[.]6[.]2"') { throw 'Release source version mismatch.' }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\candidate" | Out-Null
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir "$env:RUNNER_TEMP\candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Signed candidate download failed.' }
          $installer = "$env:RUNNER_TEMP\candidate\MSCQR-Connector-Windows-2026.11.6.2.exe"
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Signed installer digest mismatch.' }
          $attestations = @(gh attestation verify $installer --repo $env:GITHUB_REPOSITORY --format json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or -not @($attestations | Where-Object {
            $_.verificationResult.statement.predicateType -ceq 'https://slsa.dev/provenance/v1' -and
            $_.verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.repository -ceq "https://github.com/$env:GITHUB_REPOSITORY" -and
            $_.verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.path -ceq '.github/workflows/windows-connector-signed-release.yml' -and
            $_.verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit -ceq $source -and
            @($_.verificationResult.statement.subject | Where-Object { $_.name -ceq (Split-Path -Leaf $installer) -and $_.digest.sha256 -ceq $expected }).Count -eq 1
          }).Count) { throw 'Authenticated installer attestation mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $report = Get-Content "$env:RUNNER_TEMP\candidate\signature-report.json" -Raw | ConvertFrom-Json
          if ($signature.Status -cne 'Valid' -or -not $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Thumbprint -cne $report.thumbprint -or
              $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName,$false) -cne 'L&D Health Ltd') {
            throw 'Signed installer Authenticode identity mismatch.'
          }
          "MSCQR_SIGNED_INSTALLER=$installer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Certify first installation without maintenance authorization
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:LOCALAPPDATA 'MSCQR\local-print-agent'
          if ((Test-Path $installRoot) -or (Test-Path (Join-Path $env:USERPROFILE '.mscqr\local-print-agent-state.json')) -or
              (Test-Path (Join-Path $env:USERPROFILE '.authenticqr\local-print-agent-state.json'))) {
            throw 'Runner is not a clean first-install host.'
          }
          $setupLog = Join-Path $env:RUNNER_TEMP 'mscqr-fresh-install.log'
          $setup = Start-Process -FilePath $env:MSCQR_SIGNED_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$setupLog") -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            $resultPath = Join-Path $installRoot 'install-result.json'
            if (Test-Path $resultPath) {
              $failed = Get-Content $resultPath -Raw | ConvertFrom-Json
              Write-Host "Installer state: $($failed.state)"
              Write-Host "Installer message: $($failed.message)"
            }
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 20 | Write-Host }
            throw "Fresh installer failed with exit $($setup.ExitCode)."
          }
          $resultPath = Join-Path $installRoot 'install-result.json'
          for ($attempt = 0; $attempt -lt 30 -and -not (Test-Path -LiteralPath $resultPath); $attempt++) {
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path -LiteralPath $resultPath)) { throw 'Installer exited zero but the installation receipt is absent.' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          $status = Invoke-RestMethod 'http://127.0.0.1:17866/status' -TimeoutSec 10
          if ($result.outcome -notin @('success','partial') -or -not $result.localhostStatusOk -or
              $result.installedVersion -cne '2026.11.6.2' -or $status.buildVersion -cne '2026.11.6.2' -or
              $status.protocolVersion -cne 'local-agent-direct-v2' -or -not $status.agentId -or -not $status.deviceFingerprint) {
            throw 'Fresh installer did not establish a verified 2026.11.6.2 runtime.'
          }
          Write-Host 'PASS: signed fresh installation without MSCQRAUTH; printer readiness remains a separate check.'

      - name: Retain sanitized failed-install diagnostics
        if: failure()
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:LOCALAPPDATA 'MSCQR\local-print-agent'
          $setupLog = Join-Path $env:RUNNER_TEMP 'mscqr-fresh-install.log'
          $receipt = Join-Path $installRoot 'install-result.json'
          $otherReceipts = @(Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'MSCQR'), (Join-Path $env:APPDATA 'MSCQR') -Filter install-result.json -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          [ordered]@{
            installRootExists = Test-Path -LiteralPath $installRoot
            receiptExists = Test-Path -LiteralPath $receipt
            receiptLocations = $otherReceipts
            runtimeExists = Test-Path -LiteralPath (Join-Path $installRoot 'bin\mscqr-local-print-agent.exe')
            setupLogExists = Test-Path -LiteralPath $setupLog
            profileMatchesLocalAppData = -not [string]::IsNullOrWhiteSpace($env:USERPROFILE) -and
              ([string]$env:LOCALAPPDATA).StartsWith($env:USERPROFILE, [StringComparison]::OrdinalIgnoreCase)
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mscqr-install-diagnostics.json')
          if (Test-Path -LiteralPath $setupLog) {
            Get-Content -LiteralPath $setupLog |
              Where-Object { $_ -notmatch '(?i)MSCQRAUTH|password|token|secret|private.?key|agent.?id|device.?fingerprint' } |
              Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'mscqr-sanitized-setup.log')
          }
      - name: Upload failed-install diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mscqr-fresh-install-diagnostics
          path: |
            ${{ runner.temp }}/mscqr-install-diagnostics.json
            ${{ runner.temp }}/mscqr-sanitized-setup.log
          retention-days: 3
          if-no-files-found: error

      - uses: actions/setup-node@v6
        if: inputs.execution_mode == 'publish_fresh_install'
        with:
          node-version: 24
      - name: Stage fresh-install-only release files for review
        if: inputs.execution_mode == 'publish_fresh_install'
        shell: pwsh
        env:
          CONNECTOR_RELEASE_VERSION: 2026.11.6.2
          WINDOWS_CONNECTOR_FRESH_INSTALL_ONLY: 'true'
          WINDOWS_CONNECTOR_PUBLISHER_NAME: L&D Health Ltd
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Publication staging requires protected main.' }
          $env:WINDOWS_CONNECTOR_SIGNED_INSTALLER_PATH = $env:MSCQR_SIGNED_INSTALLER
          $env:WINDOWS_CONNECTOR_SIGNATURE_REPORT_PATH = "$env:RUNNER_TEMP\candidate\signature-report.json"
          node backend/local-print-agent/packaging/publish-windows-connector-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata generation failed.' }
      - name: Upload reviewed fresh-install distribution package
        if: inputs.execution_mode == 'publish_fresh_install'
        uses: actions/upload-artifact@v7
        with:
          name: mscqr-fresh-install-distribution-2026.11.6.2
          path: |
            backend/local-print-agent/releases/manifest.json
            backend/local-print-agent/releases/2026.11.6.2/windows
          if-no-files-found: error
