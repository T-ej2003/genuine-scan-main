name: Release Candidate Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/merge-main-ours-test2
      - release-candidate/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc-trust-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      # TODO(ci-lint): make changed-file lint hard-blocking here once ENFORCE_LINT_CHANGED=true
      # and the existing repository lint debt no longer requires report-only mode.
      - name: Lint changed files report
        env:
          ENFORCE_LINT_CHANGED: ${{ vars.ENFORCE_LINT_CHANGED }}
        run: npm run report:lint:changed

      - name: Release-candidate validation contract
        run: |
          # Pull requests validate merge safety. Pushes, tags, and manual runs
          # retain the production-release freshness gate.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npm run verify:ci:release-candidate:source
          else
            npm run verify:ci:release-candidate
          fi

  rc-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - rc-trust-critical
    environment: staging
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    env:
      STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED }}
      STAGING_SMOKE_BASE_URL: ${{ vars.STAGING_SMOKE_BASE_URL }}
      STAGING_SMOKE_API_BASE_URL: ${{ vars.STAGING_SMOKE_API_BASE_URL }}
      STAGING_SMOKE_VERIFY_CODE: ${{ vars.STAGING_SMOKE_VERIFY_CODE }}
      SMOKE_BASE_URL: ${{ vars.STAGING_SMOKE_BASE_URL }}
      SMOKE_API_BASE_URL: ${{ vars.STAGING_SMOKE_API_BASE_URL }}
      SMOKE_VERIFY_CODE: ${{ vars.STAGING_SMOKE_VERIFY_CODE }}
      SMOKE_BATCH_PRINT_ENDPOINT: ${{ vars.STAGING_SMOKE_BATCH_PRINT_ENDPOINT }}
      SMOKE_BATCH_PRINT_PAYLOAD_JSON: ${{ vars.STAGING_SMOKE_BATCH_PRINT_PAYLOAD_JSON }}
      SMOKE_INCIDENT_ENDPOINT: ${{ vars.STAGING_SMOKE_INCIDENT_ENDPOINT }}
      SMOKE_INCIDENT_PAYLOAD_JSON: ${{ vars.STAGING_SMOKE_INCIDENT_PAYLOAD_JSON }}
      SMOKE_EVIDENCE_URL: ${{ vars.STAGING_SMOKE_EVIDENCE_URL }}
      SMOKE_EVIDENCE_PATH: ${{ vars.STAGING_SMOKE_EVIDENCE_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve pull request changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          {
            echo "STAGING_SMOKE_CHANGED_FILES<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Staging smoke changed files:"
          if [ -n "$changed_files" ]; then
            echo "$changed_files"
          else
            echo "(none detected)"
          fi

      - name: Decide Dependabot staging smoke handling
        id: smoke_skip
        env:
          ALLOW_DEPENDABOT_DEPENDENCY_SMOKE_SKIP: "true"
          STAGING_SMOKE_LOGIN_EMAIL: ${{ secrets.STAGING_SMOKE_LOGIN_EMAIL }}
          STAGING_SMOKE_LOGIN_PASSWORD: ${{ secrets.STAGING_SMOKE_LOGIN_PASSWORD }}
          SMOKE_LOGIN_EMAIL: ${{ secrets.STAGING_SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.STAGING_SMOKE_LOGIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            collectStagingSmokeConfig,
            evaluateDependabotSmokeSkip,
          } from "./scripts/lib/staging-smoke-config-core.mjs";

          const { missing } = collectStagingSmokeConfig(process.env);
          const skip = evaluateDependabotSmokeSkip({ env: process.env, missing });
          const shouldSkip = skip.shouldSkip ? "true" : "false";

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip_staging_smoke=${shouldSkip}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `SKIP_STAGING_SMOKE=${shouldSkip}\n`);

          if (skip.shouldSkip) {
            console.log("Staging smoke will be skipped after configuration validation.");
            console.log("Reason: Dependabot dependency-only PR and staging smoke login credentials are unavailable.");
            console.log(`Changed files: ${skip.changedFiles.join(", ")}`);
          } else {
            console.log("Staging smoke is required for this run.");
          }
          NODE

      - name: Validate staging smoke configuration
        env:
          ALLOW_DEPENDABOT_DEPENDENCY_SMOKE_SKIP: "true"
          STAGING_SMOKE_LOGIN_EMAIL: ${{ secrets.STAGING_SMOKE_LOGIN_EMAIL }}
          STAGING_SMOKE_LOGIN_PASSWORD: ${{ secrets.STAGING_SMOKE_LOGIN_PASSWORD }}
          SMOKE_LOGIN_EMAIL: ${{ secrets.STAGING_SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.STAGING_SMOKE_LOGIN_PASSWORD }}
          SMOKE_ADMIN_MFA_CODE: ${{ secrets.STAGING_SMOKE_ADMIN_MFA_CODE }}
          SMOKE_ADMIN_MFA_SECRET: ${{ secrets.STAGING_SMOKE_ADMIN_MFA_SECRET }}
          SMOKE_ADMIN_STEP_UP_CODE: ${{ secrets.STAGING_SMOKE_ADMIN_STEP_UP_CODE }}
          SMOKE_STEP_UP_PASSWORD: ${{ secrets.STAGING_SMOKE_STEP_UP_PASSWORD }}
        run: node scripts/check-staging-smoke-config.mjs

      - name: Run staging smoke gate
        if: ${{ steps.smoke_skip.outputs.skip_staging_smoke != 'true' }}
        env:
          SMOKE_REQUIRED: "true"
          ALLOW_STAGING_SMOKE_DEGRADED_ON_PR: "false"
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          STAGING_SMOKE_RESULT_PATH: staging-smoke-result.json
          STAGING_SMOKE_LOGIN_EMAIL: ${{ secrets.STAGING_SMOKE_LOGIN_EMAIL }}
          STAGING_SMOKE_LOGIN_PASSWORD: ${{ secrets.STAGING_SMOKE_LOGIN_PASSWORD }}
          SMOKE_ADMIN_MFA_CODE: ${{ secrets.STAGING_SMOKE_ADMIN_MFA_CODE }}
          SMOKE_ADMIN_MFA_SECRET: ${{ secrets.STAGING_SMOKE_ADMIN_MFA_SECRET }}
          SMOKE_ADMIN_STEP_UP_CODE: ${{ secrets.STAGING_SMOKE_ADMIN_STEP_UP_CODE }}
          SMOKE_STEP_UP_PASSWORD: ${{ secrets.STAGING_SMOKE_STEP_UP_PASSWORD }}
        run: |
          npm run verify:staging-smoke 2>&1 | tee smoke-release.log

      - name: Record skipped staging smoke reason
        if: ${{ steps.smoke_skip.outputs.skip_staging_smoke == 'true' }}
        run: |
          {
            echo "Staging smoke skipped."
            echo "Reason: Dependabot dependency-only pull request does not have staging smoke login credentials available."
            echo "Configure Dependabot secrets SMOKE_LOGIN_EMAIL and SMOKE_LOGIN_PASSWORD to run this smoke job for Dependabot PRs."
          } | tee smoke-release.log

      - name: Upload staging smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-smoke-log
          path: |
            smoke-release.log
            staging-smoke-result.json
          if-no-files-found: ignore

  rc-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate protected branch required checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROTECTED_BRANCH: main
          REQUIRED_RELEASE_CHECKS: rc-trust-critical,rc-staging-smoke
        run: node scripts/check-release-governance.mjs

  rc-release-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - rc-trust-critical
      - rc-staging-smoke
      - rc-governance
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release checklist artifact
        env:
          TRUST_CRITICAL_RESULT: ${{ needs.rc-trust-critical.result }}
          STAGING_SMOKE_RESULT: ${{ needs.rc-staging-smoke.result }}
          GOVERNANCE_RESULT: ${{ needs.rc-governance.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.rc-trust-critical.result }}
          PROVENANCE_BACKFILL_EVIDENCE_REF: ${{ vars.RC_PROVENANCE_BACKFILL_EVIDENCE_REF }}
          SECRET_ROTATION_EVIDENCE_REF: ${{ vars.RC_SECRET_ROTATION_EVIDENCE_REF }}
          INCIDENT_DRILL_EVIDENCE_REF: ${{ vars.RC_INCIDENT_DRILL_EVIDENCE_REF }}
          REQUIRE_RELEASE_EVIDENCE_REFS: ${{ startsWith(github.ref, 'refs/tags/release-') || startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/check-release-evidence-refs.mjs && node scripts/create-release-checklist-artifact.mjs

      - name: Lint debt report
        run: npm run lint:debt:report

      - name: Upload lint debt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-debt-report
          path: |
            audit-artifacts/lint-debt-report.json
            audit-artifacts/lint-debt-issue-template.md
          if-no-files-found: ignore

      - name: Upload release checklist artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-checklist-artifact
          path: audit-artifacts/release-checklist.json
          if-no-files-found: error
