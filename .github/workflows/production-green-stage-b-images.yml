name: Production Green Stage B Images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged Git SHA to build
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the workflow definition to come from protected main
        env:
          EXPECTED_WORKFLOW_REF: refs/heads/main
        run: test "$GITHUB_REF" = "$EXPECTED_WORKFLOW_REF"
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind the trusted workflow tooling revision
        env:
          EXPECTED_TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TOOLING_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          fetch-depth: 0
      - name: Require the approved release to be merged into protected main
        working-directory: release-source
        run: node "$GITHUB_WORKSPACE/scripts/aws/stage-b-release-gate.mjs" "${{ inputs.release_sha }}"

  build-and-attest:
    needs: verify-release
    uses: ./.github/workflows/production-green-stage-b-image-build.yml
    with:
      release_sha: ${{ inputs.release_sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write
