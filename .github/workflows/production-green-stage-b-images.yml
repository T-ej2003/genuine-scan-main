name: Production Green Stage B Images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged Git SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require the workflow definition to come from protected main
        env:
          EXPECTED_WORKFLOW_REF: refs/heads/main
        run: test "$GITHUB_REF" = "$EXPECTED_WORKFLOW_REF"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require the approved release to be merged into protected main
        run: node scripts/aws/stage-b-release-gate.mjs "${{ inputs.release_sha }}"

  build-and-attest:
    needs: verify-release
    uses: ./.github/workflows/production-green-stage-b-image-build.yml
    with:
      release_sha: ${{ inputs.release_sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write
