name: Governed Green Backend Recovery Operation

'on':
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      current_task_definition_arn: { required: true, type: string }
      image_digest: { required: true, type: string }
      evidence_bundle_gzip_base64: { required: true, type: string }
      evidence_bundle_sha256: { required: true, type: string }
      approval_sha256: { required: true, type: string }

jobs:
  execute-green-backend-recovery:
    name: Activate authorized green backend
    if: ${{ github.ref == 'refs/heads/main' && contains(inputs.current_task_definition_arn, '/mscqr-production-rls-green-backend-candidate:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-normal-deploy
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      AWS_REGION: eu-west-2
      SOURCE_SHA: ${{ inputs.source_sha }}
      CURRENT_TASK_DEFINITION_ARN: ${{ inputs.current_task_definition_arn }}
      RECOVERY_IMAGE_DIGEST: ${{ inputs.image_digest }}
      RECOVERY_EVIDENCE_BUNDLE_GZIP_BASE64: ${{ inputs.evidence_bundle_gzip_base64 }}
      RECOVERY_EVIDENCE_BUNDLE_SHA256: ${{ inputs.evidence_bundle_sha256 }}
      GH_TOKEN: ${{ github.token }}
      PUBLIC_BASE_URL: https://www.mscqr.com
    steps:
      - name: Checkout exact prepared protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate execution source before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Node before credentials
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install reviewed Node dependencies before credentials
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Terraform for approved runtime policy recheck
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Download exact preparation approval
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: green-recovery-preparation-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/green-recovery-approval

      - name: Authenticate preparation bytes
        run: |
          set -euo pipefail
          approval_dir="$RUNNER_TEMP/green-recovery-approval"
          test -d "$approval_dir" && test ! -L "$approval_dir"
          chmod 700 "$approval_dir"
          approval="$approval_dir/production-environment-approval.json"
          test -f "$approval" && test ! -L "$approval"
          test "$(sha256sum "$approval" | cut -d' ' -f1)" = "${{ inputs.approval_sha256 }}"
          chmod 600 "$approval"

      - name: Authenticate caller and reviewed host tooling before credentials
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "T-ej2003/genuine-scan-main/.github/workflows/release-gate.yml@refs/heads/main"
          test "$(git ls-tree -r HEAD -- .github/actions scripts/aws scripts/lib scripts/security scripts/rls/lib scripts/smoke-release.mjs backend/scripts/security infra/aws/terraform/lambda/production-rls-approval-broker package.json package-lock.json | sha256sum | cut -d' ' -f1)" = '3205cb5a8b43c85a151784eb5d786d15ec866bfd8bec0d963ad0fc14e45fda2f'

      - name: Assume exact normal-deployer role through protected OIDC environment
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-normal-deployer
          unset-current-credentials: true

      - name: Execute one-use green backend recovery under normal-deployer
        run: |
          set -euo pipefail
          source scripts/aws/production-credential-source.sh
          MSCQR_AWS_CREDENTIAL_SOURCE=github-oidc-normal-deployer
          configure_production_aws_credential_source
          test "$(aws sts get-caller-identity --query Arn --output text)" = "arn:aws:sts::368992683803:assumed-role/mscqr-production-normal-deployer/GitHubActions"
          recovery_dir="$RUNNER_TEMP/backend-health-recovery"
          install -d -m 700 "$recovery_dir"
          bundle_file="$recovery_dir/dispatch-bundle.json"
          node --input-type=module - "$bundle_file" <<'NODE'
          import fs from "node:fs";
          import { decodeBackendHealthRecoveryBundleTransport } from "./scripts/aws/dispatch-production-backend-health-recovery.mjs";
          fs.writeFileSync(process.argv[2], decodeBackendHealthRecoveryBundleTransport(
            process.env.RECOVERY_EVIDENCE_BUNDLE_GZIP_BASE64, process.env.RECOVERY_EVIDENCE_BUNDLE_SHA256), { flag: "wx", mode: 0o600 });
          NODE
          bundle_result="$(node scripts/aws/extract-production-backend-recovery-dispatch-bundle.mjs \
            --bundle "$bundle_file" --bundle-sha256 "$RECOVERY_EVIDENCE_BUNDLE_SHA256" \
            --source-sha "$SOURCE_SHA" --current-task-definition "$CURRENT_TASK_DEFINITION_ARN" \
            --recovery-image-digest "$RECOVERY_IMAGE_DIGEST" --service mscqr-backend-servi-euw2 \
            --release-mode BACKEND_HEALTH_RECOVERY_GREEN_CANDIDATE --output-directory "$recovery_dir")"
          manifest_file="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).manifestFile)' "$bundle_result")"
          component_sha() { node -e 'process.stdout.write(require(process.argv[1]).components[process.argv[2]].sha256)' "$manifest_file" "$1"; }
          node scripts/aws/recover-production-green-backend-health.mjs \
            --execute-handoff --credential-source github-oidc-normal-deployer --source-sha "$SOURCE_SHA" \
            --current-task-definition "$CURRENT_TASK_DEFINITION_ARN" --recovery-image-digest "$RECOVERY_IMAGE_DIGEST" \
            --environment-approval "$RUNNER_TEMP/green-recovery-approval/production-environment-approval.json" \
            --environment-approval-sha256 "${{ inputs.approval_sha256 }}" \
            --image-authorization "$recovery_dir/image-authorization.json" --image-authorization-sha256 "$(component_sha imageAuthorization)" \
            --approval "$recovery_dir/approval.json" --approval-sha256 "$(component_sha approval)" \
            --runtime-consumability "$recovery_dir/runtime-consumability.json" --runtime-consumability-sha256 "$(component_sha runtimeConsumability)" \
            --database-compatibility-reference "$recovery_dir/database-compatibility-reference.json" \
            --database-compatibility-reference-sha256 "$(component_sha databaseCompatibilityReference)" \
            --journal-directory "$recovery_dir" --evidence-out "$recovery_dir/evidence.json"

      - name: Preserve green recovery receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-health-recovery-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-health-recovery/evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Verify recovered backend health
        env:
          SMOKE_PATHS: /api/health/ready
        run: ./scripts/aws/verify-production-smoke.sh

      - name: Commit authenticated green recovery component state
        env:
          MSCQR_AWS_CREDENTIAL_SOURCE: github-oidc-normal-deployer
        run: node scripts/aws/commit-production-component-recovery-state.mjs --evidence="$RUNNER_TEMP/backend-health-recovery/evidence.json"
