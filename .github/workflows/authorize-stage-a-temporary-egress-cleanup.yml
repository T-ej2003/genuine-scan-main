name: Authorize exact Stage-A temporary executor egress cleanup

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Exact protected main SHA, required: true, type: string }
      change_ticket: { description: Approved production change ticket, required: true, type: string }
      verification_ref: { description: Evidence reference for the exact-rule preflight, required: true, type: string }

permissions: { actions: read, contents: read }

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.source_sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate protected source
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          SOURCE_SHA: "${{ inputs.source_sha }}"
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = T-ej2003/genuine-scan-main
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Produce exact approved one-rule authorization
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          SOURCE_SHA: "${{ inputs.source_sha }}"
          CHANGE_TICKET: "${{ inputs.change_ticket }}"
          VERIFICATION_REF: "${{ inputs.verification_ref }}"
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage-a-temporary-egress-cleanup"; install -d -m 700 "$d"
          node scripts/aws/production-github-environment-approval.mjs --output "$d/environment-approval.json" --repository "$GITHUB_REPOSITORY" --environment production --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" --require-actual-approval
          node scripts/aws/production-stage-a-temporary-egress-cleanup.mjs --authorize --production --source-sha "$SOURCE_SHA" --change-ticket "$CHANGE_TICKET" --verification-ref "$VERIFICATION_REF" --environment-approval "$d/environment-approval.json" --output "$d/authorization.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stage-a-temporary-egress-cleanup-authorization
          path: "${{ runner.temp }}/stage-a-temporary-egress-cleanup/authorization.json"
          if-no-files-found: error
          retention-days: 90
