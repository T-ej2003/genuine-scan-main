name: Verify production app-only database compatibility

on:
  workflow_call:
    inputs:
      source_sha: { description: Exact protected-main SHA, required: true, type: string }
      preparation_reference: { description: Exact compact verifier-preparation artifact identity JSON, required: true, type: string }

permissions: { contents: read, actions: read }

jobs:
  review:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show exact verifier subject before protected approval
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_REFERENCE: ${{ inputs.preparation_reference }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { parseAppOnlyArtifactReference, downloadAppOnlyArtifact } from './scripts/aws/production-app-only-artifacts.mjs';
          import { canonicalSha256 } from './scripts/aws/production-green-stage-b-contract.mjs';
          const sourceSha=process.env.SOURCE_SHA;
          assert.match(sourceSha,/^[a-f0-9]{40}$/); assert.equal(sourceSha,process.env.GITHUB_SHA);
          const reference=parseAppOnlyArtifactReference(process.env.PREPARATION_REFERENCE);
          assert.equal(reference.sourceSha,sourceSha);
          const artifact=downloadAppOnlyArtifact({kind:'verifierPreparation',reference,repositoryRoot:process.cwd()});
          const {preparation}=JSON.parse(artifact.bytes);
          const {preparationSha256,...body}=preparation;
          assert.equal(preparationSha256,canonicalSha256(body)); assert.equal(body.sourceSha,sourceSha);
          assert.equal(body.kind,'APP_ONLY_VERIFIER_PREPARATION'); assert.equal(body.eligible,false);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,JSON.stringify({sourceSha,preparationSha256,identity:body.identity,networkSha256:body.networkSha256,definitionSha256:body.definitionSha256,verificationContractSha256:body.verificationContractSha256},null,2));
          NODE

  verify:
    needs: review
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, actions: read, id-token: write }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate actual production approval
        id: approval
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          directory="$(mktemp -d)"
          chmod 700 "$directory"
          node scripts/aws/production-github-environment-approval.mjs --output "$directory/approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-actor "$GITHUB_ACTOR" --require-actual-approval > /dev/null
          printf 'path=%s\n' "$directory/approval.json" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(sha256sum "$directory/approval.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Assume separate bounded provisioner
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-app-only-permission-provisioner
          unset-current-credentials: true
      - name: Register fixed verifier and provision only its exact launcher revision
        id: register
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_REFERENCE: ${{ inputs.preparation_reference }}
          APPROVAL: ${{ steps.approval.outputs.path }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/aws/run-production-app-only-verifier.mjs --mode register --source-sha "$SOURCE_SHA" \
            --preparation-reference "$PREPARATION_REFERENCE" --approval "$APPROVAL" --approval-sha256 "$APPROVAL_SHA256"
      - name: Replace credentials with separate read-only verifier launcher
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-app-only-verifier-launcher
          unset-current-credentials: true
      - name: Run exact private verifier and authenticate bounded output
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_REFERENCE: ${{ inputs.preparation_reference }}
          APPROVAL: ${{ steps.approval.outputs.path }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
          REGISTRATION: ${{ steps.register.outputs.path }}
          REGISTRATION_SHA256: ${{ steps.register.outputs.sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/aws/run-production-app-only-verifier.mjs --mode verify --source-sha "$SOURCE_SHA" \
            --preparation-reference "$PREPARATION_REFERENCE" --approval "$APPROVAL" --approval-sha256 "$APPROVAL_SHA256" \
            --registration "$REGISTRATION" --registration-sha256 "$REGISTRATION_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: production-app-only-compatibility
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve ambiguous-operation journals independently of success
        if: always() && steps.register.outputs.journal != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-app-only-verifier-journals
          path: |
            ${{ steps.register.outputs.journal }}
            ${{ steps.register.outputs.permission_journal }}
            ${{ steps.verify.outputs.journal }}
          if-no-files-found: error
          retention-days: 30
