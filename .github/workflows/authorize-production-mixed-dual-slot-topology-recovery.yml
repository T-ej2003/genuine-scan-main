name: Authorize production mixed dual-slot topology recovery

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Exact protected-main source SHA, required: true, type: string }
      preparation_base64: { description: Exact private preparation bytes, required: true, type: string }
      preparation_file_sha256: { description: Exact private preparation file SHA256, required: true, type: string }
      reason: { description: Operation-specific recovery reason, required: true, type: string }
      approver_role: { description: Independent approver role, required: true, type: string }
      verification_ref: { description: Verification reference, required: true, type: string }

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Verify effective recovery IAM capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate protected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Authenticate preparation IAM preflight before approval
        env:
          PREPARATION_BASE64: ${{ inputs.preparation_base64 }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/mixed-recovery"; install -d -m 700 "$workdir"
          printf '%s' "$PREPARATION_BASE64" | base64 --decode > "$workdir/preparation.json"
          chmod 600 "$workdir/preparation.json"
          node scripts/aws/verify-production-mixed-dual-slot-recovery-preparation.mjs \
            --source-sha "$SOURCE_SHA" --preparation "$workdir/preparation.json" \
            --preparation-file-sha256 "$PREPARATION_FILE_SHA256"
  authorize:
    name: Authorize exact seven-slot recovery
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate protected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          install -d -m 700 "$RUNNER_TEMP/mixed-recovery"
          git ls-files -z > "$RUNNER_TEMP/mixed-recovery/source-files.zlist"
          while IFS= read -r -d '' file; do sha256sum -- "$file"; done < "$RUNNER_TEMP/mixed-recovery/source-files.zlist" > "$RUNNER_TEMP/mixed-recovery/source-before.sha256"
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Re-authenticate source after dependencies
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          while IFS= read -r -d '' file; do sha256sum -- "$file"; done < "$RUNNER_TEMP/mixed-recovery/source-files.zlist" > "$RUNNER_TEMP/mixed-recovery/source-after.sha256"
          cmp --silent "$RUNNER_TEMP/mixed-recovery/source-before.sha256" "$RUNNER_TEMP/mixed-recovery/source-after.sha256"
      - name: Reconstruct exact preparation
        env:
          PREPARATION_BASE64: ${{ inputs.preparation_base64 }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/mixed-recovery"
          printf '%s' "$PREPARATION_BASE64" | base64 --decode > "$workdir/preparation.json"
          chmod 600 "$workdir/preparation.json"
          test "$(sha256sum "$workdir/preparation.json" | awk '{print $1}')" = "$PREPARATION_FILE_SHA256"
      - name: Authenticate protected environment approval
        id: approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$RUNNER_TEMP/mixed-recovery/environment-approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-actor "$GITHUB_ACTOR" --require-actual-approval
          echo "sha256=$(sha256sum "$RUNNER_TEMP/mixed-recovery/environment-approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Produce exact recovery authorization
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
          REASON: ${{ inputs.reason }}
          APPROVER_ROLE: ${{ inputs.approver_role }}
          VERIFICATION_REF: ${{ inputs.verification_ref }}
        run: |
          set -euo pipefail
          node scripts/aws/authorize-production-mixed-dual-slot-topology-recovery.mjs --authorize \
            --output "$RUNNER_TEMP/mixed-recovery/authorization.json" \
            --source-sha "$SOURCE_SHA" --preparation "$RUNNER_TEMP/mixed-recovery/preparation.json" \
            --preparation-file-sha256 "$PREPARATION_FILE_SHA256" \
            --environment-approval "$RUNNER_TEMP/mixed-recovery/environment-approval.json" \
            --environment-approval-sha256 "$APPROVAL_SHA256" --reason "$REASON" \
            --approver-role "$APPROVER_ROLE" --verification-ref "$VERIFICATION_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: production-mixed-dual-slot-topology-recovery-authorization
          path: ${{ runner.temp }}/mixed-recovery/authorization.json
          if-no-files-found: error
          retention-days: 30
