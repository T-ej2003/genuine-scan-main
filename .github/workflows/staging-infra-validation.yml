name: Staging Infra Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-staging-validate:
    name: Terraform staging validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Clean-cache staging Terraform validation
        run: npm run check:staging-terraform

  staging-iam-policy-lint:
    name: Staging IAM policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Lint staging operator IAM policy templates
        run: npm run check:staging-iam-policies
