name: Release Gate

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Main-branch ref used by Release Train"
        required: false
        type: string
        default: main
      target_sha:
        description: "Exact main-branch commit SHA to deploy"
        required: false
        type: string
      release_train_run_id:
        description: "Release Train run ID that dispatched this gate"
        required: false
        type: string
      preserve_current_frontend:
        description: "Keep the currently deployed frontend task definition during a backend/RLS activation."
        required: false
        type: boolean
        default: false
      release_mode:
        description: "Governed production release mode."
        required: false
        type: choice
        options:
          - normal
          - backend-health-recovery
          - rotation-overlap
          - rotation-cleanup
        default: normal
      rotation_id:
        description: "Rotation ID for a governed transition."
        required: false
        type: string
      rotation_state_json:
        description: "Redacted coordinator state JSON; metadata only."
        required: false
        type: string
      rotation_state_sha256:
        description: "SHA-256 of the exact redacted coordinator state bytes."
        required: false
        type: string
      rotation_task_definition_arn:
        description: "Exact pre-registered backend transition task definition ARN."
        required: false
        type: string
      rotation_expected_current_task_definition_arn:
        description: "Exact task definition ARN currently owned by the backend service."
        required: false
        type: string
      rotation_image_digest:
        description: "Immutable digest expected in the transition task definition."
        required: false
        type: string
      rotation_deployment_sha:
        description: "Exact overlap or cleanup deployment SHA bound to coordinator state."
        required: false
        type: string
      rotation_readiness_evidence_json:
        description: "Redacted persisted READY_FOR_OVERLAP_DEPLOYMENT evidence JSON."
        required: false
        type: string
      rotation_readiness_evidence_sha256:
        description: "SHA-256 of the exact readiness evidence JSON bytes."
        required: false
        type: string
      backend_recovery_current_task_definition_arn:
        description: "Exact unhealthy legacy backend task definition ARN."
        required: false
        type: string
      backend_recovery_image_digest:
        description: "Exact approved immutable backend recovery digest."
        required: false
        type: string
      backend_recovery_image_authorization_json:
        description: "Canonical signed-image authorization JSON."
        required: false
        type: string
      backend_recovery_image_authorization_sha256:
        description: "SHA-256 of the exact image authorization JSON bytes."
        required: false
        type: string
      backend_recovery_approval_json:
        description: "Human approval metadata bound to this recovery."
        required: false
        type: string
      backend_recovery_approval_sha256:
        description: "SHA-256 of the exact approval JSON bytes."
        required: false
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve-deploy-target:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: resolve
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          deploy_ref="${INPUT_GIT_REF:-main}"
          git fetch --prune origin main

          if [ -n "${INPUT_TARGET_SHA:-}" ]; then
            deploy_sha="$INPUT_TARGET_SHA"
            git cat-file -e "${deploy_sha}^{commit}"
          else
            deploy_sha="$(git rev-parse "${deploy_ref}^{commit}")"
          fi

          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "::error::Production deploy target must resolve to a commit on main."
            exit 1
          fi

          echo "deploy_ref=$deploy_ref" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved production deploy SHA: $deploy_sha"

      - name: Final required-gate sanity check
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          TARGET_EVENTS: ${{ inputs.release_mode == 'normal' && 'push,workflow_dispatch' || 'push' }}
          REQUIRED_WORKFLOW_FILES: quality-gate.yml,secret-scan.yml,deployment-audit.yml,auth-security-tests.yml,release-candidate-gate.yml
          MAX_ATTEMPTS: 1
          POLL_SECONDS: 0
        run: |
          set -euo pipefail
          node scripts/github/check-required-workflow-gates.mjs

      - name: Validate production release lifecycle mode
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          SOURCE_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          ROTATION_ID: ${{ inputs.rotation_id }}
          ROTATION_STATE_JSON: ${{ inputs.rotation_state_json }}
          ROTATION_STATE_SHA256: ${{ inputs.rotation_state_sha256 }}
          ROTATION_TASK_DEFINITION_ARN: ${{ inputs.rotation_task_definition_arn }}
          ROTATION_EXPECTED_CURRENT_TASK_DEFINITION_ARN: ${{ inputs.rotation_expected_current_task_definition_arn }}
          ROTATION_IMAGE_DIGEST: ${{ inputs.rotation_image_digest }}
          ROTATION_DEPLOYMENT_SHA: ${{ inputs.rotation_deployment_sha }}
          ROTATION_READINESS_EVIDENCE_JSON: ${{ inputs.rotation_readiness_evidence_json }}
          ROTATION_READINESS_EVIDENCE_SHA256: ${{ inputs.rotation_readiness_evidence_sha256 }}
          BACKEND_RECOVERY_CURRENT_TASK_DEFINITION_ARN: ${{ inputs.backend_recovery_current_task_definition_arn }}
          BACKEND_RECOVERY_IMAGE_DIGEST: ${{ inputs.backend_recovery_image_digest }}
          BACKEND_RECOVERY_IMAGE_AUTHORIZATION_JSON: ${{ inputs.backend_recovery_image_authorization_json }}
          BACKEND_RECOVERY_IMAGE_AUTHORIZATION_SHA256: ${{ inputs.backend_recovery_image_authorization_sha256 }}
          BACKEND_RECOVERY_APPROVAL_JSON: ${{ inputs.backend_recovery_approval_json }}
          BACKEND_RECOVERY_APPROVAL_SHA256: ${{ inputs.backend_recovery_approval_sha256 }}
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            normal)
              npm run check:rotation-evidence-freshness
              ;;
            backend-health-recovery)
              for name in BACKEND_RECOVERY_CURRENT_TASK_DEFINITION_ARN BACKEND_RECOVERY_IMAGE_DIGEST BACKEND_RECOVERY_IMAGE_AUTHORIZATION_JSON BACKEND_RECOVERY_IMAGE_AUTHORIZATION_SHA256 BACKEND_RECOVERY_APPROVAL_JSON BACKEND_RECOVERY_APPROVAL_SHA256; do
                if [ -z "${!name:-}" ]; then
                  echo "::error::${name} is required for ${RELEASE_MODE}."
                  exit 1
                fi
              done
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          const inputs = [
            [process.env.BACKEND_RECOVERY_IMAGE_AUTHORIZATION_JSON, process.env.BACKEND_RECOVERY_IMAGE_AUTHORIZATION_SHA256, "image authorization"],
            [process.env.BACKEND_RECOVERY_APPROVAL_JSON, process.env.BACKEND_RECOVERY_APPROVAL_SHA256, "approval"],
          ];
          for (const [bytes, expected, label] of inputs) {
            if (!/^[a-f0-9]{64}$/.test(expected) || createHash("sha256").update(bytes).digest("hex") !== expected) throw new Error(`Backend recovery ${label} bytes do not match their SHA-256.`);
            JSON.parse(bytes);
          }
          NODE
              ;;
            rotation-overlap|rotation-cleanup)
              for name in ROTATION_ID ROTATION_STATE_JSON ROTATION_STATE_SHA256 ROTATION_TASK_DEFINITION_ARN ROTATION_EXPECTED_CURRENT_TASK_DEFINITION_ARN ROTATION_IMAGE_DIGEST ROTATION_DEPLOYMENT_SHA ROTATION_READINESS_EVIDENCE_JSON ROTATION_READINESS_EVIDENCE_SHA256; do
                if [ -z "${!name:-}" ]; then
                  echo "::error::${name} is required for ${RELEASE_MODE}."
                  exit 1
                fi
              done
              state_file="$RUNNER_TEMP/rotation-state.json"
              printf '%s' "$ROTATION_STATE_JSON" > "$state_file"
              chmod 600 "$state_file"
              npm run security:check-production-rotation-transition -- \
                --mode "$RELEASE_MODE" \
                --state-file "$state_file" \
                --state-sha256 "$ROTATION_STATE_SHA256" \
                --source-sha "$SOURCE_SHA" \
                --rotation-id "$ROTATION_ID" \
                --deployment-sha "$ROTATION_DEPLOYMENT_SHA" \
                --task-definition "$ROTATION_TASK_DEFINITION_ARN" \
                --expected-current-task-definition "$ROTATION_EXPECTED_CURRENT_TASK_DEFINITION_ARN" \
                --image-digest "$ROTATION_IMAGE_DIGEST"
              readiness_file="$RUNNER_TEMP/rotation-readiness.json"
              printf '%s' "$ROTATION_READINESS_EVIDENCE_JSON" > "$readiness_file"
              chmod 600 "$readiness_file"
              node scripts/aws/production-overlap-readiness-contract.mjs \
                --mode rotation-overlap \
                --evidence-file "$readiness_file" \
                --evidence-sha256 "$ROTATION_READINESS_EVIDENCE_SHA256" \
                --source-sha "$SOURCE_SHA" \
                --rotation-id "$ROTATION_ID" \
                --rotation-state-sha256 "$ROTATION_STATE_SHA256"
              rm -f "$state_file"
              rm -f "$readiness_file"
              ;;
            *)
              echo "::error::Unsupported release_mode: $RELEASE_MODE"
              exit 1
              ;;
          esac

  deploy-production-ecs:
    name: Deploy production ECS
    needs: resolve-deploy-target
    if: ${{ needs.resolve-deploy-target.outputs.deploy_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mscqr_p2_integration_test
          POSTGRES_USER: mscqr_rls_cert_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mscqr_rls_cert_admin -d mscqr_p2_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_ACCOUNT_ID_EXPECTED: "368992683803"
      AWS_REGION: eu-west-2
      BACKEND_ECR_REPO: mscqr-backend
      FRONTEND_ECR_REPO: mscqr-web
      WORKER_ECR_REPO: mscqr-worker
      CLUSTER_NAME: mscqr-prod-euw2-main
      BACKEND_SERVICE_NAME: mscqr-backend-servi-euw2
      FRONTEND_SERVICE_NAME: mscqr-frontend-servi-euw2
      WORKER_SERVICE_NAME: ${{ vars.PRODUCTION_WORKER_SERVICE_NAME }}
      BACKEND_TASK_DEFINITION: mscqr-backend
      ROTATION_BACKEND_TASK_DEFINITION_FAMILY: mscqr-production-rls-green-backend-candidate
      FRONTEND_TASK_DEFINITION: mscqr-frontend
      WORKER_TASK_DEFINITION: ${{ vars.PRODUCTION_WORKER_TASK_DEFINITION }}
      BACKEND_CONTAINER_NAME: backend
      FRONTEND_CONTAINER_NAME: frontend
      WORKER_CONTAINER_NAME: ${{ vars.PRODUCTION_WORKER_CONTAINER_NAME || 'worker' }}
      PLATFORMS: linux/amd64
      PUBLIC_BASE_URL: https://www.mscqr.com
      DEPLOY_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
      RELEASE_GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
      P2_TEST_DATABASE_REQUIRED: "true"
      P2_TEST_DB_PROTOCOL: postgresql
      P2_TEST_DB_USER: mscqr_rls_cert_admin
      P2_TEST_DB_HOST: 127.0.0.1
      P2_TEST_DB_PORT: "5432"
      P2_TEST_DB_NAME: mscqr_p2_integration_test
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_TLS: "false"
    steps:
      - name: Checkout exact deployment target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Verify exact clean main checkout
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$DEPLOY_SHA" ]; then
            echo "::error::Checked out ${actual_sha}; expected ${DEPLOY_SHA}."
            exit 1
          fi

          git fetch --prune origin main
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "::error::Production deploy target must remain reachable from origin/main."
            exit 1
          fi

          if [ -n "$(git status --short)" ]; then
            echo "::error::Deployment checkout is not clean."
            git status --short
            exit 1
          fi

          echo "Deploy SHA verified: ${DEPLOY_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies deterministically
        run: |
          set -euo pipefail
          npm ci
          npm --prefix backend ci

      - name: Backend build and tests
        run: |
          set -euo pipefail
          npm --prefix backend run build
          npm --prefix backend test

      - name: Frontend typecheck, tests, and build
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Disposable integration tests
        run: |
          set -euo pipefail
          admin_scheme="${P2_TEST_DB_PROTOCOL}:"
          admin_authority="${P2_TEST_DB_USER}@${P2_TEST_DB_HOST}:${P2_TEST_DB_PORT}"
          admin_url="${admin_scheme}//${admin_authority}/${P2_TEST_DB_NAME}"
          printf 'P2_TEST_DATABASE_ADMIN_URL=%s\n' "$admin_url" >> "$GITHUB_ENV"
          P2_TEST_DATABASE_ADMIN_URL="$admin_url" npm run test:integration:ci

      - name: Full RLS verification and PostgreSQL 18.4 certification
        run: |
          set -euo pipefail
          npm run rls:full-verify
          MSCQR_FULL_RLS_CERTIFICATION_CONFIRM=MSCQR_RUN_LOCAL_FULL_RLS_CERTIFICATION \
            MSCQR_FULL_RLS_CERTIFICATION_ADMIN_URL="${P2_TEST_DATABASE_ADMIN_URL:?Disposable PostgreSQL admin URL was not established}" \
            npm run rls:full-certify

      - name: Authenticate production environment approval boundary
        id: production-environment-approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          approval_dir="$RUNNER_TEMP/production-environment-approval"
          if [[ -e "$approval_dir" && ( ! -d "$approval_dir" || -L "$approval_dir" ) ]]; then
            echo "::error::Production environment approval path must be a non-symlink directory."
            exit 1
          fi
          if [[ ! -e "$approval_dir" ]]; then
            install -d -m 700 -- "$approval_dir"
          fi
          if [[ "$(stat -c '%a' "$approval_dir")" != "700" || "$(stat -c '%u' "$approval_dir")" != "$(id -u)" ]]; then
            echo "::error::Production environment approval directory must be operator-owned with mode 0700."
            exit 1
          fi
          evidence_file="$approval_dir/production-environment-approval.json"
          node scripts/aws/production-github-environment-approval.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --environment production \
            --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-actor "$GITHUB_ACTOR" \
            --output "$evidence_file"
          echo "evidence_file=$evidence_file" >> "$GITHUB_OUTPUT"
          echo "evidence_sha256=$(sha256sum "$evidence_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Validate AWS authentication inputs
        id: auth-mode
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure repository/environment variable AWS_ROLE_TO_ASSUME for OIDC, or set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as fallback secrets."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.auth-mode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials via access keys
        if: steps.auth-mode.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Verify AWS account
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account_id" != "$AWS_ACCOUNT_ID_EXPECTED" ]; then
            echo "::error::AWS role resolved to account ${account_id}; expected ${AWS_ACCOUNT_ID_EXPECTED}."
            exit 1
          fi
          echo "AWS account verified for production deployment."

      - name: Login to Amazon ECR
        if: ${{ inputs.release_mode == 'normal' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ inputs.release_mode == 'normal' }}
        uses: docker/setup-buildx-action@v4

      - name: Generate and verify checksum-bound production RLS package
        id: rls-package
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          PRODUCTION_RLS_APPROVAL_SECRET_ARN: ${{ vars.PRODUCTION_RLS_APPROVAL_SECRET_ARN }}
          PRODUCTION_RLS_APPROVAL_KMS_KEY_ARN: ${{ vars.PRODUCTION_RLS_APPROVAL_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          approval_dir="$(dirname "${{ steps.production-environment-approval.outputs.evidence_file }}")"
          if [[ ! -d "$approval_dir" || -L "$approval_dir" || "$(stat -c '%a' "$approval_dir")" != "700" || "$(stat -c '%u' "$approval_dir")" != "$(id -u)" ]]; then
            echo "::error::Production RLS approval requires the authenticated private approval directory."
            exit 1
          fi
          approval_file="$approval_dir/production-rls-approval.json"
          trap 'rm -f "$approval_file"' EXIT
          aws secretsmanager get-secret-value \
            --secret-id "$PRODUCTION_RLS_APPROVAL_SECRET_ARN" \
            --version-stage AWSCURRENT \
            --query SecretString \
            --output text > "$approval_file"
          chmod 600 "$approval_file"
          node scripts/rls/generate-clean-room-rls-sql.mjs \
            --environment production \
            --deployment-id phase2 \
            --release-sha "$RELEASE_GIT_SHA" \
            --approval-artifact "$approval_file" \
            --approval-kms-key-arn "$PRODUCTION_RLS_APPROVAL_KMS_KEY_ARN"
          npm run rls:full-verify
          source_contract="$(node -e 'const value=require("./documents/security/rls-program/generated/checksums.json");process.stdout.write(value.sourceContractSha256)')"
          migration_set_digest="$(node -e 'const value=require("./documents/security/rls-program/generated/checksums.json");process.stdout.write(value.migrationSetDigest)')"
          package_checksum="$(sha256sum documents/security/rls-program/generated/checksums.json | cut -d' ' -f1)"
          echo "source_contract_sha256=$source_contract" >> "$GITHUB_OUTPUT"
          echo "migration_set_digest=$migration_set_digest" >> "$GITHUB_OUTPUT"
          echo "package_checksum_sha256=$package_checksum" >> "$GITHUB_OUTPUT"

      - name: Resolve image metadata
        id: image-meta
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          images_file="$RUNNER_TEMP/published-images.jsonl"
          : > "$images_file"

          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "images_file=$images_file" >> "$GITHUB_OUTPUT"
          echo "image_tag=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "backend_metadata_file=$RUNNER_TEMP/backend-deployment.json" >> "$GITHUB_OUTPUT"
          echo "frontend_metadata_file=$RUNNER_TEMP/frontend-deployment.json" >> "$GITHUB_OUTPUT"
          echo "worker_metadata_file=$RUNNER_TEMP/worker-deployment.json" >> "$GITHUB_OUTPUT"

      - name: Enforce ECR repository controls
        if: ${{ inputs.release_mode == 'normal' }}
        run: |
          set -euo pipefail
          ./scripts/aws/apply-ecr-repository-controls.sh all

      - name: Publish immutable ECS images
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          AWS_ACCOUNT_ID: ${{ steps.image-meta.outputs.account_id }}
          IMAGE_TAG: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          OUTPUT_FILE: ${{ steps.image-meta.outputs.images_file }}
          PRESERVE_CURRENT_FRONTEND: ${{ inputs.preserve_current_frontend }}
        run: |
          set -euo pipefail
          if [ "$PRESERVE_CURRENT_FRONTEND" = "true" ]; then
            ./scripts/aws/publish-ecs-images.sh backend
            ./scripts/aws/publish-ecs-images.sh worker
            ./scripts/aws/publish-ecs-images.sh rls-executor
            frontend_task="$(
              aws ecs describe-services \
                --cluster "$CLUSTER_NAME" \
                --services "$FRONTEND_SERVICE_NAME" \
                --query 'services[0].taskDefinition' \
                --output text
            )"
            if [ "$frontend_task" != "arn:aws:ecs:eu-west-2:368992683803:task-definition/mscqr-frontend:20" ]; then
              echo "::error::Frontend preservation requires the reviewed mscqr-frontend:20 task definition."
              exit 1
            fi
            frontend_image="$(
              aws ecs describe-task-definition \
                --task-definition "$frontend_task" \
                --query "taskDefinition.containerDefinitions[?name=='${FRONTEND_CONTAINER_NAME}'].image | [0]" \
                --output text
            )"
            if ! [[ "$frontend_image" =~ ^[0-9]{12}\.dkr\.ecr\.eu-west-2\.amazonaws\.com/mscqr-web@sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Current frontend task definition is not bound to an immutable production image digest."
              exit 1
            fi
          node --input-type=module - "$OUTPUT_FILE" "$frontend_image" <<'NODE'
          import fs from "node:fs";
          const [outputPath, imageRef] = process.argv.slice(2);
          const [imageUri, imageDigest] = imageRef.split("@");
          fs.appendFileSync(outputPath, `${JSON.stringify({
            service: "frontend", repository: "mscqr-web", image_uri: imageUri,
            image_tag: "preserved-current-task-definition", image_digest: imageDigest, image_ref: imageRef,
          })}\n`);
          NODE
          else
            ./scripts/aws/publish-ecs-images.sh all
          fi

      - name: Resolve backend, frontend, and worker digest refs
        id: images
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          IMAGES_FILE: ${{ steps.image-meta.outputs.images_file }}
        run: |
          set -euo pipefail

          node --input-type=module - "$IMAGES_FILE" "$GITHUB_OUTPUT" <<'NODE'
          import fs from "node:fs";

          const [imagesPath, outputPath] = process.argv.slice(2);
          const records = fs.readFileSync(imagesPath, "utf8")
            .split(/\n+/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));

          for (const service of ["backend", "frontend", "worker", "rls-executor"]) {
            const record = records.find((item) => item.service === service);
            if (!record?.image_ref) {
              throw new Error(`Missing published image record for ${service}.`);
            }
            const outputName = service.replaceAll("-", "_");
            fs.appendFileSync(outputPath, `${outputName}_image_ref=${record.image_ref}\n`);
            fs.appendFileSync(outputPath, `${outputName}_image_uri=${record.image_uri}\n`);
            fs.appendFileSync(outputPath, `${outputName}_image_digest=${record.image_digest}\n`);
          }
          NODE

      - name: Require complete production worker deployment configuration
        if: ${{ inputs.release_mode == 'normal' }}
        run: |
          set -euo pipefail
          if [ -z "$WORKER_SERVICE_NAME" ] || [ -z "$WORKER_TASK_DEFINITION" ]; then
            echo "::error::Production RLS activation requires the current worker service and task definition."
            exit 1
          fi

      - name: Apply and verify checksum-bound production RLS package
        id: database-release
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          MSCQR_FULL_RLS_SOURCE_CONTRACT_SHA256: ${{ steps.rls-package.outputs.source_contract_sha256 }}
          MSCQR_FULL_RLS_MIGRATION_SET_DIGEST: ${{ steps.rls-package.outputs.migration_set_digest }}
          MSCQR_FULL_RLS_PACKAGE_CHECKSUM_SHA256: ${{ steps.rls-package.outputs.package_checksum_sha256 }}
          PRODUCTION_RLS_APPROVAL_ID: ${{ vars.PRODUCTION_RLS_APPROVAL_ID }}
          PRODUCTION_RLS_BROKER_ARN: ${{ vars.PRODUCTION_RLS_BROKER_ARN }}
          PRODUCTION_RLS_EXECUTOR_IMAGE: ${{ steps.images.outputs.rls_executor_image_ref }}
          PRODUCTION_BACKEND_IMAGE: ${{ steps.images.outputs.backend_image_ref }}
          PRODUCTION_WORKER_IMAGE: ${{ steps.images.outputs.worker_image_ref }}
          PRODUCTION_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image_ref }}
          PRODUCTION_RLS_CLUSTER_ARN: arn:aws:ecs:eu-west-2:368992683803:cluster/mscqr-prod-euw2-main
          PRODUCTION_RLS_RECEIPT_BUCKET: ${{ vars.PRODUCTION_RLS_RECEIPT_BUCKET }}
          PRODUCTION_RLS_RELEASE_RECEIPT_PATH: ${{ runner.temp }}/production-rls-release-receipt.json
        run: |
          set -euo pipefail
          node scripts/aws/apply-production-full-rls-release.mjs

      - name: Upload immutable production database receipt
        if: ${{ inputs.release_mode == 'normal' }}
        uses: actions/upload-artifact@v7
        with:
          name: production-rls-release-receipt
          path: ${{ runner.temp }}/production-rls-release-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Deploy backend ECS service
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          SERVICE_NAME: ${{ env.BACKEND_SERVICE_NAME }}
          TASK_DEFINITION: ${{ env.BACKEND_TASK_DEFINITION }}
          CONTAINER_NAME: ${{ env.BACKEND_CONTAINER_NAME }}
          IMAGE_URI: ${{ steps.images.outputs.backend_image_ref }}
          METADATA_FILE: ${{ steps.image-meta.outputs.backend_metadata_file }}
          ENV_UPDATES: GIT_SHA,RELEASE_GIT_SHA
          SECRET_UPDATES_JSON: >-
            {"DATABASE_URL":"${{ vars.PRODUCTION_RLS_APP_SECRET_ARN }}","AUTHENTICATED_APP_DATABASE_URL":"${{ vars.PRODUCTION_RLS_APP_SECRET_ARN }}","PREAUTH_DATABASE_URL":"${{ vars.PRODUCTION_RLS_PREAUTH_SECRET_ARN }}","MSCQR_C03_PREAUTH_DATABASE_URL":"${{ vars.PRODUCTION_RLS_PREAUTH_SECRET_ARN }}"}
          GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          RELEASE_GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ./scripts/aws/deploy-ecs-service.sh

      - name: Authorize rotation transition readiness immediately before mutation
        if: ${{ inputs.release_mode == 'rotation-overlap' || inputs.release_mode == 'rotation-cleanup' }}
        env:
          ROTATION_READINESS_EVIDENCE_JSON: ${{ inputs.rotation_readiness_evidence_json }}
          ROTATION_READINESS_EVIDENCE_SHA256: ${{ inputs.rotation_readiness_evidence_sha256 }}
          ROTATION_ID: ${{ inputs.rotation_id }}
          ROTATION_STATE_SHA256: ${{ inputs.rotation_state_sha256 }}
          SOURCE_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          READINESS_FILE: ${{ runner.temp }}/rotation-readiness.json
        run: |
          set -euo pipefail
          printf '%s' "$ROTATION_READINESS_EVIDENCE_JSON" > "$READINESS_FILE"
          chmod 600 "$READINESS_FILE"
          node scripts/aws/production-overlap-readiness-contract.mjs \
            --mode rotation-overlap \
            --evidence-file "$READINESS_FILE" \
            --evidence-sha256 "$ROTATION_READINESS_EVIDENCE_SHA256" \
            --source-sha "$SOURCE_SHA" \
            --rotation-id "$ROTATION_ID" \
            --rotation-state-sha256 "$ROTATION_STATE_SHA256"

      - name: Deploy rotation transition backend ECS service
        if: ${{ inputs.release_mode == 'rotation-overlap' || inputs.release_mode == 'rotation-cleanup' }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          SERVICE_NAME: ${{ env.BACKEND_SERVICE_NAME }}
          CONTAINER_NAME: ${{ env.BACKEND_CONTAINER_NAME }}
          EXISTING_TASK_DEFINITION_ARN: ${{ inputs.rotation_task_definition_arn }}
          EXPECTED_CURRENT_TASK_DEFINITION_ARN: ${{ inputs.rotation_expected_current_task_definition_arn }}
          EXPECTED_FAMILY: ${{ env.ROTATION_BACKEND_TASK_DEFINITION_FAMILY }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.rotation_image_digest }}
          VERSION_URL: ${{ env.PUBLIC_BASE_URL }}/api/health
          EXPECTED_GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          ENABLE_EXECUTE_COMMAND: "true"
          PROPAGATE_TAGS: "TASK_DEFINITION"
          WAIT_FOR_STABLE: "true"
          METADATA_FILE: ${{ runner.temp }}/rotation-transition-backend.json
          OVERLAP_READINESS_EVIDENCE_FILE: ${{ runner.temp }}/rotation-readiness.json
          OVERLAP_READINESS_EVIDENCE_SHA256: ${{ inputs.rotation_readiness_evidence_sha256 }}
          ROTATION_ID: ${{ inputs.rotation_id }}
          ROTATION_STATE_SHA256: ${{ inputs.rotation_state_sha256 }}
          DEPLOYMENT_SOURCE_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          node scripts/aws/run-production-cutover.mjs \
            --mode rotation-overlap \
            --source-sha "$DEPLOYMENT_SOURCE_SHA" \
            --rotation-id "$ROTATION_ID" \
            --rotation-state-sha256 "$ROTATION_STATE_SHA256" \
            --task-definition "$EXISTING_TASK_DEFINITION_ARN" \
            --readiness-file "$OVERLAP_READINESS_EVIDENCE_FILE" \
            --readiness-sha256 "$OVERLAP_READINESS_EVIDENCE_SHA256"

      - name: Prepare governed legacy backend health recovery
        id: backend-recovery
        if: ${{ inputs.release_mode == 'backend-health-recovery' }}
        env:
          SOURCE_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          CURRENT_TASK_DEFINITION_ARN: ${{ inputs.backend_recovery_current_task_definition_arn }}
          RECOVERY_IMAGE_DIGEST: ${{ inputs.backend_recovery_image_digest }}
          IMAGE_AUTHORIZATION_JSON: ${{ inputs.backend_recovery_image_authorization_json }}
          IMAGE_AUTHORIZATION_SHA256: ${{ inputs.backend_recovery_image_authorization_sha256 }}
          APPROVAL_JSON: ${{ inputs.backend_recovery_approval_json }}
          APPROVAL_SHA256: ${{ inputs.backend_recovery_approval_sha256 }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          recovery_dir="$RUNNER_TEMP/backend-health-recovery"
          install -d -m 700 "$recovery_dir"
          image_file="$recovery_dir/image-authorization.json"
          approval_file="$recovery_dir/approval.json"
          authorization_file="$recovery_dir/authorization.json"
          printf '%s' "$IMAGE_AUTHORIZATION_JSON" > "$image_file"
          printf '%s' "$APPROVAL_JSON" > "$approval_file"
          chmod 600 "$image_file" "$approval_file"
          node scripts/aws/recover-production-backend-health.mjs \
            --prepare \
            --source-sha "$SOURCE_SHA" \
            --environment-approval "${{ steps.production-environment-approval.outputs.evidence_file }}" \
            --environment-approval-sha256 "${{ steps.production-environment-approval.outputs.evidence_sha256 }}" \
            --current-task-definition "$CURRENT_TASK_DEFINITION_ARN" \
            --recovery-image-digest "$RECOVERY_IMAGE_DIGEST" \
            --image-authorization "$image_file" \
            --image-authorization-sha256 "$IMAGE_AUTHORIZATION_SHA256" \
            --approval "$approval_file" \
            --approval-sha256 "$APPROVAL_SHA256" \
            --output "$authorization_file"
          echo "image_file=$image_file" >> "$GITHUB_OUTPUT"
          echo "authorization_file=$authorization_file" >> "$GITHUB_OUTPUT"
          echo "authorization_sha256=$(sha256sum "$authorization_file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Execute governed legacy backend health recovery
        if: ${{ inputs.release_mode == 'backend-health-recovery' }}
        env:
          SOURCE_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          node scripts/aws/recover-production-backend-health.mjs \
            --execute \
            --source-sha "$SOURCE_SHA" \
            --environment-approval "${{ steps.production-environment-approval.outputs.evidence_file }}" \
            --environment-approval-sha256 "${{ steps.production-environment-approval.outputs.evidence_sha256 }}" \
            --image-authorization "${{ steps.backend-recovery.outputs.image_file }}" \
            --image-authorization-sha256 "${{ inputs.backend_recovery_image_authorization_sha256 }}" \
            --authorization "${{ steps.backend-recovery.outputs.authorization_file }}" \
            --authorization-sha256 "${{ steps.backend-recovery.outputs.authorization_sha256 }}" \
            --health-url "${{ env.PUBLIC_BASE_URL }}/api/health/ready" \
            --evidence-out "$RUNNER_TEMP/backend-health-recovery/evidence.json"

      - name: Upload backend health recovery evidence
        if: ${{ always() && inputs.release_mode == 'backend-health-recovery' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-health-recovery-evidence
          path: ${{ runner.temp }}/backend-health-recovery/evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Verify backend health
        env:
          SMOKE_PATHS: /api/health/ready
        run: |
          set -euo pipefail
          ./scripts/aws/verify-production-smoke.sh

      - name: Deploy worker ECS service
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          SERVICE_NAME: ${{ env.WORKER_SERVICE_NAME }}
          TASK_DEFINITION: ${{ env.WORKER_TASK_DEFINITION }}
          CONTAINER_NAME: ${{ env.WORKER_CONTAINER_NAME }}
          IMAGE_URI: ${{ steps.images.outputs.worker_image_ref }}
          METADATA_FILE: ${{ steps.image-meta.outputs.worker_metadata_file }}
          ENV_UPDATES: GIT_SHA,RELEASE_GIT_SHA
          SECRET_UPDATES_JSON: >-
            {"DATABASE_URL":"${{ vars.PRODUCTION_RLS_WORKER_SECRET_ARN }}"}
          GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
          RELEASE_GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ./scripts/aws/deploy-ecs-service.sh

      - name: Deploy frontend ECS service
        if: ${{ inputs.release_mode == 'normal' && !inputs.preserve_current_frontend }}
        env:
          CLUSTER_NAME: ${{ env.CLUSTER_NAME }}
          SERVICE_NAME: ${{ env.FRONTEND_SERVICE_NAME }}
          TASK_DEFINITION: ${{ env.FRONTEND_TASK_DEFINITION }}
          CONTAINER_NAME: ${{ env.FRONTEND_CONTAINER_NAME }}
          IMAGE_URI: ${{ steps.images.outputs.frontend_image_ref }}
          METADATA_FILE: ${{ steps.image-meta.outputs.frontend_metadata_file }}
          ENV_UPDATES: GIT_SHA
          GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ./scripts/aws/deploy-ecs-service.sh

      - name: Verify frontend and public health
        if: ${{ inputs.release_mode == 'normal' && !inputs.preserve_current_frontend }}
        run: |
          set -euo pipefail
          ./scripts/aws/verify-production-smoke.sh

      - name: Summarize ECS production deployment
        if: ${{ inputs.release_mode == 'normal' }}
        env:
          BACKEND_METADATA_FILE: ${{ steps.image-meta.outputs.backend_metadata_file }}
          FRONTEND_METADATA_FILE: ${{ steps.image-meta.outputs.frontend_metadata_file }}
          WORKER_METADATA_FILE: ${{ steps.image-meta.outputs.worker_metadata_file }}
          BACKEND_IMAGE_REF: ${{ steps.images.outputs.backend_image_ref }}
          FRONTEND_IMAGE_REF: ${{ steps.images.outputs.frontend_image_ref }}
          WORKER_IMAGE_REF: ${{ steps.images.outputs.worker_image_ref }}
          RLS_EXECUTOR_IMAGE_REF: ${{ steps.images.outputs.rls_executor_image_ref }}
          RLS_SOURCE_CONTRACT_SHA256: ${{ steps.rls-package.outputs.source_contract_sha256 }}
          RLS_PACKAGE_CHECKSUM_SHA256: ${{ steps.rls-package.outputs.package_checksum_sha256 }}
          RLS_RELEASE_RECEIPT_FILE: ${{ runner.temp }}/production-rls-release-receipt.json
          PRESERVE_CURRENT_FRONTEND: ${{ inputs.preserve_current_frontend }}
        run: |
          set -euo pipefail

          backend_new_task="$(
            node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.newTaskDefinitionArn || "");' "$BACKEND_METADATA_FILE"
          )"
          backend_previous_task="$(
            node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.previousTaskDefinitionArn || "");' "$BACKEND_METADATA_FILE"
          )"
          if [ "$PRESERVE_CURRENT_FRONTEND" = "true" ]; then
            frontend_new_task="arn:aws:ecs:eu-west-2:368992683803:task-definition/mscqr-frontend:20"
            frontend_previous_task="$frontend_new_task"
          else
            frontend_new_task="$(
              node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.newTaskDefinitionArn || "");' "$FRONTEND_METADATA_FILE"
            )"
            frontend_previous_task="$(
              node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.previousTaskDefinitionArn || "");' "$FRONTEND_METADATA_FILE"
            )"
          fi
          worker_new_task="$(
            node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.newTaskDefinitionArn || "");' "$WORKER_METADATA_FILE"
          )"
          worker_previous_task="$(
            node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.previousTaskDefinitionArn || "");' "$WORKER_METADATA_FILE"
          )"
          rls_receipt_bundle="$(
            node --input-type=module -e 'import fs from "node:fs"; const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(payload.receiptBundleSha256 || "");' "$RLS_RELEASE_RECEIPT_FILE"
          )"

          {
            echo "## Production ECS deployment"
            echo
            echo "- Deployed SHA: \`${DEPLOY_SHA}\`"
            echo "- AWS account: \`${AWS_ACCOUNT_ID_EXPECTED}\`"
            echo "- AWS region: \`${AWS_REGION}\`"
            echo "- Cluster: \`${CLUSTER_NAME}\`"
            echo "- Platform: \`${PLATFORMS}\`"
            echo "- RLS source contract: \`${RLS_SOURCE_CONTRACT_SHA256}\`"
            echo "- RLS package checksum: \`${RLS_PACKAGE_CHECKSUM_SHA256}\`"
            echo "- RLS executor image: \`${RLS_EXECUTOR_IMAGE_REF}\`"
            echo "- RLS receipt bundle: \`${rls_receipt_bundle}\`"
            echo
            echo "### Backend"
            echo
            echo "- Service: \`${BACKEND_SERVICE_NAME}\`"
            echo "- Image: \`${BACKEND_IMAGE_REF}\`"
            echo "- Previous task definition: \`${backend_previous_task}\`"
            echo "- New task definition: \`${backend_new_task}\`"
            echo "- Health: \`/api/health/ready\` passed"
            echo
            echo "### Worker"
            echo
            echo "- Image: \`${WORKER_IMAGE_REF}\`"
            echo "- Service: \`${WORKER_SERVICE_NAME}\`"
            echo "- Previous task definition: \`${worker_previous_task}\`"
            echo "- New task definition: \`${worker_new_task}\`"
            echo "- Stability: ECS service-stable waiter passed"
            echo
            echo "### Frontend"
            echo
            echo "- Service: \`${FRONTEND_SERVICE_NAME}\`"
            echo "- Image: \`${FRONTEND_IMAGE_REF}\`"
            echo "- Previous task definition: \`${frontend_previous_task}\`"
            echo "- New task definition: \`${frontend_new_task}\`"
            if [ "$PRESERVE_CURRENT_FRONTEND" = "true" ]; then
              echo "- Deployment: preserved reviewed task definition \`mscqr-frontend:20\`"
            else
              echo "- Health: \`/\`, \`/login\`, and \`/api/health/ready\` passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
