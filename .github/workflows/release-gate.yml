name: Release Gate

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Main-branch ref used by Release Train"
        required: false
        type: string
        default: main
      target_sha:
        description: "Exact main-branch commit SHA to deploy"
        required: false
        type: string
      release_train_run_id:
        description: "Release Train run ID that dispatched this gate"
        required: false
        type: string
      expert_override:
        description: "Expert-only emergency override. Skips final required-gate sanity check."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve-deploy-target:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: resolve
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          deploy_ref="${INPUT_GIT_REF:-main}"
          git fetch --prune origin main

          if [ -n "${INPUT_TARGET_SHA:-}" ]; then
            deploy_sha="$INPUT_TARGET_SHA"
            git cat-file -e "${deploy_sha}^{commit}"
          else
            deploy_sha="$(git rev-parse "${deploy_ref}^{commit}")"
          fi

          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "::error::Production deploy target must resolve to a commit on main."
            exit 1
          fi

          echo "deploy_ref=$deploy_ref" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved production deploy SHA: $deploy_sha"

      - name: Final required-gate sanity check
        if: ${{ !inputs.expert_override }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve.outputs.deploy_sha }}
          TARGET_EVENTS: push,workflow_dispatch
          REQUIRED_WORKFLOW_FILES: quality-gate.yml,secret-scan.yml,deployment-audit.yml
          MAX_ATTEMPTS: 1
          POLL_SECONDS: 0
        run: node scripts/github/check-required-workflow-gates.mjs

      - name: Expert override notice
        if: ${{ inputs.expert_override }}
        run: |
          echo "::warning::Expert override enabled. Required workflow gate sanity check was skipped."
          echo "Use only for emergency production deployment after human verification."

  deploy-production:
    name: Deploy production via Ansible
    needs: resolve-deploy-target
    if: ${{ needs.resolve-deploy-target.outputs.deploy_sha != '' }}
    runs-on: [self-hosted, linux, production-deploy]
    timeout-minutes: 60
    environment: production
    env:
      ANSIBLE_HOST_KEY_CHECKING: "true"
      DEPLOY_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
      RELEASE_GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Ansible on self-hosted runner
        run: |
          set -euo pipefail

          if ! command -v ansible-playbook >/dev/null 2>&1; then
            echo "ansible-playbook is not installed on this self-hosted runner."
            echo "Install it on the runner with: sudo apt install -y ansible"
            exit 1
          fi

          ansible --version
          ansible-playbook --version


      - name: Verify production environment requires approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/environments/production`, {
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
          });

          if (!response.ok) {
            const body = await response.text();
            throw new Error(`Unable to read production environment protection rules (${response.status}): ${body.slice(0, 300)}`);
          }

          const environment = await response.json();
          const requiredReviewersRule = (environment.protection_rules || []).find((rule) => rule.type === "required_reviewers");
          const reviewers = requiredReviewersRule?.reviewers || [];
          if (reviewers.length === 0) {
            throw new Error("The production GitHub Environment must require at least one reviewer before production deployment can run.");
          }

          console.log("Production environment required reviewers are configured. Reviewer identities were not printed.");
          NODE

      - name: Validate deployment secrets
        env:
          PROD_ANSIBLE_INVENTORY: ${{ secrets.PROD_ANSIBLE_INVENTORY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          QR_SIGN_ACTIVE_KEY_VERSION: ${{ secrets.QR_SIGN_ACTIVE_KEY_VERSION }}
          QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION: ${{ secrets.QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION }}
          QR_SIGN_PRIVATE_KEY: ${{ secrets.QR_SIGN_PRIVATE_KEY }}
          QR_SIGN_PROVIDER: ${{ secrets.QR_SIGN_PROVIDER }}
          QR_SIGN_PUBLIC_KEY: ${{ secrets.QR_SIGN_PUBLIC_KEY }}
          RELEASE_GIT_SHA: ${{ needs.resolve-deploy-target.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          missing=()
          if [ -n "$PROD_ANSIBLE_INVENTORY" ]; then
            [ -n "$PROD_SSH_PRIVATE_KEY" ] || missing+=("PROD_SSH_PRIVATE_KEY")
            [ -n "$PROD_KNOWN_HOSTS" ] || missing+=("PROD_KNOWN_HOSTS")
          else
            [ -n "$PROD_SSH_HOST" ] || missing+=("PROD_SSH_HOST")
            [ -n "$PROD_SSH_USER" ] || missing+=("PROD_SSH_USER")
            [ -n "$PROD_SSH_PRIVATE_KEY" ] || missing+=("PROD_SSH_PRIVATE_KEY")
          fi
          [ -n "$QR_SIGN_ACTIVE_KEY_VERSION" ] || missing+=("QR_SIGN_ACTIVE_KEY_VERSION")
          [ -n "$QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION" ] || missing+=("QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION")
          [ -n "$QR_SIGN_PRIVATE_KEY" ] || missing+=("QR_SIGN_PRIVATE_KEY")
          [ -n "$QR_SIGN_PROVIDER" ] || missing+=("QR_SIGN_PROVIDER")
          [ -n "$QR_SIGN_PUBLIC_KEY" ] || missing+=("QR_SIGN_PUBLIC_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required production deployment secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          echo "Required production deployment secret names are configured. Values were not printed."

      - name: Configure SSH and generated inventory
        env:
          PROD_ANSIBLE_INVENTORY: ${{ secrets.PROD_ANSIBLE_INVENTORY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"

          ssh_key_file="$HOME/.ssh/prod_deploy_key"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$ssh_key_file"
          chmod 600 "$ssh_key_file"

          known_hosts_file="$HOME/.ssh/known_hosts"
          if [ -n "$PROD_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_KNOWN_HOSTS" > "$known_hosts_file"
          else
            prod_ssh_port="${PROD_SSH_PORT:-22}"
            ssh-keyscan -p "$prod_ssh_port" -H "$PROD_SSH_HOST" 2>/dev/null > "$known_hosts_file"
          fi
          chmod 600 "$known_hosts_file"

          if [ ! -s "$known_hosts_file" ]; then
            echo "::error::Known hosts file is empty. Configure PROD_KNOWN_HOSTS or allow ssh-keyscan for PROD_SSH_HOST."
            exit 1
          fi

          if [ -n "$PROD_ANSIBLE_INVENTORY" ]; then
            printf '%s\n' "$PROD_ANSIBLE_INVENTORY" > ops/deploy/inventory.ini
          else
            prod_ssh_port="${PROD_SSH_PORT:-22}"
            {
              echo "[active]"
              printf 'production ansible_host=%s ansible_user=%s ansible_port=%s ansible_ssh_private_key_file=%s ansible_python_interpreter=/usr/bin/python3\n' \
                "$PROD_SSH_HOST" "$PROD_SSH_USER" "$prod_ssh_port" "$ssh_key_file"
              echo
              echo "[mscqr_servers:children]"
              echo "active"
            } > ops/deploy/inventory.ini
          fi
          chmod 600 ops/deploy/inventory.ini

          echo "Generated production Ansible inventory at ops/deploy/inventory.ini."

      - name: Validate Ansible playbook syntax
        run: ansible-playbook -i ops/deploy/inventory.ini ops/deploy/deploy.yml --syntax-check

      - name: Deploy gated SHA to production
        env:
          QR_SIGN_ACTIVE_KEY_VERSION: ${{ secrets.QR_SIGN_ACTIVE_KEY_VERSION }}
          QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION: ${{ secrets.QR_SIGN_ENFORCE_ED25519_IN_PRODUCTION }}
          QR_SIGN_PRIVATE_KEY: ${{ secrets.QR_SIGN_PRIVATE_KEY }}
          QR_SIGN_PROVIDER: ${{ secrets.QR_SIGN_PROVIDER }}
          QR_SIGN_PUBLIC_KEY: ${{ secrets.QR_SIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          known_hosts_file="${HOME}/.ssh/known_hosts"

          if [ ! -s "$known_hosts_file" ]; then
            echo "::error::Known hosts file is missing or empty at ${known_hosts_file}."
            exit 1
          fi

          export ANSIBLE_SSH_ARGS="-o UserKnownHostsFile=${known_hosts_file} -o StrictHostKeyChecking=yes"

          ansible-playbook \
            -i ops/deploy/inventory.ini \
            ops/deploy/deploy.yml \
            --extra-vars "branch=main deploy_ref=$DEPLOY_SHA"
