name: Produce Stage B reconciliation prerequisites

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Exact protected-main source SHA, required: true, type: string }
      ticket_id: { description: Externally issued change-ticket identifier, required: true, type: string }

permissions: { actions: read, contents: read, id-token: write }
concurrency: { group: production-deploy, cancel-in-progress: false }

jobs:
  produce:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-release-deployer
      - name: Produce and authenticate the four canonical prerequisites
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TICKET_ID: ${{ inputs.ticket_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node scripts/aws/produce-production-green-stage-b-prerequisite-bundle.mjs --source-sha "$SOURCE_SHA" --ticket-id "$TICKET_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: production-green-stage-b-state-reconciliation-prerequisites
          path: ${{ runner.temp }}/stage-b-prerequisite-bundle/prerequisite-bundle.zip
          if-no-files-found: error
          retention-days: 1
