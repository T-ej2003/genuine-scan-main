name: Authorize initial-activation reconciler bootstrap role

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Exact protected-main source SHA, required: true, type: string }

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  authorize-bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate protected source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq '.commit.sha')"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Capture independent production approval
        id: approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/initial-activation-bootstrap"
          install -d -m 700 "$workdir"
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$workdir/environment-approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production \
            --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" \
            --require-actual-approval
          echo "sha256=$(sha256sum "$workdir/environment-approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Produce exact root bootstrap authorization
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
        run: |
          set -euo pipefail
          node scripts/aws/production-initial-activation-reconciler-bootstrap.mjs --authorize \
            --source-sha "$SOURCE_SHA" \
            --environment-approval "$RUNNER_TEMP/initial-activation-bootstrap/environment-approval.json" \
            --environment-approval-sha256 "$APPROVAL_SHA256" \
            --output "$RUNNER_TEMP/initial-activation-bootstrap/bootstrap-authorization.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-initial-activation-policy-reconciler-bootstrap-authorization
          path: ${{ runner.temp }}/initial-activation-bootstrap/bootstrap-authorization.json
          if-no-files-found: error
          retention-days: 7
