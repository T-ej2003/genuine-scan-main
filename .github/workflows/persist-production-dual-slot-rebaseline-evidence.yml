name: Persist production dual-slot rebaseline evidence

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Protected source that publishes the durable evidence, required: true, type: string }
      durable_evidence_submission_base64: { description: Exact non-secret canonical durable-evidence submission, base64 encoded, required: true, type: string }

permissions:
  contents: read

jobs:
  persist-dual-slot-rebaseline-evidence:
    name: Persist exact non-secret rebaseline evidence
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Authenticate protected source and publish only canonical evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SUBMISSION_BASE64: ${{ inputs.durable_evidence_submission_base64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          workdir="$RUNNER_TEMP/dual-slot-rebaseline-durable-evidence"
          install -d -m 700 "$workdir"
          printf '%s' "$SUBMISSION_BASE64" | base64 --decode > "$workdir/submission.json"
          node scripts/aws/publish-production-dual-slot-rebaseline-durable-evidence.mjs --source-sha "$SOURCE_SHA" --input "$workdir/submission.json" --output-directory "$workdir/artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: production-dual-slot-rebaseline-durable-evidence
          path: ${{ runner.temp }}/dual-slot-rebaseline-durable-evidence/artifact/*
          if-no-files-found: error
          retention-days: 90
