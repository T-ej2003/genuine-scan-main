name: AWS DR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Detect DR-relevant change scope
        id: scope
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("dr_relevant", "true");
              return;
            }
            const { isDrRelevantChange } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/aws-dr-validation-contract.mjs`);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            core.setOutput("dr_relevant", String(files.some(isDrRelevantChange)));

      - name: Validate DR guardrails
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npm run verify:guardrails:source
          else
            npm run verify:guardrails
          fi

      - name: Validate dispatch DR safety contracts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npm run check:documents
          npm run check:aws-dr-safety

      - name: Validate DR-specific static contracts
        if: ${{ github.event_name == 'workflow_dispatch' || steps.scope.outputs.dr_relevant == 'true' }}
        run: |
          /bin/sh -n scripts/deploy-standby.sh
          /bin/sh -n scripts/health-check-regions.sh
          for file in scripts/dr/*.sh; do
            /bin/sh -n "$file"
          done
          for file in ops/aws/iam/dr/*.json; do
            python3 -m json.tool "$file" >/dev/null
          done
          ruby -e 'require "yaml"; Dir[".github/workflows/aws-dr-*.yml"].sort.each { |file| workflow = YAML.load_file(file); dispatch = (workflow["on"] || workflow[true] || {})["workflow_dispatch"] || {}; count = (dispatch["inputs"] || {}).length; puts "#{file}: #{count} workflow_dispatch input(s)"; raise "#{file} has more than 25 workflow_dispatch inputs" if count > 25 }'
          git diff --check

      - name: Install Ansible safely for syntax checks
        if: ${{ github.event_name == 'workflow_dispatch' || steps.scope.outputs.dr_relevant == 'true' }}
        run: |
          python3 -m pip install --user ansible-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Ansible standby playbooks
        if: ${{ github.event_name == 'workflow_dispatch' || steps.scope.outputs.dr_relevant == 'true' }}
        run: |
          ansible-inventory -i ops/deploy/inventory.example.ini --list
          ansible-playbook -i ops/deploy/inventory.example.ini ops/deploy/bootstrap-standby.yml --syntax-check
          ansible-playbook -i ops/deploy/inventory.example.ini ops/deploy/deploy-standby.yml --syntax-check
          ansible-playbook -i ops/deploy/inventory.example.ini ops/deploy/health-check-standby.yml --syntax-check
          ansible-playbook -i ops/deploy/inventory.example.ini ops/deploy/test-standby-recovered-db.yml --syntax-check
          ansible-playbook -i ops/deploy/inventory.example.ini ops/deploy/rollback-standby-db-env.yml --syntax-check
