name: Production Web Activation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact authenticated Stage-B and web image release SHA, reachable from protected main
        required: true
        type: string
      stage_b_authorization_json:
        description: Exact signed four-image Stage-B authorization
        required: true
        type: string
      stage_b_authorization_sha256:
        description: SHA-256 of Stage-B authorization bytes
        required: true
        type: string
      web_authorization_json:
        description: Exact signed web-image authorization
        required: true
        type: string
      web_authorization_sha256:
        description: SHA-256 of web authorization bytes
        required: true
        type: string
      backend_activation_evidence_json:
        description: Exact completed backend activation evidence from the coordinated release
        required: false
        type: string
      backend_activation_evidence_sha256:
        description: SHA-256 of backend activation evidence bytes
        required: false
        type: string
      overlap_run_id:
        description: Exact successful protected overlap Release Gate run ID
        required: false
        type: string
      overlap_run_attempt:
        description: Exact successful protected overlap run attempt
        required: false
        type: string
      overlap_release_sha:
        description: Original authenticated rotation release SHA
        required: false
        type: string
      overlap_rotation_id:
        description: Original authenticated rotation ID
        required: false
        type: string

permissions:
  contents: read
  actions: read
  deployments: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Bind exact protected source
        env:
          TARGET_SHA: '${{ inputs.target_sha }}'
          WORKFLOW_DEFINITION_SHA: '${{ github.sha }}'
          OVERLAP_RELEASE_SHA: '${{ inputs.overlap_release_sha }}'
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_DEFINITION_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$WORKFLOW_DEFINITION_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$WORKFLOW_DEFINITION_SHA"
          protected_main_sha="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "$protected_main_sha"
          git merge-base --is-ancestor "$WORKFLOW_DEFINITION_SHA" "$protected_main_sha"
          if [[ -n "$OVERLAP_RELEASE_SHA" ]]; then
            [[ "$OVERLAP_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$OVERLAP_RELEASE_SHA" "$WORKFLOW_DEFINITION_SHA"
          fi
          test -z "$(git status --porcelain)"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-release-deployer
      - name: Authenticate coordinated Stage-B and web evidence
        env:
          MSCQR_AWS_CREDENTIAL_SOURCE: github-oidc-release-deployer
          TARGET_SHA: '${{ inputs.target_sha }}'
          STAGE_B_AUTHORIZATION_JSON: '${{ inputs.stage_b_authorization_json }}'
          STAGE_B_AUTHORIZATION_SHA256: '${{ inputs.stage_b_authorization_sha256 }}'
          WEB_AUTHORIZATION_JSON: '${{ inputs.web_authorization_json }}'
          WEB_AUTHORIZATION_SHA256: '${{ inputs.web_authorization_sha256 }}'
          BACKEND_ACTIVATION_EVIDENCE_JSON: '${{ inputs.backend_activation_evidence_json }}'
          BACKEND_ACTIVATION_EVIDENCE_SHA256: '${{ inputs.backend_activation_evidence_sha256 }}'
          OVERLAP_RUN_ID: '${{ inputs.overlap_run_id }}'
          OVERLAP_RUN_ATTEMPT: '${{ inputs.overlap_run_attempt }}'
          OVERLAP_RELEASE_SHA: '${{ inputs.overlap_release_sha }}'
          OVERLAP_ROTATION_ID: '${{ inputs.overlap_rotation_id }}'
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/web-activation"
          install -d -m 700 "$directory"
          trap 'rm -rf "$directory"' EXIT
          printf '%s' "$STAGE_B_AUTHORIZATION_JSON" > "$directory/stage-b.json"
          printf '%s' "$WEB_AUTHORIZATION_JSON" > "$directory/web.json"
          if [[ -n "$OVERLAP_RUN_ID$OVERLAP_RUN_ATTEMPT$OVERLAP_RELEASE_SHA$OVERLAP_ROTATION_ID" ]]; then
            test -z "$BACKEND_ACTIVATION_EVIDENCE_JSON$BACKEND_ACTIVATION_EVIDENCE_SHA256"
            activation_args=(--overlap-run-id "$OVERLAP_RUN_ID" --overlap-run-attempt "$OVERLAP_RUN_ATTEMPT" --overlap-release-sha "$OVERLAP_RELEASE_SHA" --overlap-rotation-id "$OVERLAP_ROTATION_ID" --tooling-sha "$WORKFLOW_DEFINITION_SHA")
          else
            test -n "$BACKEND_ACTIVATION_EVIDENCE_JSON$BACKEND_ACTIVATION_EVIDENCE_SHA256"
            printf '%s' "$BACKEND_ACTIVATION_EVIDENCE_JSON" > "$directory/backend.json"
            activation_args=(--backend-activation-evidence "$directory/backend.json" --backend-activation-evidence-sha256 "$BACKEND_ACTIVATION_EVIDENCE_SHA256")
          fi
          chmod 600 "$directory"/*.json
          node scripts/aws/verify-production-web-release-authorization.mjs \
            --source-sha "$TARGET_SHA" \
            --stage-b-authorization "$directory/stage-b.json" \
            --stage-b-authorization-sha256 "$STAGE_B_AUTHORIZATION_SHA256" \
            --web-authorization "$directory/web.json" \
            --web-authorization-sha256 "$WEB_AUTHORIZATION_SHA256" \
            --output "$directory/coordinated.json"
          node scripts/aws/run-production-web-activation.mjs \
            --source-sha "$TARGET_SHA" \
            --stage-b-authorization "$directory/stage-b.json" \
            --stage-b-authorization-sha256 "$STAGE_B_AUTHORIZATION_SHA256" \
            --web-authorization "$directory/web.json" \
            --web-authorization-sha256 "$WEB_AUTHORIZATION_SHA256" \
            "${activation_args[@]}"
