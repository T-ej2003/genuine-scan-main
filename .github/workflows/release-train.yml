name: Release Train

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Exact dispatch ref: main for its current head, or refs/tags/release-* / refs/tags/v* for an older supported target."
        required: false
        type: string
        default: main
      target_sha:
        description: "Optional exact main-branch commit SHA. It must equal the resolved immutable dispatch ref."
        required: false
        type: string
      ticket_id:
        description: "Externally issued production release ticket bound to the prerequisite coordinator."
        required: true
        type: string
      release_lifecycle:
        description: "Strict post-rotation release or exact authenticated initial-overlap activation."
        required: false
        type: choice
        options:
          - strict
          - authenticated-initial-overlap
        default: strict
      normal_image_authorization_json:
        description: "Exact canonical signed four-image authorization produced by production-image-authorization.mjs. Transport only; Release Gate authenticates it."
        required: true
        type: string
      normal_image_authorization_sha256:
        description: "SHA-256 of the exact normal image authorization JSON bytes."
        required: true
        type: string
      historical_runtime_evidence_json:
        description: "Compact authenticated Stage B historical-runtime retention evidence; never a launch receipt."
        required: false
        type: string
      historical_runtime_evidence_sha256:
        description: "SHA-256 of the exact historical runtime evidence transport bytes."
        required: false
        type: string
      web_image_authorization_json:
        description: "Exact signed web-image authorization; required only when canonical impact requires web publication."
        required: false
        type: string
      rotation_id:
        description: "Exact authenticated-overlap rotation ID."
        required: false
        type: string
      rotation_state_json:
        description: "Exact redacted authenticated-overlap coordinator state."
        required: false
        type: string
      rotation_state_sha256:
        description: "SHA-256 of the exact redacted authenticated-overlap coordinator state bytes."
        required: false
        type: string
      rotation_task_definition_arn:
        description: "Exact authenticated-overlap backend task definition ARN."
        required: false
        type: string
      rotation_image_digest:
        description: "Exact authenticated-overlap backend image digest."
        required: false
        type: string
      rotation_deployment_sha:
        description: "Exact authenticated-overlap deployment SHA."
        required: false
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: release-train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Resolve source and required gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      gate_run_ids_json: ${{ steps.gate_runs.outputs.gate_run_ids_json }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve target SHA
        id: resolve
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          target_ref="${INPUT_GIT_REF:-main}"
          git fetch --prune origin main
          case "$target_ref" in
            main)
              dispatch_ref=main
              ref_sha="$(git rev-parse origin/main^{commit})"
              ;;
            refs/tags/*)
              if ! [[ "$target_ref" =~ ^refs/tags/(release-|v)[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
                echo "::error::Release Train tag ref must use the release-* or v* evidence-enforced namespace."
                exit 1
              fi
              git fetch --no-tags origin "$target_ref:$target_ref"
              dispatch_ref="$target_ref"
              ref_sha="$(git rev-parse "$target_ref^{commit}")"
              ;;
            *)
              echo "::error::Release Train git_ref must be main or an explicit refs/tags/<name> ref."
              exit 1
              ;;
          esac

          if [ -n "${INPUT_TARGET_SHA:-}" ]; then
            if ! [[ "$INPUT_TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Release Train target_sha must be a full lowercase commit SHA."
              exit 1
            fi
            target_sha="$(git rev-parse "${INPUT_TARGET_SHA}^{commit}")"
          else
            target_sha="$ref_sha"
          fi

          if [ "$target_sha" != "$ref_sha" ]; then
            echo "::error::Release Train dispatch ref must resolve exactly to target_sha; use main only for its current head or an exact refs/tags/<name> ref for an older supported target."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$target_sha" origin/main; then
            echo "::error::Release Train target must be a commit on main."
            exit 1
          fi

          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "dispatch_ref=$dispatch_ref" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Release Train target ref: $target_ref"
          echo "Release Train target SHA: $target_sha"

      - name: Trigger required workflow gates
        id: gate_runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          DISPATCH_REF: ${{ steps.resolve.outputs.dispatch_ref }}
          RELEASE_LIFECYCLE: ${{ inputs.release_lifecycle }}
          NORMAL_IMAGE_AUTHORIZATION_JSON: ${{ inputs.normal_image_authorization_json }}
          NORMAL_IMAGE_AUTHORIZATION_SHA256: ${{ inputs.normal_image_authorization_sha256 }}
          HISTORICAL_RUNTIME_EVIDENCE_JSON: ${{ inputs.historical_runtime_evidence_json }}
          HISTORICAL_RUNTIME_EVIDENCE_SHA256: ${{ inputs.historical_runtime_evidence_sha256 }}
          WEB_IMAGE_AUTHORIZATION_JSON: ${{ inputs.web_image_authorization_json }}
          ROTATION_ID: ${{ inputs.rotation_id }}
          ROTATION_STATE_JSON: ${{ inputs.rotation_state_json }}
          ROTATION_STATE_SHA256: ${{ inputs.rotation_state_sha256 }}
          ROTATION_TASK_DEFINITION_ARN: ${{ inputs.rotation_task_definition_arn }}
          ROTATION_IMAGE_DIGEST: ${{ inputs.rotation_image_digest }}
          ROTATION_DEPLOYMENT_SHA: ${{ inputs.rotation_deployment_sha }}
        run: |
          set -euo pipefail

          case "$RELEASE_LIFECYCLE" in
            strict)
              ;;
            authenticated-initial-overlap)
              for name in ROTATION_ID ROTATION_STATE_JSON ROTATION_STATE_SHA256 ROTATION_TASK_DEFINITION_ARN ROTATION_IMAGE_DIGEST ROTATION_DEPLOYMENT_SHA; do
                test -n "${!name:-}" || { echo "::error::${name} is required for authenticated initial overlap."; exit 1; }
              done
              state_file="$RUNNER_TEMP/authenticated-initial-overlap-state.json"
              authorization_file="$RUNNER_TEMP/authenticated-initial-overlap-image-authorization.json"
              trap 'rm -f "$state_file" "$authorization_file"' EXIT
              printf '%s' "$ROTATION_STATE_JSON" > "$state_file"
              chmod 600 "$state_file"
              node scripts/aws/manage-production-initial-activation-lifecycle.mjs \
                --mode validate-candidate --state-file "$state_file" --state-sha256 "$ROTATION_STATE_SHA256" \
                --source-sha "$TARGET_SHA" --rotation-id "$ROTATION_ID" --deployment-sha "$ROTATION_DEPLOYMENT_SHA" \
                --task-definition "$ROTATION_TASK_DEFINITION_ARN" --image-digest "$ROTATION_IMAGE_DIGEST"
              printf '%s' "$NORMAL_IMAGE_AUTHORIZATION_JSON" > "$authorization_file"
              chmod 600 "$authorization_file"
              node scripts/aws/production-release-dispatch-contract.mjs \
                --source-sha "$TARGET_SHA" --authorization "$authorization_file" --authorization-sha256 "$NORMAL_IMAGE_AUTHORIZATION_SHA256"
              rm -f "$state_file" "$authorization_file"
              trap - EXIT
              # A historical tag may not contain the lifecycle-aware input schema.
              # Refuse it before GitHub can receive an incompatible dispatch payload.
              node scripts/github/assert-authenticated-initial-overlap-workflow-schema.mjs --revision "$TARGET_SHA"
              ;;
            *)
              echo "::error::Unsupported release lifecycle: $RELEASE_LIFECYCLE"
              exit 1
              ;;
          esac

          mapfile -t required_workflows < <(node scripts/github/release-lifecycle-contract.mjs --lifecycle "$RELEASE_LIFECYCLE" lines)
          gate_pairs="$RUNNER_TEMP/release-train-gate-runs.tsv"
          trap 'rm -f "$gate_pairs"' EXIT
          : > "$gate_pairs"
          chmod 600 "$gate_pairs"

          for workflow_file in "${required_workflows[@]}"; do
            echo "Triggering ${workflow_file} for ${TARGET_SHA}"
            inputs_file="$RUNNER_TEMP/${workflow_file}.inputs.json"
            trap 'rm -f "$inputs_file"' EXIT
            if WORKFLOW_FILE="$workflow_file" node --input-type=module -e 'import { usesLifecycleInputs } from "./scripts/github/release-lifecycle-contract.mjs"; process.exit(usesLifecycleInputs(process.env.RELEASE_LIFECYCLE, process.env.WORKFLOW_FILE) ? 0 : 1)' ; then
              node --input-type=module -e 'import fs from "node:fs"; const keys=["release_lifecycle","target_sha","rotation_id","rotation_state_json","rotation_state_sha256","rotation_task_definition_arn","rotation_image_digest","rotation_deployment_sha"]; const values=Object.fromEntries(keys.map((key)=>[key,process.env[key.toUpperCase()]]).filter(([,value])=>value)); fs.writeFileSync(process.argv[1],JSON.stringify(values),{mode:0o600});' "$inputs_file"
            else
              printf '{}' > "$inputs_file"
              chmod 600 "$inputs_file"
            fi
            dispatch_output="$(node scripts/github/dispatch-source-bound-workflow.mjs \
              --workflow "$workflow_file" --ref "$DISPATCH_REF" --target-sha "$TARGET_SHA" --inputs-file "$inputs_file"
            )"
            printf '%s\n' "$dispatch_output"
            run_id="$(printf '%s\n' "$dispatch_output" | sed -n 's/^SOURCE_BOUND_WORKFLOW_RUN_ID=//p')"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::${workflow_file} did not return one exact workflow run ID."; exit 1; }
            printf '%s\t%s\n' "$workflow_file" "$run_id" >> "$gate_pairs"
            rm -f "$inputs_file"
            trap - EXIT
          done

          gate_runs_file="$RUNNER_TEMP/release-train-gate-runs.json"
          node --input-type=module - "$gate_pairs" "$gate_runs_file" <<'NODE'
          import fs from "node:fs";
          const pairs = fs.readFileSync(process.argv[2], "utf8").trim().split("\n").filter(Boolean).map((line) => line.split("\t"));
          const value = Object.fromEntries(pairs);
          if (pairs.length !== Object.keys(value).length || Object.values(value).some((id) => !/^[1-9][0-9]*$/.test(id))) throw new Error("Release Train gate run identity map is invalid.");
          fs.writeFileSync(process.argv[3], JSON.stringify(value), { mode: 0o600 });
          NODE
          echo "REQUIRED_GATE_RUN_IDS_JSON=$(cat "$gate_runs_file")" >> "$GITHUB_ENV"
          echo "gate_run_ids_json=$(cat "$gate_runs_file")" >> "$GITHUB_OUTPUT"
          rm -f "$gate_pairs" "$gate_runs_file"
          trap - EXIT

      - name: Wait for required workflow gates
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          TARGET_EVENTS: push,workflow_dispatch
          RELEASE_LIFECYCLE: ${{ inputs.release_lifecycle }}
          MAX_ATTEMPTS: 90
          POLL_SECONDS: 30
        run: |
          export REQUIRED_WORKFLOW_FILES="$(node scripts/github/release-lifecycle-contract.mjs --lifecycle "$RELEASE_LIFECYCLE")"
          node scripts/github/check-required-workflow-gates.mjs

  orchestrate:
    name: Converge governed prerequisites and trigger Release Gate
    needs: gates
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.gates.outputs.target_sha }}
      RELEASE_TICKET_ID: ${{ inputs.ticket_id }}
      RELEASE_LIFECYCLE: ${{ inputs.release_lifecycle }}
      NORMAL_IMAGE_AUTHORIZATION_JSON: ${{ inputs.normal_image_authorization_json }}
      NORMAL_IMAGE_AUTHORIZATION_SHA256: ${{ inputs.normal_image_authorization_sha256 }}
      REQUIRED_GATE_RUN_IDS_JSON: ${{ needs.gates.outputs.gate_run_ids_json }}
      TF_WORKSPACE: default
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v6
        with: {ref: '${{ needs.gates.outputs.target_sha }}', fetch-depth: 0}
      - name: Authenticate unchanged protected source
        env:
          TARGET_SHA: ${{ needs.gates.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [ "${{ needs.gates.outputs.target_ref }}" = main ]; then
            test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          else
            git merge-base --is-ancestor "$TARGET_SHA" origin/main
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: npm}

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.15.8, terraform_wrapper: false}

      - name: Converge exact Stage B prerequisites
        uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_1
        if: needs.gates.outputs.target_ref == 'main'
      - uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_2
        if: needs.gates.outputs.target_ref == 'main' && steps.converge_1.outputs.status != 'PREREQUISITES_CONVERGED'
      - uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_3
        if: needs.gates.outputs.target_ref == 'main' && steps.converge_2.outputs.status == 'WAITING_FOR_APPROVAL'
      - uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_4
        if: needs.gates.outputs.target_ref == 'main' && steps.converge_3.outputs.status == 'WAITING_FOR_APPROVAL'
      - uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_5
        if: needs.gates.outputs.target_ref == 'main' && steps.converge_4.outputs.status == 'WAITING_FOR_APPROVAL'
      - uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_6
        if: needs.gates.outputs.target_ref == 'main' && steps.converge_5.outputs.status == 'WAITING_FOR_APPROVAL'
      - uses: ./.github/actions/converge-stage-b-prerequisites
        id: converge_7
        if: needs.gates.outputs.target_ref == 'main' && steps.converge_6.outputs.status == 'WAITING_FOR_APPROVAL'
      - name: Require authenticated prerequisite closure
        if: needs.gates.outputs.target_ref == 'main'
        env:
          STATUS_1: ${{ steps.converge_1.outputs.status }}
          STATUS_2: ${{ steps.converge_2.outputs.status }}
          STATUS_3: ${{ steps.converge_3.outputs.status }}
          STATUS_4: ${{ steps.converge_4.outputs.status }}
          STATUS_5: ${{ steps.converge_5.outputs.status }}
          STATUS_6: ${{ steps.converge_6.outputs.status }}
          STATUS_7: ${{ steps.converge_7.outputs.status }}
        run: |
          if ! printf '%s\n' "$STATUS_1" "$STATUS_2" "$STATUS_3" "$STATUS_4" "$STATUS_5" "$STATUS_6" "$STATUS_7" | grep -qx PREREQUISITES_CONVERGED; then
            echo '::error::Governed prerequisite approval did not complete within this Release Train run; rerun failed jobs to resume the durable release.'
            exit 1
          fi

      - name: Trigger final Release Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ needs.gates.outputs.target_ref }}
          TARGET_SHA: ${{ needs.gates.outputs.target_sha }}
          REQUIRED_GATE_RUN_IDS_JSON: ${{ needs.gates.outputs.gate_run_ids_json }}
          NORMAL_IMAGE_AUTHORIZATION_JSON: ${{ inputs.normal_image_authorization_json }}
          NORMAL_IMAGE_AUTHORIZATION_SHA256: ${{ inputs.normal_image_authorization_sha256 }}
          HISTORICAL_RUNTIME_EVIDENCE_JSON: ${{ inputs.historical_runtime_evidence_json }}
          HISTORICAL_RUNTIME_EVIDENCE_SHA256: ${{ inputs.historical_runtime_evidence_sha256 }}
          WEB_IMAGE_AUTHORIZATION_JSON: ${{ inputs.web_image_authorization_json }}
          RELEASE_LIFECYCLE: ${{ inputs.release_lifecycle }}
          ROTATION_ID: ${{ inputs.rotation_id }}
          ROTATION_STATE_JSON: ${{ inputs.rotation_state_json }}
          ROTATION_STATE_SHA256: ${{ inputs.rotation_state_sha256 }}
          ROTATION_TASK_DEFINITION_ARN: ${{ inputs.rotation_task_definition_arn }}
          ROTATION_IMAGE_DIGEST: ${{ inputs.rotation_image_digest }}
          ROTATION_DEPLOYMENT_SHA: ${{ inputs.rotation_deployment_sha }}
        run: |
          set -euo pipefail

          authorization_file="$RUNNER_TEMP/normal-image-authorization.json"
          web_authorization_file="$RUNNER_TEMP/web-image-authorization.json"
          trap 'rm -f "$authorization_file" "$web_authorization_file"' EXIT
          printf '%s' "$NORMAL_IMAGE_AUTHORIZATION_JSON" > "$authorization_file"
          chmod 600 "$authorization_file"
          dispatch_args=(
            --source-sha "$TARGET_SHA" \
            --authorization "$authorization_file" \
            --authorization-sha256 "$NORMAL_IMAGE_AUTHORIZATION_SHA256"
          )
          if [ -n "${WEB_IMAGE_AUTHORIZATION_JSON:-}" ]; then
            printf '%s' "$WEB_IMAGE_AUTHORIZATION_JSON" > "$web_authorization_file"
            chmod 600 "$web_authorization_file"
            dispatch_args+=(--web-authorization "$web_authorization_file")
          fi
          if [ -n "${HISTORICAL_RUNTIME_EVIDENCE_JSON:-}${HISTORICAL_RUNTIME_EVIDENCE_SHA256:-}" ]; then
            historical_file="$RUNNER_TEMP/historical-runtime-evidence.json"
            printf '%s' "$HISTORICAL_RUNTIME_EVIDENCE_JSON" > "$historical_file"
            chmod 600 "$historical_file"
            dispatch_args+=(--historical-runtime-evidence "$historical_file" --historical-runtime-evidence-sha256 "$HISTORICAL_RUNTIME_EVIDENCE_SHA256")
          fi
          node scripts/aws/production-release-dispatch-contract.mjs "${dispatch_args[@]}"
          rm -f "$authorization_file" "$web_authorization_file"
          trap - EXIT

          echo "All required gates passed for ${TARGET_SHA}."
          echo "Triggering release-gate.yml for exact target SHA ${TARGET_SHA}."
          inputs_file="$RUNNER_TEMP/release-gate.inputs.json"
          trap 'rm -f "$inputs_file"' EXIT
          node --input-type=module - "$inputs_file" <<'NODE'
          import fs from "node:fs";
          import { packReleaseEvidenceTransport } from "./scripts/aws/production-release-dispatch-contract.mjs";
          const transport = packReleaseEvidenceTransport({ authorizationJson: process.env.NORMAL_IMAGE_AUTHORIZATION_JSON, authorizationSha256: process.env.NORMAL_IMAGE_AUTHORIZATION_SHA256, historicalRuntimeJson: process.env.HISTORICAL_RUNTIME_EVIDENCE_JSON, historicalRuntimeSha256: process.env.HISTORICAL_RUNTIME_EVIDENCE_SHA256 });
          const values = Object.fromEntries([
            ["git_ref", process.env.TARGET_REF], ["target_sha", process.env.TARGET_SHA], ["release_train_run_id", process.env.GITHUB_RUN_ID],
            ["release_lifecycle", process.env.RELEASE_LIFECYCLE], ["required_gate_run_ids_json", process.env.REQUIRED_GATE_RUN_IDS_JSON],
            ["normal_image_authorization_json", transport.json],
            ["normal_image_authorization_sha256", transport.sha256],
            ["web_image_authorization_json", process.env.WEB_IMAGE_AUTHORIZATION_JSON],
            ["rotation_id", process.env.ROTATION_ID], ["rotation_state_json", process.env.ROTATION_STATE_JSON],
            ["rotation_state_sha256", process.env.ROTATION_STATE_SHA256], ["rotation_task_definition_arn", process.env.ROTATION_TASK_DEFINITION_ARN],
            ["rotation_image_digest", process.env.ROTATION_IMAGE_DIGEST], ["rotation_deployment_sha", process.env.ROTATION_DEPLOYMENT_SHA],
          ].filter(([, value]) => value !== undefined && value !== ""));
          fs.writeFileSync(process.argv[2], JSON.stringify(values), { mode: 0o600 });
          NODE
          node scripts/github/dispatch-protected-main-release-gate.mjs \
            --target-ref "$TARGET_REF" --target-sha "$TARGET_SHA" --inputs-file "$inputs_file"
          rm -f "$inputs_file"
          trap - EXIT

          echo "Final action: release-gate.yml dispatched for ${TARGET_SHA}. Release Train does not deploy directly."
