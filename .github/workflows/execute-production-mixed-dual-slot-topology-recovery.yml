name: Execute production mixed dual-slot topology recovery

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Exact protected-main source SHA, required: true, type: string }
      preparation_base64: { description: Exact authorized private preparation bytes, required: true, type: string }
      preparation_file_sha256: { description: Exact authorized private preparation file SHA256, required: true, type: string }
      authorization_run_id: { description: Protected authorization workflow run ID, required: true, type: string }
      authorization_run_attempt: { description: Protected authorization workflow run attempt, required: true, type: string }

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-mixed-dual-slot-topology-recovery
  cancel-in-progress: false

jobs:
  execute:
    name: Execute or resume exact seven-slot recovery
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate protected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$GITHUB_WORKFLOW_REF" = "T-ej2003/genuine-scan-main/.github/workflows/execute-production-mixed-dual-slot-topology-recovery.yml@refs/heads/main"
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          install -d -m 700 "$RUNNER_TEMP/mixed-recovery"
          git ls-files -z > "$RUNNER_TEMP/mixed-recovery/source-files.zlist"
          while IFS= read -r -d '' file; do sha256sum -- "$file"; done < "$RUNNER_TEMP/mixed-recovery/source-files.zlist" > "$RUNNER_TEMP/mixed-recovery/source-before.sha256"
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Re-authenticate source after dependencies
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          while IFS= read -r -d '' file; do sha256sum -- "$file"; done < "$RUNNER_TEMP/mixed-recovery/source-files.zlist" > "$RUNNER_TEMP/mixed-recovery/source-after.sha256"
          cmp --silent "$RUNNER_TEMP/mixed-recovery/source-before.sha256" "$RUNNER_TEMP/mixed-recovery/source-after.sha256"
      - name: Reconstruct exact preparation
        env:
          PREPARATION_BASE64: ${{ inputs.preparation_base64 }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/mixed-recovery"
          printf '%s' "$PREPARATION_BASE64" | base64 --decode > "$workdir/preparation.json"
          test "$(sha256sum "$workdir/preparation.json" | awk '{print $1}')" = "$PREPARATION_FILE_SHA256"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-release-deployer
          aws-region: eu-west-2
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["sts:GetCallerIdentity","ecs:DescribeServices","ecs:DescribeTaskDefinition"],"Resource":"*"},{"Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:GetSecretValue","secretsmanager:UpdateSecretVersionStage"],"Resource":["arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/jwt-pending-1CnWMp","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-private-pending-LZhc54","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-public-pending-uB3P1Q","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/jwt-previous-6rQrqj","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-public-previous-rLZwcX","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-current-version-8fNOVE","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-previous-version-PDFul2"]}]}
      - name: Execute authenticated exact-prefix recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
          AUTHORIZATION_RUN_ATTEMPT: ${{ inputs.authorization_run_attempt }}
        run: |
          set -euo pipefail
          node scripts/aws/run-production-mixed-dual-slot-topology-recovery.mjs --execute \
            --source-sha "$SOURCE_SHA" --preparation "$RUNNER_TEMP/mixed-recovery/preparation.json" \
            --preparation-file-sha256 "$PREPARATION_FILE_SHA256" \
            --authorization-run-id "$AUTHORIZATION_RUN_ID" --authorization-run-attempt "$AUTHORIZATION_RUN_ATTEMPT"
