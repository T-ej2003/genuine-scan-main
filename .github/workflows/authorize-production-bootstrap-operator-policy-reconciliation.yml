name: Authorize production bootstrap-operator policy reconciliation

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Protected main source SHA, required: true, type: string }
      preparation_json_base64: { description: Exact bootstrap-operator preparation, required: true, type: string }
      preparation_file_sha256: { description: Exact preparation file SHA256, required: true, type: string }

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    environment: production-bootstrap-operator-policy-authorization
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate exact protected source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Decode exact preparation
        env:
          PREPARATION_JSON_BASE64: ${{ inputs.preparation_json_base64 }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/bootstrap-operator-policy"
          printf '%s' "$PREPARATION_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/bootstrap-operator-policy/preparation.json"
          chmod 600 "$RUNNER_TEMP/bootstrap-operator-policy/preparation.json"
          test "$(sha256sum "$RUNNER_TEMP/bootstrap-operator-policy/preparation.json" | awk '{print $1}')" = "$PREPARATION_FILE_SHA256"
      - name: Authenticate independent protected-environment approval
        id: approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$RUNNER_TEMP/bootstrap-operator-policy/environment-approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production-bootstrap-operator-policy-authorization --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-actor "$GITHUB_ACTOR" --require-actual-approval
          echo "sha256=$(sha256sum "$RUNNER_TEMP/bootstrap-operator-policy/environment-approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Configure exact read-only authorization credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-bootstrap-operator-policy-authorizer
          aws-region: eu-west-2
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"sts:GetCallerIdentity","Resource":"*"},{"Effect":"Allow","Action":"iam:ListUserTags","Resource":"arn:aws:iam::368992683803:user/mscqr-production-bootstrap-operator"},{"Effect":"Allow","Action":["secretsmanager:DescribeSecret","secretsmanager:GetSecretValue"],"Resource":["arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/jwt-pending-1CnWMp","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-private-pending-LZhc54","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-public-pending-uB3P1Q","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/jwt-previous-6rQrqj","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-public-previous-rLZwcX","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-current-version-8fNOVE","arn:aws:secretsmanager:eu-west-2:368992683803:secret:mscqr/prod/rotation/qr-previous-version-PDFul2"]}]}
      - name: Produce exact authorization
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
        run: |
          set -euo pipefail
          node scripts/aws/production-bootstrap-operator-policy-reconciliation.mjs --authorize \
            --source-sha "$SOURCE_SHA" \
            --preparation "$RUNNER_TEMP/bootstrap-operator-policy/preparation.json" --preparation-file-sha256 "$PREPARATION_FILE_SHA256" \
            --environment-approval "$RUNNER_TEMP/bootstrap-operator-policy/environment-approval.json" --environment-approval-file-sha256 "$APPROVAL_SHA256" \
            --output "$RUNNER_TEMP/bootstrap-operator-policy/authorization.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-bootstrap-operator-policy-reconciliation-authorization
          path: ${{ runner.temp }}/bootstrap-operator-policy/authorization.json
          if-no-files-found: error
          retention-days: 30
