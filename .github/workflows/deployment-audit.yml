name: Deployment Audit

on:
  workflow_dispatch:
    inputs:
      release_lifecycle:
        description: "Strict release validation or exact authenticated initial-overlap validation."
        required: false
        type: choice
        options:
          - strict
          - authenticated-initial-overlap
        default: strict
      target_sha:
        description: "Exact protected source SHA for authenticated initial overlap."
        required: false
        type: string
      rotation_id:
        description: "Exact authenticated-overlap rotation ID."
        required: false
        type: string
      rotation_state_json:
        description: "Exact redacted authenticated-overlap coordinator state."
        required: false
        type: string
      rotation_state_sha256:
        description: "SHA-256 of the exact rotation state bytes."
        required: false
        type: string
      rotation_task_definition_arn:
        description: "Exact authenticated-overlap backend task definition ARN."
        required: false
        type: string
      rotation_image_digest:
        description: "Exact authenticated-overlap backend image digest."
        required: false
        type: string
      rotation_deployment_sha:
        description: "Exact authenticated-overlap deployment SHA."
        required: false
        type: string
  push:
    branches:
      - main
    # Documentation-only changes are ignored here so they do not wake the
    # production deploy chain through the Release Gate workflow_run trigger.
    paths-ignore:
      - 'documents/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.docx'
  pull_request:

concurrency:
  group: deployment-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run full release validation
        env:
          REQUIRE_RELEASE_EVIDENCE_REFS: ${{ github.ref == 'refs/heads/main' }}
          PROVENANCE_BACKFILL_EVIDENCE_REF: ${{ vars.RC_PROVENANCE_BACKFILL_EVIDENCE_REF }}
          SECRET_ROTATION_EVIDENCE_REF: ${{ vars.RC_SECRET_ROTATION_EVIDENCE_REF }}
          INCIDENT_DRILL_EVIDENCE_REF: ${{ vars.RC_INCIDENT_DRILL_EVIDENCE_REF }}
          RELEASE_LIFECYCLE: ${{ inputs.release_lifecycle || 'strict' }}
          TARGET_SHA: ${{ inputs.target_sha }}
          ROTATION_ID: ${{ inputs.rotation_id }}
          ROTATION_STATE_JSON: ${{ inputs.rotation_state_json }}
          ROTATION_STATE_SHA256: ${{ inputs.rotation_state_sha256 }}
          ROTATION_TASK_DEFINITION_ARN: ${{ inputs.rotation_task_definition_arn }}
          ROTATION_IMAGE_DIGEST: ${{ inputs.rotation_image_digest }}
          ROTATION_DEPLOYMENT_SHA: ${{ inputs.rotation_deployment_sha }}
        run: |
          set -euo pipefail
          # Main pushes are source validation until a governed production
          # release explicitly invokes the strict gate.
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then npm run verify:release:source; exit 0; fi
          case "$RELEASE_LIFECYCLE" in
            strict)
              npm run verify:release
              ;;
            authenticated-initial-overlap)
              for name in TARGET_SHA ROTATION_ID ROTATION_STATE_JSON ROTATION_STATE_SHA256 ROTATION_TASK_DEFINITION_ARN ROTATION_IMAGE_DIGEST ROTATION_DEPLOYMENT_SHA; do
                test -n "${!name:-}" || { echo "::error::${name} is required for authenticated initial overlap."; exit 1; }
              done
              test "$TARGET_SHA" = "$GITHUB_SHA"
              state_file="$RUNNER_TEMP/authenticated-initial-overlap-state.json"
              trap 'rm -f "$state_file"' EXIT
              printf '%s' "$ROTATION_STATE_JSON" > "$state_file"
              chmod 600 "$state_file"
              node scripts/aws/manage-production-initial-activation-lifecycle.mjs \
                --mode validate-candidate --state-file "$state_file" --state-sha256 "$ROTATION_STATE_SHA256" \
                --source-sha "$TARGET_SHA" --rotation-id "$ROTATION_ID" --deployment-sha "$ROTATION_DEPLOYMENT_SHA" \
                --task-definition "$ROTATION_TASK_DEFINITION_ARN" --image-digest "$ROTATION_IMAGE_DIGEST"
              npm run verify:release:pre-rotation
              ;;
            *) echo "::error::Unsupported release lifecycle: $RELEASE_LIFECYCLE"; exit 1 ;;
          esac

  audit:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare artifacts
        run: mkdir -p audit-artifacts

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none

      - name: Analyze with CodeQL
        id: codeql-analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: audit-artifacts/codeql
          # Private repositories owned by personal accounts cannot enable GitHub
          # Code Security, but CodeQL analysis and local SARIF remain useful.
          upload: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' && 'never' || 'always' }}

      - name: Summarize unavailable CodeQL upload
        if: ${{ always() && steps.codeql-analyze.outcome == 'success' && github.event.repository.private && github.event.repository.owner.type == 'User' }}
        run: |
          {
            echo '### CodeQL SARIF upload'
            echo
            echo 'CodeQL analysis completed and its SARIF is included in the deployment audit artifact.'
            echo 'GitHub SARIF upload was skipped because code scanning is unavailable for this private personal-account repository.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install OSV Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner

      - name: Run OSV Scanner
        # Keep vulnerability coverage on committed manifests/lockfiles while
        # avoiding transient deps.dev resolver outages from failing audits with
        # no vulnerabilities found.
        run: ./osv-scanner --recursive --no-resolve .

      - name: Pull Gitleaks
        run: docker pull ghcr.io/gitleaks/gitleaks:v8.24.2

      - name: Gitleaks secrets scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            detect \
              --source /repo \
              --redact \
              --baseline-path /repo/.gitleaks-baseline.json \
              --report-format sarif \
              --report-path /repo/audit-artifacts/gitleaks.sarif

      - name: Detect IaC files
        id: iac-detect
        run: |
          if find . \( -name '*.tf' -o -name '*.tf.json' -o -name '*.tfvars' -o -name 'docker-compose.yml' -o -path '*/k8s/*.yml' -o -path '*/k8s/*.yaml' -o -path '*/helm/Chart.yaml' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy IaC scan
        if: steps.iac-detect.outputs.found == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: audit-artifacts/iac-trivy.sarif

      - name: Detect Dockerfile
        id: docker-detect
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=." >> "$GITHUB_OUTPUT"
          elif [ -f backend/Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dockerfile=backend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=backend" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build container for scan
        if: steps.docker-detect.outputs.found == 'true'
        run: docker build -t deployment-audit:latest -f "${{ steps.docker-detect.outputs.dockerfile }}" "${{ steps.docker-detect.outputs.context }}"

      - name: Trivy container scan
        if: steps.docker-detect.outputs.found == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: deployment-audit:latest
          format: sarif
          output: audit-artifacts/container-trivy.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: audit-artifacts/sbom.spdx.json

      - name: Attest SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: audit-artifacts/sbom.spdx.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-audit-artifacts
          path: audit-artifacts
          if-no-files-found: warn
