name: Authorize production initial-activation reconciler installation

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Protected main source SHA, required: true, type: string }
      preparation_artifact_base64: { description: Exact preparation artifact bytes, required: true, type: string }
      preparation_artifact_sha256: { description: SHA256 of the preparation artifact, required: true, type: string }

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  authorize-installation:
    name: Authorize exact initial-activation reconciler installation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate protected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: T-ej2003/genuine-scan-main
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$SOURCE_SHA" = "$(gh api "repos/$EXPECTED_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked authorization dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Re-authenticate protected source after dependency installation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Capture production environment approval
        id: environment-approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/initial-activation-installation"
          install -d -m 700 "$workdir"
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$workdir/environment-approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production \
            --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" \
            --require-actual-approval
          echo "sha256=$(sha256sum "$workdir/environment-approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Produce exact installation authorization
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARATION_SHA256: ${{ inputs.preparation_artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workdir="$RUNNER_TEMP/initial-activation-installation"
          printf '%s' '${{ inputs.preparation_artifact_base64 }}' | base64 --decode > "$workdir/preparation.json"
          test "$(sha256sum "$workdir/preparation.json" | awk '{print $1}')" = "$PREPARATION_SHA256"
          node scripts/aws/authorize-production-initial-activation-reconciler-installation.mjs --authorize \
            --source-sha "$SOURCE_SHA" --preparation "$workdir/preparation.json" \
            --preparation-file-sha256 "$PREPARATION_SHA256" \
            --environment-approval "$workdir/environment-approval.json" \
            --environment-approval-sha256 "${{ steps.environment-approval.outputs.sha256 }}" \
            --output "$workdir/authorization.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-initial-activation-policy-reconciler-installation-authorization
          path: ${{ runner.temp }}/initial-activation-installation/authorization.json
          if-no-files-found: error
          retention-days: 90
