name: Normal Production Deployment

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: Deploy the one-time reviewed runtime baseline from the exact historical images
        required: false
        type: boolean
      b01_prerequisite_receipt_base64:
        description: Canonical B01 prerequisite receipt for the exact protected-main bridge source
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: T-ej2003/genuine-scan-main/.github/workflows/production-normal-deployment-operation.yml@05501eedcf0e38ef0108326eefd7b3230f067ff8
    with:
      baseline: ${{ inputs.baseline || false }}
      b01_prerequisite_receipt_base64: ${{ inputs.b01_prerequisite_receipt_base64 || '' }}
    secrets: inherit
