name: Production Deployment Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA from protected main
        required: true
        type: string

permissions:
  contents: read

# Shares the existing production-deploy lock with the canonical release gate.
# Phase 1 has no mutation job; cancel-in-progress remains false for the future
# single-writer production path.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  read-only-readiness:
    name: Read-only production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require protected-main workflow invocation
        env:
          EXPECTED_REF: refs/heads/main
        run: test "$GITHUB_REF" = "$EXPECTED_REF"

      - name: Checkout trusted protected-main bootstrap
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Authorize requested source before checkout or code execution
        id: authorize-source
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$REQUESTED_SOURCE_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::source_sha must be a full lowercase 40-character SHA."
            exit 1
          fi
          git fetch --no-tags --prune origin main
          trusted_main_sha="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "${REQUESTED_SOURCE_SHA}^{commit}"
          if [ "$REQUESTED_SOURCE_SHA" != "$trusted_main_sha" ]; then
            echo "::error::Requested source is not the current protected origin/main commit."
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "::error::Trusted bootstrap checkout is dirty."
            exit 1
          fi
          printf 'verified_sha=%s\n' "$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'trusted_main_sha=%s\n' "$trusted_main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact authorized source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authorize-source.outputs.verified_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Terraform validation binary
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix backend ci

      - name: Run canonical read-only readiness orchestrator
        env:
          MSCQR_DEPLOYMENT_MODE: read-only
          MSCQR_TRUSTED_MAIN_SHA: ${{ steps.authorize-source.outputs.trusted_main_sha }}
          ENFORCE_LINT_CHANGED: "true"
          LINT_CHANGED_BASE_REF: HEAD^
          READINESS_OUTPUT: ${{ runner.temp }}/mscqr-production-readiness/readiness.json
        run: |
          set -euo pipefail
          node scripts/ci/production-readiness-orchestrator.mjs \
            --mode read-only \
            --source-sha "${{ inputs.source_sha }}" \
            --output "$READINESS_OUTPUT"

      - name: Upload bounded readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mscqr-production-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/mscqr-production-readiness/readiness.json
          if-no-files-found: error
          retention-days: 30
