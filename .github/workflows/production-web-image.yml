name: Production Web Image

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged protected-main SHA to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production-web-image-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      AWS_ACCOUNT_ID: "368992683803"
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: mscqr-web
      IMAGE_TAG: ${{ inputs.release_sha }}
      WORKFLOW_DEFINITION_SHA: ${{ github.sha }}
      PLATFORM: linux/amd64
    steps:
      - name: Require the sole authorized operator
        run: test "${{ github.actor }}" = T-ej2003
      - name: Require protected-main workflow definition
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Bind protected workflow and release source
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$WORKFLOW_DEFINITION_SHA"
          protected_main_sha="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "$IMAGE_TAG^{commit}"
          git merge-base --is-ancestor "$IMAGE_TAG" "$protected_main_sha"
          git merge-base --is-ancestor "$WORKFLOW_DEFINITION_SHA" "$protected_main_sha"
          test -z "$(git status --porcelain)"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ vars.PRODUCTION_WEB_IMAGE_PUBLISH_ROLE }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Authenticate immutable repository
        run: |
          set -euo pipefail
          repository="$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --output json)"
          node -e 'const r=JSON.parse(process.argv[1]).repositories; if(r?.length!==1||r[0].repositoryName!=="mscqr-web"||r[0].registryId!=="368992683803"||r[0].imageTagMutability!=="IMMUTABLE"||r[0].imageTagMutabilityExclusionFilters?.length) throw Error("mscqr-web repository is not the reviewed immutable target")' "$repository"
      - name: Publish exact immutable web image
        id: image
        working-directory: release-source
        run: |
          set -euo pipefail
          image_uri="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          repository_json="$RUNNER_TEMP/web-repository.json"
          image_json="$RUNNER_TEMP/web-image-readback.json"
          labels_json="$RUNNER_TEMP/web-image-labels.json"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --output json >"$repository_json"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --output json >"$image_json" 2>"$RUNNER_TEMP/web-image-readback.error"; then
            image_state=existing
          else
            error="$(<"$RUNNER_TEMP/web-image-readback.error")"
            [[ "$error" == *"(ImageNotFoundException)"* ]] || { echo "Web image tag lookup failed." >&2; exit 1; }
            printf '%s\n' '{"imageDetails":[]}' >"$image_json"
            image_state=absent
          fi
          if [[ "$image_state" == absent ]]; then
            docker buildx build --platform "$PLATFORM" --file Dockerfile.ecs-frontend --build-arg "GIT_SHA=$IMAGE_TAG" --build-arg "RELEASE_GIT_SHA=$IMAGE_TAG" --label "org.opencontainers.image.revision=$IMAGE_TAG" --label "org.opencontainers.image.title=mscqr-frontend" --push --tag "$image_uri" .
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --output json >"$image_json"
          fi
          if [[ "$image_state" == existing ]]; then
            digest="$(node -e 'const image=JSON.parse(require("fs").readFileSync(process.argv[1])).imageDetails?.[0]; if(!image||!/^[a-f0-9]{64}$/.test((image.imageDigest||"").replace(/^sha256:/,""))||image.repositoryName!=="mscqr-web"||String(image.registryId)!=="368992683803"||!Array.isArray(image.imageTags)||!image.imageTags.includes(process.env.IMAGE_TAG)) throw Error("Existing published web image readback is invalid"); process.stdout.write(image.imageDigest)' "$image_json")"
          else
            digest="$(node -e 'const image=JSON.parse(require("fs").readFileSync(process.argv[1])).imageDetails?.[0]; if(!image||!/^[a-f0-9]{64}$/.test((image.imageDigest||"").replace(/^sha256:/,""))||image.repositoryName!=="mscqr-web"||String(image.registryId)!=="368992683803"||!Array.isArray(image.imageTags)||!image.imageTags.includes(process.env.IMAGE_TAG)) throw Error("Published web image readback is invalid"); process.stdout.write(image.imageDigest)' "$image_json")"
          fi
          image_ref="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY@$digest"
          REQUIRED_PLATFORMS="$PLATFORM" "$GITHUB_WORKSPACE/scripts/aws/verify-image-manifest.sh" "$image_ref"
          docker pull "$image_ref" >/dev/null
          docker image inspect "$image_ref" --format '{{json .Config.Labels}}' >"$labels_json"
          node --input-type=module - "$IMAGE_TAG" "$repository_json" "$image_json" "$labels_json" <<'NODE'
          import fs from "node:fs";
          import { pathToFileURL } from "node:url";
          const { resolveWebImagePublication } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/aws/production-web-image-resume.mjs`).href);
          const [sourceSha, repositoryFile, imageFile, labelsFile] = process.argv.slice(2);
          resolveWebImagePublication({ sourceSha, repository: JSON.parse(fs.readFileSync(repositoryFile, "utf8")).repositories?.[0], image: JSON.parse(fs.readFileSync(imageFile, "utf8")).imageDetails?.[0], labels: JSON.parse(fs.readFileSync(labelsFile, "utf8")), platforms: ["linux/amd64"] });
          NODE
          printf '%s\n' "$(node -e 'process.stdout.write(JSON.stringify({service:"frontend",repository:"mscqr-web",image_uri:process.argv[1],image_tag:process.env.IMAGE_TAG,image_digest:process.argv[2],image_ref:process.argv[3],platform:"linux/amd64",dockerfile:"Dockerfile.ecs-frontend",build_context:"."}))' "$image_uri" "$digest" "$image_ref")" > "$RUNNER_TEMP/web-image.pending.json"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: '${{ steps.image.outputs.image_ref }}', severity: CRITICAL, ignore-unfixed: true, exit-code: '1' }
      - name: Sign and attest immutable web image
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_CERT_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/production-web-image.yml@.*$"
          COSIGN_CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker save "$IMAGE_REF" -o "$RUNNER_TEMP/web-image.tar"
          docker run --rm -v "$RUNNER_TEMP:/workspace:ro" anchore/syft:v1.38.0 /workspace/web-image.tar -o spdx-json > "$RUNNER_TEMP/web.spdx.json"
          node -e 'require("fs").writeFileSync(process.argv[1],JSON.stringify({releaseSha:process.env.IMAGE_TAG,workflowDefinitionSha:process.env.WORKFLOW_DEFINITION_SHA,workflowRunId:process.env.GITHUB_RUN_ID,repository:"mscqr-web",platform:"linux/amd64",dockerfile:"Dockerfile.ecs-frontend",buildContext:"."}))' "$RUNNER_TEMP/web.provenance.json"
          scripts/aws/cosign-idempotent-sign-and-attest.sh sign "$IMAGE_REF"
          scripts/aws/cosign-idempotent-sign-and-attest.sh attest "$IMAGE_REF" spdxjson "$RUNNER_TEMP/web.spdx.json"
          scripts/aws/cosign-idempotent-sign-and-attest.sh attest "$IMAGE_REF" https://mscqr.com/attestations/production-web-provenance/v1 "$RUNNER_TEMP/web.provenance.json"
          PROVENANCE_ATTESTATION_TYPE=https://mscqr.com/attestations/production-web-provenance/v1 scripts/aws/verify-release-artifacts.sh "$IMAGE_REF"
          node --input-type=module - "$RUNNER_TEMP/web-image.pending.json" "$RUNNER_TEMP/web-image.jsonl" <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const hash = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          Object.assign(record, { critical_scan: "pass", sbom_sha256: hash(process.env.RUNNER_TEMP + "/web.spdx.json"), provenance_sha256: hash(process.env.RUNNER_TEMP + "/web.provenance.json"), cosign_signature_verified: true, sbom_attestation_verified: true, provenance_attestation_verified: true });
          fs.writeFileSync(process.argv[3], `${JSON.stringify(record)}\n`, { mode: 0o600, flag: "wx" });
          NODE
          rm -f "$RUNNER_TEMP/web-image.pending.json" "$RUNNER_TEMP/web-image.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: production-web-image
          path: |
            ${{ runner.temp }}/web-image.jsonl
            ${{ runner.temp }}/web.spdx.json
            ${{ runner.temp }}/web.provenance.json
          if-no-files-found: error
          retention-days: 90
