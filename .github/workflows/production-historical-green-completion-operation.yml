name: Governed Historical Green Completion Operation

'on':
  workflow_call:
    inputs:
      operation_id:
        description: Original S3 recovery operation ID
        required: true
        type: string
      original_source_sha:
        description: Protected main SHA at the original recovery
        required: true
        type: string
      original_run_id:
        description: Original Release Gate run ID
        required: true
        type: string
      ticket:
        description: Original recovery ticket
        required: true
        type: string
      original_task_definition:
        description: Original backend task definition ARN
        required: true
        type: string
      target_task_definition:
        description: Already deployed backend task definition ARN
        required: true
        type: string
      image_digest:
        description: Authorized backend image digest
        required: true
        type: string
      cloudtrail_event_id:
        description: Successful original UpdateService event ID
        required: true
        type: string
      expected_component_generation:
        description: Original component-state generation
        required: true
        type: string

jobs:
  complete:
    name: Reconcile claimed green recovery without ECS mutation
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-normal-deploy
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      AWS_REGION: eu-west-2
      SOURCE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate current protected main before credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Authenticate caller and reviewed host tooling before credentials
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "T-ej2003/genuine-scan-main/.github/workflows/complete-historical-green-backend-recovery.yml@refs/heads/main"
          test "$(git ls-tree -r HEAD -- .github/actions scripts/aws scripts/lib scripts/security scripts/rls/lib scripts/smoke-release.mjs backend/scripts/security infra/aws/terraform/lambda/production-rls-approval-broker package.json package-lock.json | sha256sum | cut -d' ' -f1)" = '6cc21716e82cb4f9f40c44fcfbf73acc5933cbba0f00f335a2fa2817e9ea0f9e'

      - name: Set up reviewed Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install reviewed dependencies before credentials
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Authenticate fresh independent environment approval
        run: |
          set -euo pipefail
          approval_dir="$RUNNER_TEMP/historical-green-approval"
          install -d -m 700 "$approval_dir"
          node scripts/aws/production-github-environment-approval.mjs \
            --repository "$GITHUB_REPOSITORY" --environment production-normal-deploy \
            --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" \
            --require-actual-approval --output "$approval_dir/approval.json" > /dev/null

      - name: Assume exact normal-deployer role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-normal-deployer
          unset-current-credentials: true

      - name: Complete the original claim and component state
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          ORIGINAL_SOURCE_SHA: ${{ inputs.original_source_sha }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          RECOVERY_TICKET: ${{ inputs.ticket }}
          ORIGINAL_TASK_DEFINITION: ${{ inputs.original_task_definition }}
          TARGET_TASK_DEFINITION: ${{ inputs.target_task_definition }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CLOUDTRAIL_EVENT_ID: ${{ inputs.cloudtrail_event_id }}
          EXPECTED_COMPONENT_GENERATION: ${{ inputs.expected_component_generation }}
        run: |
          set -euo pipefail
          source scripts/aws/production-credential-source.sh
          export MSCQR_AWS_CREDENTIAL_SOURCE=github-oidc-normal-deployer
          configure_production_aws_credential_source
          test "$(aws sts get-caller-identity --query Arn --output text)" = \
            "arn:aws:sts::368992683803:assumed-role/mscqr-production-normal-deployer/GitHubActions"
          receipt_dir="$RUNNER_TEMP/historical-green-receipt"
          install -d -m 700 "$receipt_dir"
          approval="$RUNNER_TEMP/historical-green-approval/approval.json"
          node scripts/aws/complete-production-historical-green-backend-recovery.mjs \
            --current-source-sha "$SOURCE_SHA" \
            --operation-id "$OPERATION_ID" \
            --original-source-sha "$ORIGINAL_SOURCE_SHA" \
            --original-run-id "$ORIGINAL_RUN_ID" \
            --ticket "$RECOVERY_TICKET" \
            --original-task-definition "$ORIGINAL_TASK_DEFINITION" \
            --target-task-definition "$TARGET_TASK_DEFINITION" \
            --image-digest "$IMAGE_DIGEST" \
            --cloudtrail-event-id "$CLOUDTRAIL_EVENT_ID" \
            --expected-component-generation "$EXPECTED_COMPONENT_GENERATION" \
            --environment-approval "$approval" \
            --environment-approval-sha256 "$(sha256sum "$approval" | cut -d' ' -f1)" \
            --evidence-out "$receipt_dir/evidence.json"

      - name: Preserve authenticated completion receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: historical-green-recovery-completion-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-green-receipt/evidence.json
          if-no-files-found: ignore
          retention-days: 90
