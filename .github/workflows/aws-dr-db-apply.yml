name: AWS DR DB Apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Approval-gated DB apply operation"
        required: true
        type: choice
        options:
          - apply-db-restore-approved
          - apply-region-local-db-restore-approved
      aws_region:
        description: "AWS region for OIDC session setup"
        required: true
        type: string
        default: eu-west-2
      target_region:
        description: "Target AWS region for approved DB restore"
        required: true
        type: string
      target_standby:
        description: "Selected standby region for region-local DB restore"
        required: false
        type: choice
        options:
          - mumbai
          - capetown
      snapshot_identifier:
        description: "Snapshot identifier for approved DB restore"
        required: false
        type: string
      source_db_identifier:
        description: "Source DB identifier for point-in-time approved restore"
        required: false
        type: string
      recovery_point:
        description: "Recovery point timestamp for point-in-time approved restore"
        required: false
        type: string
      target_db_identifier:
        description: "New recovery target DB identifier"
        required: true
        type: string
      db_subnet_group_name:
        description: "DB subnet group name for approved DB restore target"
        required: false
        type: string
        default: ""
      db_vpc_security_group_ids:
        description: "Comma-separated VPC security group IDs for approved DB restore target"
        required: false
        type: string
        default: ""
      db_instance_class:
        description: "DB instance class for approved region-local restore"
        required: false
        type: string
        default: db.t4g.micro
      db_port:
        description: "DB port for approved region-local restore"
        required: false
        type: string
        default: "5432"
      publicly_accessible:
        description: "Whether the recovery DB should be publicly accessible"
        required: false
        type: boolean
        default: false
      confirm_db_restore:
        description: "Must equal I_APPROVE_DB_RESTORE_TO_RECOVERY_TARGET"
        required: false
        type: string
      confirm_region_local_db_restore:
        description: "Must equal I_APPROVE_REGION_LOCAL_DB_RESTORE"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  db-restore:
    if: ${{ inputs.operation == 'apply-db-restore-approved' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dr-db-restore
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TARGET_REGION: ${{ inputs.target_region }}
      SNAPSHOT_IDENTIFIER: ${{ inputs.snapshot_identifier }}
      SOURCE_DB_IDENTIFIER: ${{ inputs.source_db_identifier }}
      RECOVERY_POINT: ${{ inputs.recovery_point }}
      TARGET_DB_IDENTIFIER: ${{ inputs.target_db_identifier }}
      DB_SUBNET_GROUP_NAME: ${{ inputs.db_subnet_group_name }}
      DB_VPC_SECURITY_GROUP_IDS: ${{ inputs.db_vpc_security_group_ids }}
      CONFIRM_DB_RESTORE: ${{ inputs.confirm_db_restore }}
      AWS_ROLE_TO_ASSUME: ${{ vars.DR_DB_RESTORE_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate DB restore approval inputs
        run: |
          set -euo pipefail
          [ "$CONFIRM_DB_RESTORE" = "I_APPROVE_DB_RESTORE_TO_RECOVERY_TARGET" ] || {
            echo "::error::confirm_db_restore must equal I_APPROVE_DB_RESTORE_TO_RECOVERY_TARGET."
            exit 2
          }
          [ -n "$TARGET_REGION" ] || { echo "::error::target_region is required."; exit 2; }
          [ -n "$TARGET_DB_IDENTIFIER" ] || { echo "::error::target_db_identifier is required."; exit 2; }
          if [ -z "$SNAPSHOT_IDENTIFIER" ] && [ -z "$SOURCE_DB_IDENTIFIER" ]; then
            echo "::error::snapshot_identifier or source_db_identifier is required."
            exit 2
          fi
          [ -n "$AWS_ROLE_TO_ASSUME" ] || { echo "::error::Set DR_DB_RESTORE_ROLE_TO_ASSUME on the dr-db-restore environment."; exit 2; }
          echo "::add-mask::$AWS_ROLE_TO_ASSUME"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ vars.DR_DB_RESTORE_ROLE_TO_ASSUME }}

      - name: Restore approved DB recovery target
        run: scripts/dr/apply-db-restore-approved.sh

      - name: Write immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/dr
          find artifacts/dr -type f -print0 | sort -z | xargs -0 shasum -a 256 > artifacts/dr/sha256-manifest.txt

      - name: Upload immutable DR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-db-restore-evidence-${{ github.run_id }}
          path: artifacts/dr
          if-no-files-found: error
          retention-days: 90

  region-local-db-restore:
    if: ${{ inputs.operation == 'apply-region-local-db-restore-approved' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dr-db-restore
    env:
      TARGET_STANDBY: ${{ inputs.target_standby }}
      TARGET_REGION: ${{ inputs.target_region }}
      SNAPSHOT_IDENTIFIER: ${{ inputs.snapshot_identifier }}
      TARGET_DB_IDENTIFIER: ${{ inputs.target_db_identifier }}
      DB_SUBNET_GROUP_NAME: ${{ inputs.db_subnet_group_name }}
      DB_VPC_SECURITY_GROUP_IDS: ${{ inputs.db_vpc_security_group_ids }}
      DB_INSTANCE_CLASS: ${{ inputs.db_instance_class }}
      DB_PORT: ${{ inputs.db_port }}
      PUBLICLY_ACCESSIBLE: ${{ inputs.publicly_accessible && 'true' || 'false' }}
      CONFIRM_REGION_LOCAL_DB_RESTORE: ${{ inputs.confirm_region_local_db_restore }}
      AWS_ROLE_TO_ASSUME: ${{ vars.DR_DB_RESTORE_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate region-local DB restore approval inputs
        run: |
          set -euo pipefail
          [ "$CONFIRM_REGION_LOCAL_DB_RESTORE" = "I_APPROVE_REGION_LOCAL_DB_RESTORE" ] || {
            echo "::error::confirm_region_local_db_restore must equal I_APPROVE_REGION_LOCAL_DB_RESTORE."
            exit 2
          }
          case "$TARGET_STANDBY" in
            mumbai|capetown) ;;
            *) echo "::error::target_standby must be mumbai or capetown."; exit 2 ;;
          esac
          [ -n "$TARGET_REGION" ] || { echo "::error::target_region is required."; exit 2; }
          [ -n "$SNAPSHOT_IDENTIFIER" ] || { echo "::error::snapshot_identifier is required."; exit 2; }
          [ -n "$TARGET_DB_IDENTIFIER" ] || { echo "::error::target_db_identifier is required."; exit 2; }
          [ -n "$DB_SUBNET_GROUP_NAME" ] || { echo "::error::db_subnet_group_name is required."; exit 2; }
          [ -n "$DB_VPC_SECURITY_GROUP_IDS" ] || { echo "::error::db_vpc_security_group_ids is required."; exit 2; }
          [ -n "$AWS_ROLE_TO_ASSUME" ] || { echo "::error::Set DR_DB_RESTORE_ROLE_TO_ASSUME on the dr-db-restore environment."; exit 2; }
          echo "::add-mask::$AWS_ROLE_TO_ASSUME"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.target_region }}
          role-to-assume: ${{ vars.DR_DB_RESTORE_ROLE_TO_ASSUME }}

      - name: Restore approved region-local DB recovery target
        run: scripts/dr/apply-region-local-db-restore-approved.sh

      - name: Write immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/dr
          find artifacts/dr -type f -print0 | sort -z | xargs -0 shasum -a 256 > artifacts/dr/sha256-manifest.txt

      - name: Upload immutable DR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-region-local-db-restore-evidence-${{ github.run_id }}
          path: artifacts/dr
          if-no-files-found: error
          retention-days: 90
