name: Verify production app-only database compatibility
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main SHA
        required: true
        type: string
      preparation_reference:
        description: Exact compact verifier-preparation artifact identity JSON
        required: true
        type: string
      recovery_journal_reference:
        description: Exact failed-run journal identity for no-write verifier registration recovery
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  operation:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/verify-production-app-only-compatibility-operation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      preparation_reference: ${{ inputs.preparation_reference }}
      recovery_journal_reference: ${{ inputs.recovery_journal_reference }}
