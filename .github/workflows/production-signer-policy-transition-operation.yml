name: Production signer policy transition authorization

on:
  workflow_call:
    inputs:
      phase: { description: Canonical signer policy transition phase, required: true, type: string }
      source_sha: { description: Exact protected main SHA, required: true, type: string }
      transition_source_sha: { description: Original signer transition source SHA, required: true, type: string }
      transition_id: { description: One-time transition UUID, required: true, type: string }

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production-signer-policy-transition
    steps:
      - uses: actions/checkout@v6
        with: { ref: '${{ inputs.source_sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - name: Authenticate exact protected source and fixed operation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PHASE: ${{ inputs.phase }}
          TRANSITION_ID: ${{ inputs.transition_id }}
          TRANSITION_SOURCE_SHA: ${{ inputs.transition_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$TRANSITION_ID" =~ ^[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-4[a-fA-F0-9]{3}-[89aAbB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}$ ]]
          [[ "$PHASE" = policy-install || "$PHASE" = policy-revoke ]]
          if [ "$PHASE" = policy-install ]; then
            test "$TRANSITION_SOURCE_SHA" = "$SOURCE_SHA"
          else
            git merge-base --is-ancestor "$TRANSITION_SOURCE_SHA" "$SOURCE_SHA"
            git diff --quiet "$TRANSITION_SOURCE_SHA..$SOURCE_SHA" -- \
              documents/ops/iam/MSCQRProductionGreenStageAReleaseS3Contract-v1.json \
              infra/aws/terraform/production-security-rebaseline-signer \
              infra/aws/terraform/production-initial-activation-policy-reconciler/signer-policy-installer-trust-policy.json \
              infra/aws/terraform/production-initial-activation-policy-reconciler/signer-policy-installer-permissions-policy.json \
              .github/workflows/production-signer-policy-transition.yml \
              .github/workflows/production-signer-policy-transition-operation.yml \
              scripts/aws/component-signer-policy-transition.mjs \
              scripts/aws/publish-production-signer-policy-transition-authorization.mjs \
              scripts/aws/production-github-environment-approval.mjs \
              scripts/aws/reconcile-production-signer-temporary-capability.mjs \
              scripts/aws/verify-production-security-rebaseline-signer.mjs \
              scripts/aws/production-signer-temporary-capability.mjs
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate solo-operator protected-environment approval
        id: approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          approval_dir="$RUNNER_TEMP/signer-policy-transition-approval"
          mkdir -p -m 700 "$approval_dir"
          test ! -L "$approval_dir"
          chmod 700 "$approval_dir"
          test "$(stat -c '%a' "$approval_dir")" = 700
          test "$(stat -c '%u' "$approval_dir")" = "$(id -u)"
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$approval_dir/approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production-signer-policy-transition \
            --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" \
            --require-actual-approval
          echo "sha256=$(sha256sum "$approval_dir/approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Build canonical broker request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSITION_ID: ${{ inputs.transition_id }}
          TRANSITION_SOURCE_SHA: ${{ inputs.transition_source_sha }}
          PHASE: ${{ inputs.phase }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
        run: |
          set -euo pipefail
          request_dir="$RUNNER_TEMP/signer-policy-transition-request"
          mkdir -p -m 700 "$request_dir"
          operation=INSTALL
          if [ "$PHASE" = policy-revoke ]; then operation=REVOKE; fi
          node scripts/aws/publish-production-signer-policy-transition-authorization.mjs \
            --source-sha "$SOURCE_SHA" --transition-id "$TRANSITION_ID" --operation "$operation" \
            --transition-source-sha "$TRANSITION_SOURCE_SHA" \
            --environment-approval "$RUNNER_TEMP/signer-policy-transition-approval/approval.json" \
            --environment-approval-sha256 "$APPROVAL_SHA256" --output "$request_dir/request.json"
      - name: Configure authorization-only signer publisher role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-signer-policy-installer
          aws-region: eu-west-2
          allowed-account-ids: '368992683803'
          role-session-name: signer-transition-${{ github.run_id }}
          unset-current-credentials: true
      - name: Archive canonical transition through immutable broker
        env: { AWS_MAX_ATTEMPTS: '1', AWS_EC2_METADATA_DISABLED: 'true' }
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/signer-policy-transition-request/request.json"
          response="$RUNNER_TEMP/signer-policy-transition-request/response.json"
          invocation="$RUNNER_TEMP/signer-policy-transition-request/invocation.json"
          aws lambda invoke --region eu-west-2 \
            --function-name arn:aws:lambda:eu-west-2:368992683803:function:mscqr-production-component-iam-installer:15 \
            --cli-binary-format raw-in-base64-out --payload "fileb://$request" "$response" > "$invocation"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'; import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/signer-policy-transition-request/';
          const invocation = JSON.parse(fs.readFileSync(root + 'invocation.json'));
          assert.equal(invocation.StatusCode, 200); assert.equal(invocation.FunctionError, undefined); assert.equal(invocation.ExecutedVersion, '15');
          const response = JSON.parse(fs.readFileSync(root + 'response.json'));
          assert.equal(response.kind, 'MSCQR_SIGNER_POLICY_BROKER_LEDGER');
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: production-signer-policy-transition-evidence
          path: ${{ runner.temp }}/signer-policy-transition-request/response.json
          if-no-files-found: error
          retention-days: 90
