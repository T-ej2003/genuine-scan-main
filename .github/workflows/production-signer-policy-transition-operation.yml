name: Production signer policy transition

on:
  workflow_call:
    inputs:
      phase:
        description: Canonical signer policy transition phase
        required: true
        type: string
      source_sha:
        description: Exact protected main SHA
        required: true
        type: string
      transition_id:
        description: One-time transition nonce
        required: true
        type: string
      evidence_base64:
        description: Required only for policy-revoke; exact private lifecycle evidence
        required: false
        type: string
      evidence_sha256:
        description: SHA-256 of evidence_base64 payload bytes
        required: false
        type: string
      abort_before_apply:
        description: Separately approved pre-apply policy abort
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  transition:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production-signer-policy-transition
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify exact protected source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          branch_policies="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-signer-policy-transition/deployment-branch-policies" --jq '[.branch_policies[] | {type, name}] | tojson')"
          test "$branch_policies" = '[{"type":"branch","name":"main"}]'
          node --input-type=module <<'NODE'
          import { assertSignerSource } from './scripts/aws/reconcile-production-signer-temporary-capability.mjs';
          assertSignerSource(process.env.SOURCE_SHA, { cleanupReadback: process.env.PHASE === 'policy-revoke' });
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate independent production approval
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          approval_dir="$RUNNER_TEMP/signer-policy-transition-approval"
          mkdir -p -m 700 "$approval_dir"
          test ! -L "$approval_dir"
          chmod 700 "$approval_dir"
          test ! -L "$approval_dir"
          test "$(stat -c '%a' "$approval_dir")" = 700
          test "$(stat -c '%u' "$approval_dir")" = "$(id -u)"
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$approval_dir/approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production-signer-policy-transition \
            --source-sha "$SOURCE_SHA" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --event-name "$GITHUB_EVENT_NAME" --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" --execution-actor "$GITHUB_ACTOR" \
            --require-actual-approval
      - name: Validate canonical transition inputs
        env:
          PHASE: ${{ inputs.phase }}
          TRANSITION_ID: ${{ inputs.transition_id }}
          EVIDENCE_BASE64: ${{ inputs.evidence_base64 }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
          ABORT_BEFORE_APPLY: ${{ inputs.abort_before_apply }}
        run: |
          set -euo pipefail
          [[ "$TRANSITION_ID" =~ ^[A-Za-z0-9._-]{8,128}$ ]]
          if [ "$PHASE" = "policy-install" ]; then
            test "$ABORT_BEFORE_APPLY" = "false"
            test -z "$EVIDENCE_BASE64" && test -z "$EVIDENCE_SHA256"
          elif [ "$PHASE" = "policy-revoke" ]; then
            [[ "$ABORT_BEFORE_APPLY" = "true" || "$ABORT_BEFORE_APPLY" = "false" ]]
            test -n "$EVIDENCE_BASE64" && test -n "$EVIDENCE_SHA256"
            test "${#EVIDENCE_BASE64}" -le 16384
            [[ "$EVIDENCE_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ && "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            test "$(printf '%s' "$EVIDENCE_BASE64" | base64 --decode | sha256sum | awk '{print $1}')" = "$EVIDENCE_SHA256"
          else
            echo "Invalid transition phase" >&2; exit 1
          fi
      - name: Configure exact signer policy installer role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::368992683803:role/mscqr-production-signer-policy-installer
          aws-region: eu-west-2
          allowed-account-ids: "368992683803"
          unset-current-credentials: true
      - name: Prepare and durably record canonical install transition
        if: inputs.phase == 'policy-install'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSITION_ID: ${{ inputs.transition_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -m 700 "$RUNNER_TEMP/signer-policy-transition"
          chmod 700 "$RUNNER_TEMP/signer-policy-transition"
          npm run production:signer-temporary-capability -- \
            --phase policy-install-prepare --source-sha "$SOURCE_SHA" --transition-id "$TRANSITION_ID" \
            --state-file "$RUNNER_TEMP/signer-policy-transition/capability.json"
      - name: Preserve pending install recovery evidence before policy mutation
        if: inputs.phase == 'policy-install'
        uses: actions/upload-artifact@v4
        with:
          name: production-signer-policy-transition-recovery
          path: ${{ runner.temp }}/signer-policy-transition/capability.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare canonical transition evidence
        env:
          PHASE: ${{ inputs.phase }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSITION_ID: ${{ inputs.transition_id }}
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_BASE64: ${{ inputs.evidence_base64 }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
          ABORT_BEFORE_APPLY: ${{ inputs.abort_before_apply }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p -m 700 "$RUNNER_TEMP/signer-policy-transition"
          chmod 700 "$RUNNER_TEMP/signer-policy-transition"
          state="$RUNNER_TEMP/signer-policy-transition/capability.json"
          if [ "$PHASE" = "policy-revoke" ]; then
            test -n "$EVIDENCE_BASE64" && test -n "$EVIDENCE_SHA256"
            test "${#EVIDENCE_BASE64}" -le 16384
            [[ "$EVIDENCE_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ && "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            printf '%s' "$EVIDENCE_BASE64" | base64 --decode > "$state"
            test "$(sha256sum "$state" | awk '{print $1}')" = "$EVIDENCE_SHA256"
            chmod 600 "$state"
          elif [ "$PHASE" != "policy-install" ] || [ -n "$EVIDENCE_BASE64" ] || [ -n "$EVIDENCE_SHA256" ]; then
            echo "Invalid transition inputs" >&2; exit 1
          fi
      - name: Preserve revoke recovery evidence before policy mutation
        if: inputs.phase == 'policy-revoke'
        uses: actions/upload-artifact@v4
        with:
          name: production-signer-policy-transition-recovery
          path: ${{ runner.temp }}/signer-policy-transition/capability.json
          if-no-files-found: error
          retention-days: 7
      - name: Apply canonical transition only
        env:
          PHASE: ${{ inputs.phase }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRANSITION_ID: ${{ inputs.transition_id }}
          GH_TOKEN: ${{ github.token }}
          ABORT_BEFORE_APPLY: ${{ inputs.abort_before_apply }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/signer-policy-transition/capability.json"
          args=(--phase "$PHASE" --source-sha "$SOURCE_SHA" --transition-id "$TRANSITION_ID" --state-file "$state")
          if [ "$PHASE" = "policy-revoke" ] && [ "$ABORT_BEFORE_APPLY" = "true" ]; then
            args+=(--abort-before-apply-confirmed)
          elif [ "$ABORT_BEFORE_APPLY" != "false" ]; then
            echo "Abort mode is valid only for policy-revoke" >&2; exit 1
          fi
          npm run production:signer-temporary-capability -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: production-signer-policy-transition-evidence
          path: ${{ runner.temp }}/signer-policy-transition/capability.json
          if-no-files-found: error
          retention-days: 7
