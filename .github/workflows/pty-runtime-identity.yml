name: PTY Runtime Identity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pty-runtime-identity.yml
      - scripts/aws/capture-pty-command.py
      - scripts/aws/staging-database-role-credentials.mjs
      - scripts/fixtures/staging-ecs-runtime-identity-*
      - scripts/lib/staging-database-role-credentials-core.mjs
      - scripts/tests/staging-database-role-runtime-identity.test.mjs

permissions:
  contents: read

jobs:
  pty-runtime-identity:
    name: PTY lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Exercise PTY capture and lifecycle safety
        run: node --test --test-name-pattern='^PTY transport' scripts/tests/staging-database-role-runtime-identity.test.mjs
