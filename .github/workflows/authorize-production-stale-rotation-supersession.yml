name: Authorize production stale rotation supersession

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Protected main source SHA, required: true, type: string }
      preparation_json_base64: { description: Canonical supersession preparation JSON, required: true, type: string }
      preparation_file_sha256: { description: Exact preparation file SHA256, required: true, type: string }

permissions:
  contents: read
  actions: read

jobs:
  authorize-stale-rotation-supersession:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Authenticate protected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "T-ej2003/genuine-scan-main"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files -z > "$RUNNER_TEMP/protected-source-files.zlist"
          while IFS= read -r -d '' file; do sha256sum -- "$file"; done < "$RUNNER_TEMP/protected-source-files.zlist" > "$RUNNER_TEMP/protected-source.sha256"
      - run: npm ci
      - name: Re-authenticate protected source after dependency installation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          while IFS= read -r -d '' file; do sha256sum -- "$file"; done < "$RUNNER_TEMP/protected-source-files.zlist" > "$RUNNER_TEMP/installed-source.sha256"
          cmp --silent "$RUNNER_TEMP/protected-source.sha256" "$RUNNER_TEMP/installed-source.sha256"
      - name: Decode exact preparation
        env:
          PREPARATION_JSON_BASE64: ${{ inputs.preparation_json_base64 }}
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/stale-supersession"
          printf '%s' "$PREPARATION_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/stale-supersession/preparation.json"
          chmod 600 "$RUNNER_TEMP/stale-supersession/preparation.json"
          test "$(sha256sum "$RUNNER_TEMP/stale-supersession/preparation.json" | awk '{print $1}')" = "$PREPARATION_FILE_SHA256"
      - name: Authenticate protected environment approval
        id: approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/aws/production-github-environment-approval.mjs \
            --output "$RUNNER_TEMP/stale-supersession/environment-approval.json" \
            --repository "$GITHUB_REPOSITORY" --environment production --source-sha "$SOURCE_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" --event-name "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-actor "$GITHUB_ACTOR" --require-actual-approval
          echo "sha256=$(sha256sum "$RUNNER_TEMP/stale-supersession/environment-approval.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Produce approved exact authorization
        env:
          PREPARATION_FILE_SHA256: ${{ inputs.preparation_file_sha256 }}
          APPROVAL_SHA256: ${{ steps.approval.outputs.sha256 }}
        run: |
          set -euo pipefail
          node scripts/aws/authorize-production-stale-rotation-supersession.mjs --authorize \
            --preparation "$RUNNER_TEMP/stale-supersession/preparation.json" --preparation-file-sha256 "$PREPARATION_FILE_SHA256" \
            --environment-approval "$RUNNER_TEMP/stale-supersession/environment-approval.json" --environment-approval-sha256 "$APPROVAL_SHA256" \
            --output "$RUNNER_TEMP/stale-supersession/authorization.json"
      - uses: actions/upload-artifact@v4
        with:
          name: production-stale-rotation-supersession-authorization
          path: ${{ runner.temp }}/stale-supersession/authorization.json
          if-no-files-found: error
          retention-days: 30
