name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/**

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-rls-package:
    name: Full RLS package verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source/package binding
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { calculateCleanRoomSourceContract } from "./scripts/rls/lib/clean-room-source-contract.mjs";
          const checksums = JSON.parse(fs.readFileSync("documents/security/rls-program/generated/checksums.json", "utf8"));
          const source = calculateCleanRoomSourceContract();
          if (checksums.sourceContractSha256 !== source.sourceContractSha256 || JSON.stringify(checksums.sourceContractInputs) !== JSON.stringify(source.inputs)) {
            console.error(JSON.stringify({
              error: "generated RLS package source contract is stale",
              generatedSourceContractSha256: checksums.sourceContractSha256,
              authoritativeSourceContractSha256: source.sourceContractSha256,
              generatedInputs: checksums.sourceContractInputs,
              authoritativeInputs: source.inputs,
            }, null, 2));
            process.exit(1);
          }
          NODE

      - name: Full RLS verification
        run: npm run rls:full-verify

  stage-b-publisher-terraform:
    name: Stage B publisher Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate locked Stage B publisher Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            infra/aws/terraform/production-green-stage-b-image-publisher
            infra/aws/terraform/production-green-stage-b-publisher-bootstrap
          )
          terraform version
          for root in "${roots[@]}"; do
            test -f "$root/.terraform.lock.hcl"
            git diff --exit-code -- "$root/.terraform.lock.hcl"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate -no-color
            git diff --exit-code -- "$root/.terraform.lock.hcl"
          done

  stage-b-deployment-closure:
    name: Stage B deployment closure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Validate complete Stage B deployment closure
        run: npm run stage-b:deployment-closure:pull-request

      - name: Record Stage B image-impact evidence availability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/stage-b-image-impact-${GITHUB_RUN_ID}.json"
          if [[ -f "$report" ]]; then
            echo "STAGE_B_IMAGE_IMPACT_ARTIFACT_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "STAGE_B_IMAGE_IMPACT_ARTIFACT_EXISTS=false" >> "$GITHUB_ENV"
            echo "::notice title=Stage B image-impact evidence unavailable::The closure producer failed before generating ${report}; the primary closure failure remains authoritative."
          fi

      - name: Upload Stage B pre-merge image-impact evidence
        if: always() && env.STAGE_B_IMAGE_IMPACT_ARTIFACT_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-image-impact-${{ github.run_id }}
          path: ${{ runner.temp }}/stage-b-image-impact-${{ github.run_id }}.json
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Baseline secret-pattern guard
        run: node scripts/check-baseline-secret-patterns.mjs

      - name: Dependency audit gate
        run: npm run check:dependency-audit

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: RF7 application and dependency contracts
        run: npm run test:rf7:static

      - name: Production read-only RLS canary PostgreSQL contract
        run: npm run test:production-green-read-only-rls-canary:integration

      - name: Security and release guardrails
        env:
          REQUIRE_RELEASE_EVIDENCE_REFS: ${{ github.ref == 'refs/heads/main' }}
          PROVENANCE_BACKFILL_EVIDENCE_REF: ${{ vars.RC_PROVENANCE_BACKFILL_EVIDENCE_REF }}
          SECRET_ROTATION_EVIDENCE_REF: ${{ vars.RC_SECRET_ROTATION_EVIDENCE_REF }}
          INCIDENT_DRILL_EVIDENCE_REF: ${{ vars.RC_INCIDENT_DRILL_EVIDENCE_REF }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npm run verify:ci:security:source
          else
            npm run verify:ci:security
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mscqr_e2e_admin_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mscqr_e2e_admin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        id: setup_node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        id: frontend_dependencies
        run: npm ci

      - name: Validate frontend E2E cleanup contract
        id: cleanup_contract
        run: node --test scripts/tests/frontend-e2e-cleanup-workflow.test.mjs

      - name: Install backend dependencies
        run: npm --prefix backend ci

      # TODO(ci-lint): flip ENFORCE_LINT_CHANGED=true and fold this back into verify:ci:frontend
      # once the existing ESLint debt no longer relies on report-only mode for changed-file checks.
      - name: Lint changed files report
        env:
          ENFORCE_LINT_CHANGED: ${{ vars.ENFORCE_LINT_CHANGED }}
        run: npm run report:lint:changed

      - name: Frontend quality contract
        run: npm run verify:ci:frontend

      - name: Generate enterprise E2E secrets and environment
        shell: bash
        run: |
          set -euo pipefail
          write_secret() {
            local name="$1"
            local value
            value="$(openssl rand -base64 36 | tr -d '\n')"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          write_secret E2E_SUPERADMIN_PASSWORD
          write_secret E2E_LICENSEE_ADMIN_PASSWORD
          write_secret E2E_MANUFACTURER_PASSWORD
          write_secret JWT_SECRET
          write_secret QR_SIGN_HMAC_SECRET_CURRENT
          write_secret TOKEN_HASH_SECRET_CURRENT
          write_secret IP_HASH_SALT_CURRENT
          write_secret INCIDENT_HASH_SALT_CURRENT
          write_secret PRINTER_SSE_SIGN_SECRET_CURRENT
          write_secret CUSTOMER_VERIFY_TOKEN_SECRET
          write_secret CUSTOMER_VERIFY_OTP_SECRET
          write_secret SCAN_FINGERPRINT_SECRET
          write_secret AUTH_MFA_ENCRYPTION_KEY

          write_backup_codes() {
            local name="$1"
            local joined=""
            for attempt in 1 2 3; do
              local raw
              local code
              raw="$(openssl rand -hex 5 | tr '[:lower:]' '[:upper:]')"
              code="${raw:0:5}-${raw:5:5}"
              echo "::add-mask::$code"
              if [ -z "$joined" ]; then
                joined="$code"
              else
                joined="${joined},${code}"
              fi
            done
            echo "::add-mask::$joined"
            printf '%s=%s\n' "$name" "$joined" >> "$GITHUB_ENV"
          }

          write_backup_codes E2E_SUPERADMIN_MFA_BACKUP_CODES
          write_backup_codes E2E_LICENSEE_ADMIN_MFA_BACKUP_CODES
          write_backup_codes E2E_MANUFACTURER_MFA_BACKUP_CODES

          E2E_DB_PROTOCOL=postgresql
          E2E_DB_USER=postgres
          E2E_DB_HOST=127.0.0.1
          E2E_DB_PORT=5432
          E2E_DB_NAME=mscqr_e2e_admin_test

          {
            echo "NODE_ENV=test"
            echo "PORT=4000"
            echo "E2E_DB_PROTOCOL=${E2E_DB_PROTOCOL}"
            echo "E2E_DB_USER=${E2E_DB_USER}"
            echo "E2E_DB_HOST=${E2E_DB_HOST}"
            echo "E2E_DB_PORT=${E2E_DB_PORT}"
            echo "E2E_DB_NAME=${E2E_DB_NAME}"
            echo "P2_TEST_DATABASE_REQUIRED=true"
            echo "P2_TEST_DATABASE_ADMIN_URL=${E2E_DB_PROTOCOL}://${E2E_DB_USER}@${E2E_DB_HOST}:${E2E_DB_PORT}/${E2E_DB_NAME}"
            echo "REDIS_URL=redis://127.0.0.1:6379/0"
            echo "REDIS_TLS=false"
            echo "COOKIE_SECURE=false"
            echo "AUTH_LEGACY_TOKEN_RESPONSE_ENABLED=false"
            echo "RUN_BACKGROUND_WORKERS=false"
            echo "CORS_ORIGIN=http://127.0.0.1:8080,http://localhost:8080"
            echo "AUTH_RISK_STEPUP_THRESHOLD=101"
            echo "AUTH_RISK_BLOCK_THRESHOLD=101"
            echo "EMAIL_USE_JSON_TRANSPORT=true"
            echo "PRINT_AGENT_REQUIRE_SIGNATURE=false"
            echo "PRINT_AGENT_REQUIRE_MTLS=false"
            echo "VITE_API_PROXY_TARGET=http://127.0.0.1:4000"
            echo "E2E_START_BACKEND=true"
            echo "E2E_REQUIRE_ENTERPRISE_SMOKE=true"
            echo "E2E_EXPOSE_CUSTOMER_OTP=true"
            echo "E2E_SUPERADMIN_EMAIL=e2e-super-admin@mscqr.example"
            echo "E2E_LICENSEE_ADMIN_EMAIL=e2e-licensee-admin@mscqr.example"
            echo "E2E_MANUFACTURER_EMAIL=e2e-manufacturer@mscqr.example"
            echo "E2E_LICENSEE_BATCH_QUERY=E2E Source Batch"
            echo "E2E_ASSIGN_MANUFACTURER_NAME=E2E Manufacturer"
            echo "E2E_ASSIGN_QUANTITY=1"
            echo "E2E_MANUFACTURER_BATCH_QUERY=E2E Manufacturer Print Batch"
            echo "E2E_PRINTER_PROFILE_NAME=E2E Local Agent Printer"
            echo "E2E_PRINT_QUANTITY=1"
            echo "E2E_VERIFY_CODE=E2E0000000999"
            echo "E2E_REPORT_EMAIL=e2e-customer@mscqr.example"
            echo "PUBLIC_VERIFY_WEB_BASE_URL=http://127.0.0.1:8080"
            echo "PUBLIC_SCAN_WEB_BASE_URL=http://127.0.0.1:8080"
            echo "PUBLIC_ADMIN_WEB_BASE_URL=http://127.0.0.1:8080"
            echo "WEB_APP_BASE_URL=http://127.0.0.1:8080"
          } >> "$GITHUB_ENV"

      - name: Build and prepare enterprise E2E backend
        id: enterprise_db_setup
        run: |
          npm --prefix backend run build
          node scripts/enterprise-e2e-db.mjs prepare

      - name: Seed enterprise E2E backend
        run: |
          npm --prefix backend run test:e2e:seed

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r source_file; do
            sudo mv "$source_file" "${source_file}.disabled"
          done < <(sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname "*microsoft*" -o -iname "*azure-cli*" \) -print)
          npx playwright install --with-deps chromium
      - name: Playwright smoke suite
        env:
          NODE_ENV: test
          EMAIL_USE_JSON_TRANSPORT: "true"
          E2E_EXPOSE_CUSTOMER_OTP: "true"
          E2E_START_BACKEND: "true"
        run: npm run verify:ci:frontend:e2e

      - name: Clean disposable enterprise E2E database
        if: >-
          always() &&
          steps.checkout.outcome == 'success' &&
          steps.enterprise_db_setup.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/enterprise-e2e-db.mjs || {
            echo "::error::enterprise E2E cleanup script is missing after successful checkout."
            exit 1
          }
          node scripts/enterprise-e2e-db.mjs cleanup

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Backend quality contract
        run: npm run verify:ci:backend

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mscqr_integration_admin_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mscqr_integration_admin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      P2_TEST_DATABASE_REQUIRED: "true"
      P2_TEST_DB_PROTOCOL: postgresql
      P2_TEST_DB_USER: postgres
      P2_TEST_DB_HOST: 127.0.0.1
      P2_TEST_DB_PORT: "5432"
      P2_TEST_DB_NAME: mscqr_integration_admin_test
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_TLS: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Disposable system integration suite
        run: |
          admin_scheme="${P2_TEST_DB_PROTOCOL}:"
          admin_authority="${P2_TEST_DB_USER}@${P2_TEST_DB_HOST}:${P2_TEST_DB_PORT}"
          P2_TEST_DATABASE_ADMIN_URL="${admin_scheme}//${admin_authority}/${P2_TEST_DB_NAME}" npm run test:integration:ci

      - name: Upload system integration artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-integration-artifacts
          path: |
            playwright-report/system-integration
            test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker verification contract
        run: npm run verify:ci:docker
