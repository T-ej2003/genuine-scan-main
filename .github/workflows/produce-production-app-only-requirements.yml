name: Produce canonical app-only database requirements

on:
  workflow_dispatch:
    inputs:
      source_sha: { description: Exact protected-main SHA, required: true, type: string }
      candidate_source_sha: { description: Authenticated candidate image source SHA, required: true, type: string }

permissions: { contents: read }
concurrency: { group: app-only-source-requirements, cancel-in-progress: false }

jobs:
  requirements:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate protected source and exact candidate ancestry
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$CANDIDATE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(gh api repos/T-ej2003/genuine-scan-main/branches/main --jq .commit.sha)"
          git merge-base --is-ancestor "$CANDIDATE_SOURCE_SHA" "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend
      - run: npx --no-install prisma generate
        working-directory: backend
      - name: Install local PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start the canonical disposable PostgreSQL harness
        run: npm run test:p2:db:up
      - name: Certify source package and produce private requirements
        id: produce
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          umask 077
          result="$(node scripts/aws/produce-production-app-only-requirements.mjs "$SOURCE_SHA" "$CANDIDATE_SOURCE_SHA")"
          printf 'path=%s\n' "$(jq -r .artifactPath <<<"$result")" >> "$GITHUB_OUTPUT"
          printf 'security_rebaseline_path=%s\n' "$(jq -r .securityRebaselinePath <<<"$result")" >> "$GITHUB_OUTPUT"
          printf 'Requirements SHA-256: `%s`\n\nSource-only certification; not live compatibility or deployment approval.\n' "$(jq -r .requirementsSha256 <<<"$result")" >> "$GITHUB_STEP_SUMMARY"
          printf '\nCanonical security catalogue SHA-256: `%s`\n' "$(jq -r .canonicalSecurityCatalogueSha256 <<<"$result")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: production-app-only-requirements
          path: ${{ steps.produce.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: production-security-rebaseline-canonical
          path: ${{ steps.produce.outputs.security_rebaseline_path }}
          if-no-files-found: error
          retention-days: 7
