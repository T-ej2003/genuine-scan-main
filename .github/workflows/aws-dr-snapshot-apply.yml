name: AWS DR Snapshot Apply

on:
  workflow_dispatch:
    inputs:
      source_region:
        description: "Source AWS region for cross-region snapshot copy"
        required: true
        type: string
        default: eu-west-2
      target_region:
        description: "Target AWS region for copied snapshot"
        required: true
        type: string
        default: ap-south-1
      source_snapshot_identifier:
        description: "Source snapshot identifier for approved cross-region snapshot copy"
        required: false
        type: string
      source_snapshot_arn:
        description: "Optional source snapshot ARN for approved cross-region snapshot copy"
        required: false
        type: string
      target_snapshot_identifier:
        description: "Target snapshot identifier for approved cross-region snapshot copy"
        required: true
        type: string
      target_kms_key_id:
        description: "Optional target-region KMS key ID for encrypted snapshot copy"
        required: false
        type: string
      confirm_snapshot_copy:
        description: "Must equal I_APPROVE_CROSS_REGION_SNAPSHOT_COPY"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  snapshot-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dr-db-restore
    env:
      SOURCE_REGION: ${{ inputs.source_region }}
      TARGET_REGION: ${{ inputs.target_region }}
      SOURCE_SNAPSHOT_IDENTIFIER: ${{ inputs.source_snapshot_identifier }}
      SOURCE_SNAPSHOT_ARN: ${{ inputs.source_snapshot_arn }}
      TARGET_SNAPSHOT_IDENTIFIER: ${{ inputs.target_snapshot_identifier }}
      TARGET_KMS_KEY_ID: ${{ inputs.target_kms_key_id }}
      CONFIRM_SNAPSHOT_COPY: ${{ inputs.confirm_snapshot_copy }}
      AWS_ROLE_TO_ASSUME: ${{ vars.DR_DB_RESTORE_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate snapshot copy approval inputs
        run: |
          set -euo pipefail
          [ "$CONFIRM_SNAPSHOT_COPY" = "I_APPROVE_CROSS_REGION_SNAPSHOT_COPY" ] || {
            echo "::error::confirm_snapshot_copy must equal I_APPROVE_CROSS_REGION_SNAPSHOT_COPY."
            exit 2
          }
          [ -n "$SOURCE_REGION" ] || { echo "::error::source_region is required."; exit 2; }
          [ -n "$TARGET_REGION" ] || { echo "::error::target_region is required."; exit 2; }
          if [ -z "$SOURCE_SNAPSHOT_IDENTIFIER" ] && [ -z "$SOURCE_SNAPSHOT_ARN" ]; then
            echo "::error::source_snapshot_identifier or source_snapshot_arn is required."
            exit 2
          fi
          [ -n "$TARGET_SNAPSHOT_IDENTIFIER" ] || { echo "::error::target_snapshot_identifier is required."; exit 2; }
          [ -n "$AWS_ROLE_TO_ASSUME" ] || { echo "::error::Set DR_DB_RESTORE_ROLE_TO_ASSUME on the dr-db-restore environment."; exit 2; }
          echo "::add-mask::$AWS_ROLE_TO_ASSUME"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.target_region }}
          role-to-assume: ${{ vars.DR_DB_RESTORE_ROLE_TO_ASSUME }}

      - name: Copy approved snapshot to target region
        run: scripts/dr/apply-cross-region-snapshot-copy-approved.sh

      - name: Write immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/dr
          find artifacts/dr -type f -print0 | sort -z | xargs -0 shasum -a 256 > artifacts/dr/sha256-manifest.txt

      - name: Upload immutable DR evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dr-snapshot-copy-evidence-${{ github.run_id }}
          path: artifacts/dr
          if-no-files-found: error
          retention-days: 90
