name: Prepare live-compatible app-only deployment
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main SHA
        required: true
        type: string
      compatibility_reference:
        description: Exact compact successful verifier artifact identity JSON
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  operation:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    uses: ./.github/workflows/prepare-production-app-only-deployment-operation.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      compatibility_reference: ${{ inputs.compatibility_reference }}
