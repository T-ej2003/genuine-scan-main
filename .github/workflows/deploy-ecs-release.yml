name: Deploy ECS Release (disabled legacy entrypoint)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

# This historical direct writer is intentionally retained as a visible,
# fail-closed tombstone. Production mutation belongs only to release-gate.yml.
jobs:
  legacy-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled production writer
        run: |
          echo "::error::deploy-ecs-release.yml is retired. Use release-train.yml -> release-gate.yml."
          exit 1
