[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-webapp-cost-optimizer"
version = "0.1.0"
description = "Read-only AWS web app cost optimization evidence analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "T-ej2003"}]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aws-webapp-cost-optimizer = "aws_webapp_cost_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
