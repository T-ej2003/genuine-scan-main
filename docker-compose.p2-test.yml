name: mscqr-p2-auth-security

services:
  p2-postgres:
    image: public.ecr.aws/docker/library/postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    container_name: mscqr-p2-auth-security-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mscqr_p2_admin_test
      POSTGRES_USER: mscqr_p2_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mscqr_p2_test -d mscqr_p2_admin_test"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./scripts/p2-postgres18-init.sql:/docker-entrypoint-initdb.d/10-certification-administrator.sql:ro

  p2-redis:
    image: public.ecr.aws/docker/library/redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: mscqr-p2-auth-security-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
